# Supabase project config (auto-loaded by the Supabase CLI / Edge Function
# deploy tooling). For function-level settings only — project settings live
# in the Dashboard.

project_id = "zoacryukmdeivmolvyhj"

# ⚠ `supabase config push` semantics: declaring ANY [auth] subsection pushes the
# WHOLE auth group -- every UNDECLARED field resets to CLI defaults, and in a
# non-TTY shell the confirm prompt auto-accepts. That exact combination reset
# production auth on 2026-07-16 (site_url -> localhost, redirect URLs lost,
# Confirm-Email off) before this block existed. Everything below is therefore
# the DECLARED production truth: keep it in sync with the dashboard, and never
# push with a partial [auth] block again.
#
# ⚠ Second bite (2026-07-18): the reset ALSO applies to [auth.external.*] --
# the confirmation-template push flipped the UNDECLARED apple provider from
# enabled to disabled in production (google/kakao/github happened to survive;
# do not rely on that). Until a provider is declared here with its real values
# (secrets via env(), never literals), every push is a loaded gun pointed at
# it. Same push also tried to enable paid storage vector buckets from the CLI
# default and died with a 402; [storage.vector] below pins that off.
[auth]
enabled = true
site_url = "https://simon-yhkim.github.io/2nd-B/"
additional_redirect_urls = [
  "https://simon-yhkim.github.io/2nd-B/**",
  "secondbrain://**",
  "http://localhost:8081/**",
  "https://simon-yhkim.github.io/2nd-B/",
  "secondbrain://",
]

[auth.email]
enable_signup = true
# Confirm Email stays ON (the #1009 email-confirmation track depends on it; the
# 0018 autoconfirm trigger masks it user-side until 0086 lands).
enable_confirmations = true

# Recovery email: show the 6-digit code the in-screen OTP reset flow (#1013)
# verifies, alongside the classic link (both consume the same token).
[auth.email.template.recovery]
subject = "[2nd-Brain] 비밀번호 재설정 인증번호 / Password reset code"
content_path = "./supabase/templates/recovery.html"

# Confirmation email: CODE-ONLY, deliberately no link. Gmail spam-buckets mail
# carrying *.supabase.co auth links (A/B-verified 2026-07-18: same sender and
# auth stack, the link alone flips inbox -> spam), which silently buried every
# Gmail sign-up confirmation. The 6-digit {{ .Token }} verifies in-screen on
# /sign-up (verifySignUpCode, type "signup"); links in already-sent mail keep
# working through the existing callback path.
[auth.email.template.confirmation]
subject = "[2nd-Brain] 가입 확인 코드 / Sign-up confirmation code"
content_path = "./supabase/templates/confirmation.html"

# RESTORE NOTE (2026-07-18): the apple provider was reset to disabled by a
# config push (see the warning above) and must be re-enabled in the dashboard
# (Authentication > Providers > Apple: Services ID + secret from the 07-16
# setup). Once restored, declare it for real so a push can never kill it again:
# [auth.external.apple]
# enabled = true
# client_id = "<Services ID(s), comma-separated>"
# secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
# Vector buckets are a paid-tier feature; the CLI default (enabled) makes every
# config push attempt to turn them on and fail with a 402 on this free-tier
# project. Pin the declared truth to off.
enabled = false

[functions.gemini-proxy]
verify_jwt = true

[functions.claude-proxy]
# Anthropic backend for D-26 Phase 2 purpose-keyed vendor routing (and the
# legacy EXPO_PUBLIC_REASONING_PROVIDER=claude seam). Mirrors gemini-proxy's
# security boundary; the ANTHROPIC_API_KEY stays in Edge Function Secrets
# (never the client bundle). verify_jwt=true so only signed-in users reach
# the paid model.
verify_jwt = true

[functions.openai-proxy]
# OpenAI backend for D-26 Phase 2. Serves ONLY its seated purposes
# (cluster_infer, safety_classify — both purpose-allowlisted 400 otherwise;
# note neither seat is client-wired yet, so all legitimate traffic is future).
# Fork of claude-proxy: same crisis gate, same SHARED per-user/day spend
# counter (bump_gemini_spend), same premium gate + audit. OPENAI_API_KEY
# stays in Edge Function Secrets. Never deploy --no-verify-jwt.
verify_jwt = true

[functions.delete-account]
# Terminal account erasure (GDPR/PIPA). verify_jwt=true so the gateway
# validates the caller; the function erases ONLY the caller's own account
# (user_id derived from the JWT, never from the request body).
verify_jwt = true

[functions.export-account]
# Subject data portability (GDPR Art.20 / PIPA). verify_jwt=true so the gateway
# validates the caller; the function exports ONLY the caller's own data
# (user_id derived from the JWT, never from the request body), the same
# IDOR-safety contract as delete-account. Never deploy with --no-verify-jwt.
verify_jwt = true

[functions.subscription-manage]
# Self-serve subscription cancel + refund request (0115). verify_jwt=true so the
# gateway validates the caller; the function acts ONLY on the caller's own
# subscription (user_id from the JWT, and the Paddle subscription/transaction ids
# resolved server-side from paddle_webhook_events, never from the request body).
# It spends money at Paddle, so this is the strictest boundary in the file.
# Never deploy with --no-verify-jwt.
verify_jwt = true

[functions.paddle-webhook]
# Paddle sends no Supabase JWT, so the gateway must NOT demand one. The function
# is its own auth boundary: a Paddle source-IP allowlist, then an HMAC-SHA256
# signature over `ts:rawBody` with a 5-minute replay window, then event-id
# idempotency in apply_billing_event. Undeclared until 0118, which meant its
# verify_jwt was whatever the last manual deploy passed - and the CLI default is
# TRUE, so the next redeploy without a flag would have 401'd every Paddle
# delivery and silently stopped all billing.
verify_jwt = false

[functions.rewarded-ssv]
# AdMob server-side verification callback: Google sends no Supabase JWT. The
# function verifies an ECDSA signature against Google's rotating verifier keys
# and dedupes on transaction_id. Same redeploy hazard as paddle-webhook.
verify_jwt = false

[functions.peer-respond]
# TRUE, matching what is live (v42) and what the caller actually sends. The
# informant has no account, but src/lib/peer/peer-respond.ts posts
# `authorization: Bearer <anon key>`, and the publishable key IS a valid token,
# so the gateway check passes. Declaring false here would have LOOSENED the
# gateway on the next deploy - the opposite of the point. The real boundary is
# inside the function: a SHA-256 comparison against a one-time invitation token.
verify_jwt = true

[functions.oauth-naver]
# Pre-auth endpoint - the function IS the auth boundary: it validates the user
# via Naver's OAuth and only then mints a Supabase session. (Kakao uses the
# native Supabase provider now, so it has no edge function.)
verify_jwt = false

[functions.rss-proxy]
# Web CORS proxy for the curated RSS feeds (Codex P2 #4). verify_jwt=true so only
# signed-in app users can call it (not an open relay); the function fetches ONLY
# an exact-match URL from the feeds allowlist (SSRF guard). Must be deployed for
# the web build's news digest to work; native fetches feeds directly.
verify_jwt = true

[functions.xai-proxy]
# The Grok backend, a sibling of gemini/claude/openai-proxy. It was the ONLY
# authenticated proxy without an explicit verify_jwt declaration here (audit
# 260904 M-01); the live deploy already runs verify_jwt=true, so this closes a
# config-drift gap, not a live hole. The declaration matters because the gateway
# is the ONLY thing that verifies the JWT SIGNATURE: the function's own code
# (via the shared userIdFromJwt helper) checks role==='authenticated' and reads
# sub WITHOUT re-verifying the signature. If a deploy ever left verify_jwt off,
# an UNSIGNED forged token claiming role==='authenticated' would sail past the
# code gate. Pinned true so the two layers can never drift apart silently.
verify_jwt = true
