<!DOCTYPE html>
<html lang="ko" data-palette="midnight" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로필 캐릭터 · 직업 아바타 샘플</title>
<link rel="stylesheet" href="../_ds/pixel-clay-design-system-ca692b6f-ca02-4536-8de2-d5b398695f65/styles.css">
<link rel="stylesheet" href="px-bridge.css">
<link rel="stylesheet" href="pixel-deepspace.css">
<style>
*{box-sizing:border-box}
html{background:#060b18}
body{margin:0;padding:42px 46px 54px;background:#060b18;color:#f4ead5;font-family:"Galmuri11",system-ui,sans-serif;min-width:1180px}
.focus{max-width:1320px;margin:0 auto}
.eyebrow{font:700 11px/1.4 "GalmuriMono11",monospace;letter-spacing:.16em;color:#e6b96b;margin-bottom:10px}
h1{font:700 31px/1.35 "Galmuri11",sans-serif;margin:0;color:#fff4da}
.lede{margin:10px 0 28px;color:#9eabc4;font-size:13px;line-height:1.65}
.state-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sample-card,.job-card{background:#111a2b;box-shadow:0 0 0 2px #26344c,4px 4px 0 #02050c}
.sample-card{padding:14px}
.stage{height:196px;background:#09101e;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #1b2940}
.stage svg{display:block;width:176px;height:176px}
.sample-copy{padding:12px 2px 2px;display:flex;flex-direction:column;gap:5px}
.sample-copy strong{font-size:12px;color:#fff4da}
.sample-copy span{font:10px/1.5 "GalmuriMono11",monospace;color:#9eabc4;min-height:30px}
.sample-copy em{font:700 9px/1.4 "GalmuriMono11",monospace;color:#e6b96b;font-style:normal}
.divider{height:2px;background:#26344c;margin:32px 0 22px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
h2{font:700 17px/1.4 "Galmuri11",sans-serif;color:#fff4da;margin:0}
.section-head span{font:10px/1.4 "GalmuriMono11",monospace;color:#71819e}
.job-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.job-card{padding:8px;text-align:center}
.job-stage{height:112px;background:#09101e;display:grid;place-items:center;margin-bottom:8px}
.job-stage svg{display:block;width:112px;height:112px}
.job-card strong{display:block;font-size:10px;color:#fff4da;margin-bottom:4px}
.job-card span{display:block;font:8px/1.3 "GalmuriMono11",monospace;color:#71819e;min-height:21px}
svg{image-rendering:pixelated;shape-rendering:crispEdges}
.legend{display:flex;gap:18px;margin-top:18px;font:9px/1.4 "GalmuriMono11",monospace;color:#71819e}
.legend b{color:#e6b96b}
</style>
</head>
<body>
<main id="avatar-system-sample" class="focus">
  <div class="eyebrow">PIXEL-CLAY v4 · AVATAR64</div>
  <h1>한 캐릭터, 두 레이어</h1>
  <p class="lede">프로필에서 만든 한 사람의 얼굴과 색을 그대로 두고, 아바타 화면에서 직업 복장만 위에 합성합니다.</p>
  <section class="state-grid" id="states" aria-label="직업 합성 상태 비교"></section>

  <div class="divider"></div>
  <div class="section-head">
    <h2>12개 분야 직업 미리보기</h2>
    <span>44 JOBS · SAME PROFILE</span>
  </div>
  <section class="job-grid" id="jobs" aria-label="직업 분야 미리보기"></section>
  <div class="legend">
    <span><b>64×64</b> 정수 Rect only</span>
    <span><b>0</b> 곡선</span>
    <span><b>0</b> 안티에일리어싱</span>
    <span><b>동물 직업</b> 범위 밖</span>
  </div>
</main>

<script src="px-avatar64.js"></script>
<script>
(function(){
  var A=window.PXAvatar64;
  function avatar(spec,size){return A.svg(spec,size||176);}
  function card(title,sub,spec,badge){
    return '<article class="sample-card"><div class="stage">'+avatar(spec,176)+'</div>'+
      '<div class="sample-copy"><strong>'+title+'</strong><span>'+sub+'</span>'+
      (badge?'<em>'+badge+'</em>':'')+'</div></article>';
  }

  var base=A.spec('hustlek-profile-sample',{
    type:'human',hair:'wavelong',hairColor:'#5a3820',skin:'#e0aa78',eye:'#2f5fc0',
    cloth:'#8f6fb5',expr:'smile',acc:'earrings',face:'glasses',job:null
  });
  document.getElementById('states').innerHTML=[
    card('01 · 내 캐릭터','프로필에서 만든 외형·색',base,'레이어 1'),
    card('02 · 경찰 유니폼','모자·유니폼·소품 합성',Object.assign({},base,{job:'police'}),'귀걸이 유지'),
    card('03 · 내 옷 색 유지','직업 특징은 유지, 옷 색 복원',Object.assign({},base,{job:'police',wearUniform:false}),'D2 선택'),
    card('04 · 헤드폰 자리 양보','모자와 겹치는 소품만 숨김',Object.assign({},base,{job:'police',acc:'headphone'}),'D1 안내'),
    card('05 · 직업 없음','원래 캐릭터 완전 복원',Object.assign({},base,{job:null,wearUniform:false}),'되돌리기')
  ].join('');

  document.getElementById('jobs').innerHTML=A.JOB_GROUPS.map(function(group){
    var job=A.JOB.filter(function(item){return item.group===group.id;})[0];
    var preview=Object.assign({},base,{job:job.id,acc:'earrings'});
    return '<article class="job-card"><div class="job-stage">'+avatar(preview,112)+'</div>'+
      '<strong>'+job.ko+'</strong><span>'+group.ko+'</span></article>';
  }).join('');
  document.documentElement.dataset.sampleReady='true';
})();
</script>
</body>
</html>
