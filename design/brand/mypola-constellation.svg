<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -36 220 243" width="220" height="243" role="img" aria-label="mypola constellation figure">
  <title>mypola — 별자리 도형 (북두칠성 + 북극성)</title>
  <desc>
    좌표는 저장소 캐논(design/proto_rev2/reference-app/data/core/constellation.json)의
    실제 별 좌표를 1:1 로 옮긴 것이다. 손으로 그린 장식이 아니라 앱이 홈에서 그리는
    바로 그 도형이라, "쓰고 있는 표장"과 "출원하는 표장"이 같다.
    별은 PIXEL-CLAY 규율대로 정수 rect 두 장이 교차하는 4방향 별이다(라운드 0).
    색은 currentColor 한 색뿐 — 상표 출원본은 흑백이어야 하고, 단색이어야 축소·팩스·
    자수 어느 매체에서도 같은 모양으로 남는다.
  </desc>
  <g fill="currentColor">
    <!-- 북두칠성 국자 + 자루. 캐논 lines 배열 그대로. -->
    <g fill="none" stroke="currentColor" stroke-width="2" opacity="0.55">
      <path d="M228,90 L230,131 L174,152 L151,126 Z" />
      <path d="M151,126 L108,135 L76,143 L50,187" />
      <!-- 지극선: Merak → Dubhe → Polaris. 실제 하늘에서 북극성을 찾는 그 선이다. -->
      <path d="M230,131 L228,90 L140,-16" stroke-dasharray="4 5" opacity="0.75" />
    </g>

    <!-- 북극성 (Polaris) — 가장 크다. 계층이 도형 안에서도 유지된다. -->
    <rect x="131" y="-19" width="18" height="6" />
    <rect x="137" y="-25" width="6" height="18" />

    <!-- 일곱 별. 순서: Dubhe · Merak · Phecda · Megrez · Alioth · Mizar · Alkaid -->
    <rect x="223" y="88" width="10" height="4" /><rect x="226" y="85" width="4" height="10" />
    <rect x="225" y="129" width="10" height="4" /><rect x="228" y="126" width="4" height="10" />
    <rect x="169" y="150" width="10" height="4" /><rect x="172" y="147" width="4" height="10" />
    <rect x="146" y="124" width="10" height="4" /><rect x="149" y="121" width="4" height="10" />
    <rect x="103" y="133" width="10" height="4" /><rect x="106" y="130" width="4" height="10" />
    <rect x="71" y="141" width="10" height="4" /><rect x="74" y="138" width="4" height="10" />
    <rect x="45" y="185" width="10" height="4" /><rect x="48" y="182" width="4" height="10" />
  </g>
</svg>
