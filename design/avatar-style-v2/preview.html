<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2ndB 승인 스타일 아바타 검수</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101824; color: #f7f2e8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1280px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #b6c6d8; line-height: 1.6; }
    .layout { display: grid; grid-template-columns: minmax(250px, 340px) minmax(280px, 1fr); gap: 24px; }
    .panel { background: #1a2738; border: 1px solid #40516a; padding: 18px; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    select, input, button { font: inherit; }
    select, input[type=color], button { min-height: 40px; background: #101824; color: #f7f2e8; border: 1px solid #738ca8; border-radius: 0; padding: 7px; }
    input[type=color] { width: 100%; padding: 3px; }
    input[type=checkbox] { width: 20px; height: 20px; }
    .check { flex-direction: row; align-items: center; }
    .stage { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; }
    .sample { display: grid; gap: 8px; max-width: 384px; }
    .sample span { color: #b6c6d8; font-size: 12px; }
    .sprite { width: min(100%, 384px); aspect-ratio: 1; background: #101824; }
    .sprite svg { display: block; width: 100%; height: 100%; }
    .reference { display: block; width: min(100%, 384px); height: auto; aspect-ratio: 1; object-fit: contain; background: #101824; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button { cursor: pointer; padding-inline: 16px; }
    button:hover, select:hover { border-color: #f7f2e8; }
    :focus-visible { outline: 3px solid #f6d27b; outline-offset: 2px; }
    details { margin-top: 24px; }
    details a { color: #9dd2f0; margin-right: 12px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; margin: 14px 0 24px; }
    .gallery figure { margin: 0; padding: 8px; border: 1px solid #40516a; background: #1a2738; }
    .gallery img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
    .gallery figcaption { margin-top: 6px; color: #b6c6d8; font-size: 12px; overflow-wrap: anywhere; }
    @media (max-width: 750px) { .layout { grid-template-columns: 1fr; } body { padding: 12px; } }
  </style>
</head>
<body>
<main>
  <h1>승인 이미지 기준 아바타 생성기 검수</h1>
  <p>첨부 승인본과 조합 결과를 나란히 확인합니다. 헤어·얼굴·옷을 독립적으로 선택할 수 있으며, 이 화면은 앱에 연결하기 전의 검수 도구입니다.</p>
  <div class="layout">
    <section class="panel" aria-label="아바타 설정">
      <div class="fields">
        <label>종류<select id="type"><option value="human">사람</option><option value="animal">동물</option></select></label>
        <label>헤어<select id="hair"></select></label>
        <label>얼굴 장식<select id="face"></select></label>
        <label>표정<select id="expr"></select></label>
        <label>액세서리<select id="acc"></select></label>
        <label>동물 종<select id="species"></select></label>
        <label>직업<select id="job"></select></label>
        <label>갈아입을 옷<select id="garmentId"></select></label>
        <label>피부색<input id="skin" type="color" value="#c98e5e"></label>
        <label>머리색<input id="hairColor" type="color" value="#2b211b"></label>
        <label>눈 색<input id="eye" type="color" value="#3a2a1e"></label>
        <label>옷 색<input id="cloth" type="color" value="#7d9463"></label>
        <label>보조 옷 색<input id="cloth2" type="color" value="#d97757"></label>
        <label>털색<select id="fur"></select></label>
        <label class="check"><input id="wearUniform" type="checkbox" checked>직업 기본 복장 사용</label>
      </div>
      <div class="actions"><button id="reset" type="button">기준 조합으로</button><button id="download" type="button">512px PNG 저장</button></div>
      <p id="note" role="status"></p>
    </section>
    <section class="panel" aria-label="아바타 미리보기">
      <div class="stage">
        <div class="sample"><span>현재 조합 · 512px 렌더</span><div class="sprite" id="preview"></div></div>
        <div class="sample"><span>사용자 승인 원본</span><img class="reference" src="approved-human-reference.png" width="384" height="384" alt="큰 사각 안경과 어두운 올리브색 옷의 승인 아바타"></div>
        <div class="sample"><span>옷 갈아입히기 참고</span><img class="reference" src="wardrobe-hoodie-reference.png" width="384" height="384" alt="같은 캐릭터가 붉은 후드티를 입은 참고 이미지"></div>
        <div class="sample"><span>동물 스타일 참고</span><img class="reference" src="animal-cat-reference.png" width="384" height="384" alt="같은 스타일의 고양이 아바타 참고 이미지"></div>
      </div>
    </section>
  </div>
  <details><summary>전체 선택지 검수 시트</summary>
    <div id="catalogGallery"></div>
  </details>
</main>
<script src="avatar64.js"></script>
<script src="approved-style-renderer.js"></script>
<script>
  const A = window.PXAvatar64;
  const R = window.ApprovedStyleRenderer;
  const $ = (id) => document.getElementById(id);
  const catalogs = { hair: A.HAIR, face: A.FACE, expr: A.EXPR, acc: A.ACC, species: A.ANIMAL, job: A.JOB, garmentId: A.GARMENT };
  for (const [key, items] of Object.entries(catalogs)) {
    if (key === 'job') $('job').add(new Option('직업 없음', ''));
    if (key === 'garmentId') $('garmentId').add(new Option('직업 기본 복장', ''));
    for (const item of items) $(key).add(new Option(item.ko, item.id));
  }
  const galleryGroups = [
    ['hair', '헤어', A.HAIR], ['accessory', '액세서리', A.ACC], ['face', '얼굴 장식', A.FACE],
    ['expression', '표정', A.EXPR], ['animal', '동물', A.ANIMAL], ['job', '직업', A.JOB], ['garment', '옷', A.GARMENT]
  ];
  for (const [group, title, items] of galleryGroups) {
    const heading = document.createElement('h2'); heading.textContent = `${title} · ${items.length}`;
    const grid = document.createElement('div'); grid.className = 'gallery';
    for (const item of items) {
      const figure = document.createElement('figure');
      const image = document.createElement('img'); image.src = `assets/${group}/${item.id}.png`; image.loading = 'lazy'; image.alt = `${item.ko} 아바타`;
      const caption = document.createElement('figcaption'); caption.textContent = item.ko;
      figure.append(image, caption); grid.append(figure);
    }
    $('catalogGallery').append(heading, grid);
  }
  const defaults = { type: 'human', hair: 'sidepart', face: 'glasses', expr: 'smile', acc: 'none', species: 'cat', job: '', garmentId: '', skin: '#c98e5e', hairColor: '#2b211b', eye: '#3a2a1e', cloth: '#696949', cloth2: '#d97757', wearUniform: true };
  function reset() { for (const [key, value] of Object.entries(defaults)) { if (key === 'wearUniform') $(key).checked = value; else $(key).value = value; } render(); }
  function updateFur() {
    const animal = A.ANIMAL.find((item) => item.id === $('species').value);
    const allowed = animal.fur || A.FUR;
    const before = $('fur').value;
    $('fur').replaceChildren(...allowed.map((color) => new Option(color, color)));
    $('fur').value = allowed.includes(before) ? before : allowed[0];
  }
  function currentSpec() {
    const options = { type: $('type').value, hair: $('hair').value, face: $('face').value, expr: $('expr').value, acc: $('acc').value,
      species: $('species').value, job: $('job').value || null, skin: $('skin').value, hairColor: $('hairColor').value,
      eye: $('eye').value, cloth: $('cloth').value, cloth2: $('cloth2').value, garmentId: $('garmentId').value || null,
      fur: $('type').value === 'animal' ? $('fur').value : undefined, wearUniform: $('wearUniform').checked };
    return A.spec('approved-human-style', options);
  }
  function render() {
    const animal = $('type').value === 'animal';
    updateFur();
    for (const key of ['hair', 'face', 'job', 'skin', 'hairColor']) $(key).disabled = animal;
    $('wearUniform').disabled = animal || !$('job').value || !!$('garmentId').value;
    $('species').disabled = !animal;
    $('fur').disabled = !animal;
    $('preview').innerHTML = R.render(A.ops(currentSpec()), 512);
    $('note').textContent = animal ? '동물 아바타는 옷을 고를 수 있지만 직업 복장은 적용되지 않습니다.' : ($('garmentId').value ? '고른 옷은 직업을 바꿔도 유지됩니다.' : '직업을 고르면 해당 기본 복장이 적용됩니다.');
  }
  document.querySelectorAll('select, input').forEach((control) => control.addEventListener('input', render));
  $('reset').addEventListener('click', reset);
  $('download').addEventListener('click', () => {
    const svg = R.render(A.ops(currentSpec()), 512);
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
      const context = canvas.getContext('2d'); context.imageSmoothingEnabled = true; context.drawImage(image, 0, 0);
      canvas.toBlob((blob) => { const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = '2ndb-avatar-approved-512.png'; link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000); }, 'image/png');
      URL.revokeObjectURL(url);
    };
    image.src = url;
  });
  reset();
</script>
</body>
</html>
