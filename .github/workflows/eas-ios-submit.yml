name: EAS iOS Submit (TestFlight)

# This workflow submits one already-finished production EAS build. It never
# selects "latest", never creates a build, and never prints raw EAS responses.
# A protected GitHub Environment named Production must gate the job.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Finished production EAS iOS build UUID from current origin/main"
        required: true
        type: string

permissions:
  contents: read

# One global lane closes the readback-then-submit race across every dispatch.
concurrency:
  group: eas-ios-submit-testflight
  cancel-in-progress: false
  queue: max

env:
  EAS_CLI_VERSION: "22.6.0"
  POLL_ATTEMPTS: "80"
  POLL_SECONDS: "15"

jobs:
  submit:
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Gate current origin/main
        id: main_gate
        env:
          BUILD_ID: ${{ inputs.build_id }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NORMALIZED_BUILD_ID="$(node scripts/check-eas-ios-submit.js validate-input "$BUILD_ID")"
          if [ "$GITHUB_REPOSITORY" != "Simon-YHKim/2nd-B" ] || [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error title=EAS iOS submit gate::trusted-main-ref-required"
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error title=EAS iOS submit gate::remote-main-fetch-failed"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error title=EAS iOS submit gate::checkout-is-not-current-remote-main"
            exit 1
          fi
          {
            echo "build_id=$NORMALIZED_BUILD_ID"
            echo "main_sha=$REMOTE_MAIN_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Trusted origin/main revision: ${REMOTE_MAIN_SHA:0:12}"

      - name: Verify exact EAS CLI and repository contract
        run: |
          set -euo pipefail
          CLI_VERSION_FILE="$RUNNER_TEMP/eas-cli-version.txt"
          if ! npx --yes "eas-cli@${EAS_CLI_VERSION}" --version >"$CLI_VERSION_FILE" 2>/dev/null; then
            echo "::error title=EAS iOS submit gate::eas-cli-install-or-version-failed"
            exit 1
          fi
          node scripts/check-eas-ios-submit.js config "$CLI_VERSION_FILE"

      # build:view --json in eas-cli 22.6.0 omits isGitWorkingTreeDirty and
      # resolvedEnvironment. The checker performs a token-authenticated GraphQL
      # readback for both fields plus the complete provenance allowlist.
      - name: Verify authenticated build provenance and submission state
        id: submission_plan
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.main_gate.outputs.build_id }}
          MAIN_SHA: ${{ steps.main_gate.outputs.main_sha }}
        run: |
          set -euo pipefail
          node scripts/check-eas-ios-submit.js verify-build "$BUILD_ID" "$MAIN_SHA" "$GITHUB_OUTPUT"

      - name: Schedule submission exactly once
        id: schedule
        if: steps.submission_plan.outputs.action == 'schedule'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.main_gate.outputs.build_id }}
          MAIN_SHA: ${{ steps.main_gate.outputs.main_sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error title=EAS iOS submit gate::remote-main-recheck-failed"
            exit 1
          fi
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$MAIN_SHA" ] || [ "$(git rev-parse HEAD)" != "$MAIN_SHA" ]; then
            echo "::error title=EAS iOS submit gate::main-advanced-before-schedule"
            exit 1
          fi

          PRE_SUBMIT_PLAN="$RUNNER_TEMP/eas-pre-submit-plan.txt"
          node scripts/check-eas-ios-submit.js verify-build "$BUILD_ID" "$MAIN_SHA" "$PRE_SUBMIT_PLAN"
          PRE_SUBMIT_ACTION=""
          PRE_SUBMIT_ID=""
          while IFS='=' read -r KEY VALUE; do
            case "$KEY" in
              action) PRE_SUBMIT_ACTION="$VALUE" ;;
              submission_id) PRE_SUBMIT_ID="$VALUE" ;;
            esac
          done < "$PRE_SUBMIT_PLAN"
          case "$PRE_SUBMIT_ACTION" in
            noop|resume)
              {
                echo "action=$PRE_SUBMIT_ACTION"
                echo "submission_id=$PRE_SUBMIT_ID"
              } >> "$GITHUB_OUTPUT"
              echo "Submission state changed before scheduling; reusing $PRE_SUBMIT_ID"
              exit 0
              ;;
            schedule) ;;
            *)
              echo "::error title=EAS iOS submit gate::pre-submit-plan-invalid"
              exit 1
              ;;
          esac

          # Residual risk: EAS has no atomic conditional-submit operation or idempotency key,
          # so this immediate authenticated readback cannot exclude an external client race.
          SUBMIT_OUTPUT="$RUNNER_TEMP/eas-submit-output.txt"
          if ! npx --yes "eas-cli@${EAS_CLI_VERSION}" submit \
            --platform ios \
            --profile production \
            --non-interactive \
            --id "$BUILD_ID" \
            --no-auto-testflight-setup \
            --no-wait >"$SUBMIT_OUTPUT" 2>&1; then
            echo "::error title=EAS iOS submit gate::submission-schedule-failed"
            exit 1
          fi
          SUBMISSION_ID="$(node scripts/check-eas-ios-submit.js extract "$SUBMIT_OUTPUT")"
          {
            echo "action=resume"
            echo "submission_id=$SUBMISSION_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Submission scheduled: $SUBMISSION_ID"

      - name: Poll scheduled or resumed submission
        if: (steps.schedule.outputs.action || steps.submission_plan.outputs.action) != 'noop'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.main_gate.outputs.build_id }}
          SUBMISSION_ID: ${{ steps.schedule.outputs.submission_id || steps.submission_plan.outputs.submission_id }}
        run: |
          set -euo pipefail
          SUBMISSION_JSON="$RUNNER_TEMP/eas-submission.json"
          for ATTEMPT in $(seq 1 "$POLL_ATTEMPTS"); do
            if npx --yes "eas-cli@${EAS_CLI_VERSION}" submit:view "$SUBMISSION_ID" \
              --json >"$SUBMISSION_JSON" 2>/dev/null; then
              STATUS="$(node scripts/check-eas-ios-submit.js poll "$SUBMISSION_JSON" "$BUILD_ID" "$SUBMISSION_ID")"
              echo "Submission $SUBMISSION_ID status: $STATUS"
              case "$STATUS" in
                FINISHED)
                  {
                    echo "### EAS iOS submission"
                    echo
                    echo "- Build: $BUILD_ID"
                    echo "- Submission: $SUBMISSION_ID"
                    echo "- Status: FINISHED"
                    echo "- TestFlight: https://appstoreconnect.apple.com/apps/6792266942/testflight/ios"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                ERRORED|CANCELED)
                  echo "::error title=EAS iOS submit gate::submission-ended-$STATUS"
                  exit 1
                  ;;
                AWAITING_BUILD|IN_QUEUE|IN_PROGRESS) ;;
                *)
                  echo "::error title=EAS iOS submit gate::submission-status-invalid"
                  exit 1
                  ;;
              esac
            elif [ "$ATTEMPT" = "1" ]; then
              echo "::warning title=EAS iOS submit poll::status-read-will-retry"
            fi
            sleep "$POLL_SECONDS"
          done
          echo "::error title=EAS iOS submit gate::submission-poll-timeout"
          exit 1

      - name: Report prior successful submission
        if: (steps.schedule.outputs.action || steps.submission_plan.outputs.action) == 'noop'
        env:
          BUILD_ID: ${{ steps.main_gate.outputs.build_id }}
          SUBMISSION_ID: ${{ steps.schedule.outputs.submission_id || steps.submission_plan.outputs.submission_id }}
        run: |
          set -euo pipefail
          echo "Submission already finished: $SUBMISSION_ID"
          {
            echo "### EAS iOS submission"
            echo
            echo "- Build: $BUILD_ID"
            echo "- Submission: $SUBMISSION_ID"
            echo "- Status: FINISHED (no-op)"
            echo "- TestFlight: https://appstoreconnect.apple.com/apps/6792266942/testflight/ios"
          } >> "$GITHUB_STEP_SUMMARY"
