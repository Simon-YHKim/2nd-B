name: CI

# D7-01 (CI audit 2026-09-05): `push: branches: ["**"]` + `pull_request` ran the
# same verify twice for every push to a PR branch (414 duplicate pull_request
# runs in 10.6 days, ~9,100 job-minutes/month). Branch protection only requires
# the `verify` context and `pull_request` produces it, so PR branches run once.
#
# D7-02 (Simon decision Q-260905-09, 2026-09-06): `push: branches: [main]` is
# gone too. web-deploy.yml already runs the identical `npm run verify` on every
# push to main and then does a real static export, which is a superset of this
# workflow's web-export-smoke. Running both meant ~447 duplicate runs a month.
#
# What that trades away, stated once so nobody rediscovers it as a surprise:
# main's verification now has a single owner. If web-deploy.yml is edited in a
# way that skips or breaks its verify step, nothing else re-checks main. Treat
# the verify step in web-deploy.yml as load-bearing.
on:
  pull_request:

# D7-03: pure verification workflow (no deploy side effects), so a newer push
# to the same ref cancels the run it supersedes. `refs/heads/*` (push) and
# `refs/pull/N/merge` (pull_request) are distinct groups and never cancel each
# other. web-deploy.yml keeps cancel-in-progress: false because it publishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo (checkout + local tooling).
# It never uses GITHUB_TOKEN to write, so it does not inherit the repository's
# default token scope. Audited 2026-09-06 (C-22): ci.yml, pr-title.yml and
# supabase-dry-run.yml were the three workflows with no permissions block.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No file is in LFS yet. This is here so the day one is, CI does not
          # silently read a 130-byte pointer instead of the file (2026-09-06).
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      # The deterministic HustleK atlas verifier executes the repository's
      # pinned Pillow toolchain through uv. Keep clean CI runners equivalent
      # to the documented local verification command.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.19"
      - run: npm ci --legacy-peer-deps
      # a2z audit 2026-07-11: this job used to hand-copy the verify steps and
      # had drifted — check:legal-review, check:anti-anthro and
      # check:mascot-voice ran locally but NOT here, so those regressions
      # merged on green CI. Running the package.json `verify` script verbatim
      # makes the two pipelines structurally unable to drift again.
      - name: Full verify gauntlet (same command as local `npm run verify`)
        run: npm run verify

  # P0-1 guard (2026-07-19): three web deploys in a row (#1085 era, runs
  # 29642324523/29643931576/29645075631) failed on `expo export --platform
  # web` while this CI stayed green — Metro resolves the module graph
  # statically, so a native-only import reachable from a web-resolved module
  # breaks the export in a way jest and tsc cannot see. Running the same
  # export here makes that class of "CI green but web deploy broken"
  # impossible to merge silently. Runs with default env (mock LLM etc.);
  # web-deploy.yml stays the source of truth for the production env matrix —
  # the failure class this catches is import-graph shape, which env vars
  # cannot change.
  web-export-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No file is in LFS yet. This is here so the day one is, CI does not
          # silently read a 130-byte pointer instead of the file (2026-09-06).
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Expo web static export (smoke)
        env:
          EXPO_PUBLIC_UI: "deep-space"
          EXPO_USE_STATIC: "true"
        run: npx expo export --platform web --output-dir dist-smoke
