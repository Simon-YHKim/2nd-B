name: DB backup (daily encrypted pg_dump)

# Why: Supabase Free plan has no scheduled backups/PITR (verified 2026-08-09).
# This keeps the $0/mo promise (blueprint section 5) while giving us a daily
# restorable snapshot. The dump is age-encrypted BEFORE upload because this
# repo is public and workflow artifacts are downloadable by anyone with read
# access -- plaintext user data must never land in an artifact.
#
# Required Backup environment secrets:
#   BACKUP_PGDUMP_DATABASE_URL        dedicated least-privilege pg_dump role URI
#   Copy the Session pooler URI from Supabase Connect because the Direct host is IPv6-only and GitHub-hosted runners need IPv4.
#   BACKUP_PGDUMP_AGE_PUBLIC_KEY      "age1..." public key (private key stays with Simon, never committed)
#
# Backup must be configured as an exact-main environment without required
# reviewers so the daily schedule remains automatic. Until that environment and
# both secrets are provisioned, this workflow intentionally fails closed. GitHub
# secret scope and read-only audit commands are documented in
# docs/GITHUB-ACTIONS-CREDENTIAL-BOUNDARIES.md.
#
# Restore drill (locally, with the private key file backup_age.key):
#   age -d -i backup_age.key db-YYYYMMDDTHHMMSSZ.dump.age > db.dump
#   pg_restore --clean --if-exists -d "$TARGET_DB_URL" db.dump

on:
  schedule:
    - cron: "30 18 * * *" # 03:30 KST daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    if: ${{ github.repository == 'Simon-YHKim/2nd-B' && github.ref == 'refs/heads/main' }}
    environment: Backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Gate trusted current origin/main
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REPOSITORY" != "Simon-YHKim/2nd-B" ] || [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::DB backup requires the owner repository's refs/heads/main."
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error::Could not refresh origin/main before database credential access."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error::DB backup run is not the current origin/main head."
            exit 1
          fi

      - name: Install postgresql-client-17 and age
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates age lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17

      - name: Recheck current main before backup credentials
        env:
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::Backup credentials are restricted to refs/heads/main."
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error::Could not refresh origin/main before backup credentials."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error::origin/main advanced before backup credentials."
            exit 1
          fi

      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.BACKUP_PGDUMP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_PGDUMP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ] || [ -z "${AGE_PUBLIC_KEY:-}" ]; then
            echo "Missing BACKUP_PGDUMP_DATABASE_URL or BACKUP_PGDUMP_AGE_PUBLIC_KEY environment secret" >&2
            exit 1
          fi
          # The secret is pasted by hand, and a copied connection string very
          # easily carries a trailing newline. libpq then sends the dbname as
          # "postgres" plus that newline, and the server answers: database
          # "postgres<newline>" does not exist. That happened on 2026-08-17 and
          # cost a whole run to diagnose, because the error names the database
          # and says nothing about whitespace. Strip CR/LF so a stray one can
          # never reach libpq again.
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n')"
          AGE_PUBLIC_KEY="$(printf '%s' "$AGE_PUBLIC_KEY" | tr -d '\r\n')"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          # Use the client we installed, by absolute path. The runner image ships
          # postgresql-client-16 and /usr/bin/pg_dump keeps resolving to it even
          # after postgresql-client-17 installs cleanly, so pg_dump aborted with
          # "server version mismatch: server 17.6, pg_dump 16.14" while the apt
          # log said the 17 client was installed. Picking the highest version
          # under /usr/lib/postgresql adapts on its own when the server moves to
          # 18, instead of going stale the way the enumerated host comment did.
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$PGBIN" ]; then
            echo "no postgresql client found under /usr/lib/postgresql" >&2
            exit 1
          fi
          "$PGBIN/pg_dump" --version
          "$PGBIN/pg_dump" "$DB_URL" -Fc --no-owner -f "db-$STAMP.dump"
          age -r "$AGE_PUBLIC_KEY" -o "db-$STAMP.dump.age" "db-$STAMP.dump"
          shred -u "db-$STAMP.dump"
          ls -lh db-*.age

      - name: Upload encrypted artifact (14-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.age"
          retention-days: 14
          if-no-files-found: error
