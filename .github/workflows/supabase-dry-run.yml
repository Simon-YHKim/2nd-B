name: Supabase migrations dry-run

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "db/migration-drafts/**"
      - "db/tests/**"
      - "scripts/check-reward-ssv-db.sh"
      - "scripts/test-polaris-sql.mjs"
      - "scripts/test-signup-consent-sql.mjs"
      - ".github/workflows/supabase-dry-run.yml"

# Least privilege: this workflow only reads the repo (checkout + local tooling).
# It never uses GITHUB_TOKEN to write, so it does not inherit the repository's
# default token scope. Audited 2026-09-06 (C-22): ci.yml, pr-title.yml and
# supabase-dry-run.yml were the three workflows with no permissions block.
permissions:
  contents: read

# Same rationale as ci.yml: a pure check with no deploy side effects, so a newer
# push to the same PR cancels the run it supersedes.
concurrency:
  group: sql-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled Postgres 16 (official pgvector image) so migration
        # 0047's `CREATE EXTENSION vector` resolves — matches Supabase prod,
        # which ships pgvector. Otherwise identical to stock postgres:16.
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b # pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise Polaris allowance and concurrent reservation contract
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE polaris_local LOGIN SUPERUSER PASSWORD 'postgres';
          CREATE DATABASE polaris_test_ci OWNER polaris_local;
          SQL
          node scripts/test-polaris-sql.mjs 5432 polaris_local polaris_test_ci
      - name: Exercise signup consent forward contract
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE signup_local LOGIN SUPERUSER PASSWORD 'postgres';
          CREATE DATABASE signup_test_ci OWNER signup_local;
          SQL
          node scripts/test-signup-consent-sql.mjs 5432 signup_local signup_test_ci
      - name: Seed Supabase compatibility layer (auth, roles, and storage stubs)
        env:
          PGPASSWORD: postgres
        run: |
          # The migrations reference auth.uid(), four Supabase roles
          # (authenticated / anon / service_role / supabase_auth_admin), and
          # the auth.users table
          # (0018 attaches a BEFORE INSERT trigger to it). Vanilla Postgres
          # has none of these. We stub them just enough that the DDL parses
          # and role-conditional logic (e.g. 0015) sees the roles exist.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$
              SELECT COALESCE(
                NULLIF(pg_catalog.current_setting('request.jwt.claim.sub', true), ''),
                NULLIF(pg_catalog.current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub'
              )::uuid
            $$;
          CREATE TABLE IF NOT EXISTS auth.users (
            id                 uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email              text,
            deleted_at         timestamptz,
            email_confirmed_at timestamptz,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE TABLE IF NOT EXISTS auth.sessions (
            id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id    uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            created_at timestamptz NOT NULL DEFAULT pg_catalog.now()
          );

          -- Supabase Storage is absent from the plain PostgreSQL service. Its
          -- minimal contract keeps the raw-clippings policies and deletion
          -- trigger executable in CI instead of silently taking their
          -- non-Supabase NOTICE branch.
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id                 text PRIMARY KEY,
            name               text NOT NULL,
            public             boolean NOT NULL DEFAULT false,
            file_size_limit    bigint,
            allowed_mime_types text[]
          );
          CREATE TABLE IF NOT EXISTS storage.objects (
            id        uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text REFERENCES storage.buckets(id),
            name      text
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          CREATE OR REPLACE FUNCTION storage.foldername(name text)
          RETURNS text[]
          LANGUAGE plpgsql
          IMMUTABLE
          AS $$
          DECLARE
            parts text[];
          BEGIN
            parts := pg_catalog.string_to_array(name, '/');
            RETURN parts[1:pg_catalog.array_length(parts, 1) - 1];
          END;
          $$;
          -- supabase_auth_admin is the role the JWT claim hook runs as (0139).
          -- It was added to the migrations on 2026-08-21 but NOT to this stub,
          -- so 0139 line 199 (`CREATE POLICY ... TO supabase_auth_admin`) died
          -- with `role does not exist` and this job has been red on main ever
          -- since. The fix belongs here, not in 0139: prod really does have that
          -- role, and guarding the policy in SQL would let it be SILENTLY
          -- SKIPPED -- which is the exact failure 0139's own comment warns about
          -- (the hook returns an empty array and the mechanism looks like it
          -- works while granting nothing). A red CI is the better failure.
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated')       THEN CREATE ROLE authenticated;       END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon')                THEN CREATE ROLE anon;                END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role')        THEN CREATE ROLE service_role;        END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN CREATE ROLE supabase_auth_admin; END IF;
          END $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          GRANT USAGE ON SCHEMA storage TO authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE storage.objects TO authenticated;
          GRANT EXECUTE ON FUNCTION storage.foldername(text) TO authenticated;

          -- Supabase's default privileges for FUNCTIONS in `public`. This must
          -- stand BEFORE the first migration, because a default privilege is
          -- stamped on a function when it is created and never afterwards.
          --
          -- Prod creates every public function with EXECUTE already granted, BY
          -- NAME, to anon, authenticated and service_role. The repo measured it:
          -- after 0035:85 revoked PUBLIC and nothing else, prod's ACL was
          -- {postgres=X,anon=X,authenticated=X,service_role=X}
          -- (0036_lock_bump_gemini_spend.sql:11-13), and 0082 and
          -- scripts/check-definer-grants.ts:3-8 say the same. Vanilla Postgres
          -- grants PUBLIC and nobody by name, so until 2026-09-20 this scratch
          -- DB had no such floor, and every `NOT has_function_privilege(
          -- 'authenticated', ...)` in this job was true of ANY function whose
          -- migration revoked PUBLIC -- whether or not it revoked authenticated.
          -- That is how 0189 shipped `REVOKE ... FROM PUBLIC, anon` on
          -- erase_my_data as "locked" with the lock assertion green, while the
          -- same text on prod leaves authenticated=X (R48 artifact gate F-02;
          -- 0190 is the correction).
          --
          -- MEASURED 2026-09-20, scratch PostgreSQL 18.3, whole tree applied and
          -- every lane of this job replayed except the CLI push and the SSV lane
          -- (which refuses to run outside Actions):
          --   floor, authenticated revoke removed    -> erasure lane RED, ACL
          --     {postgres=X,authenticated=X,service_role=X} -- prod's shape
          --   no floor, authenticated revoke removed -> erasure lane GREEN, ACL
          --     {postgres=X} -- the vacuous pass this floor exists to end
          --   floor, tree as shipped                 -> every replayed lane green;
          --     the apply-time ACL checks in 0141 and 0172-0185 all still hold,
          --     so the floor changes the verdict of nothing else.
          --
          -- FOR ROLE postgres is spelled out because default privileges belong
          -- to the role that CREATES the object, and every migration in this job
          -- is applied as postgres (psql -U postgres, and the CLI's db-url).
          -- db/tests/erasure_registry_regression.sql block (L) creates a probe
          -- function and refuses to draw a conclusion if this floor is absent,
          -- so deleting these lines turns that lane red instead of vacuous.
          --
          -- FUNCTIONS only, on purpose. The TABLE defaults are not reproducible
          -- here: 0179 asserts at apply time that authenticated holds no write
          -- privilege on ai_audit_log, and nothing revokes it before 0181
          -- (db/tests/erasure_registry_regression.sql, "The privilege FLOOR").
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;
          SQL
      - name: Apply baseline migrations (0001-0146) in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            base="${f##*/}"
            version="${base%%_*}"
            if [[ ! "$version" =~ ^[0-9]+$ ]]; then
              echo "Migration filename has no numeric version: $base" >&2
              exit 1
            fi
            if (( 10#$version <= 146 )); then
              echo "Applying baseline $f"
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
            fi
          done
      # Pin the executable because its statement splitting and migration-ledger
      # writes are part of this test contract, not an ambient runner detail.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.116.0
      - name: Apply staged migrations (0147+) through Supabase CLI
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          staged_project="$(mktemp -d)"
          trap 'rm -rf -- "$staged_project"' EXIT
          supabase init --workdir "$staged_project"
          mkdir -p -- "$staged_project/supabase/migrations"

          staged_migrations=()
          for f in db/migrations/*.sql; do
            base="${f##*/}"
            version="${base%%_*}"
            if [[ ! "$version" =~ ^[0-9]+$ ]]; then
              echo "Migration filename has no numeric version: $base" >&2
              exit 1
            fi
            if (( 10#$version >= 147 )); then
              staged_migrations+=("$f")
            fi
          done

          if (( ${#staged_migrations[@]} == 0 )); then
            echo "No CLI-managed migrations found at version 0147 or later" >&2
            exit 1
          fi

          transaction_re='^[[:space:]]*(BEGIN([[:space:]]+(WORK|TRANSACTION))?|COMMIT([[:space:]]+WORK)?)[[:space:]]*;([[:space:]]*--.*)?$'
          for f in "${staged_migrations[@]}"; do
            if grep -HEn "$transaction_re" "$f"; then
              echo "Top-level transaction wrapper is forbidden in CLI-managed migration: $f" >&2
              exit 1
            fi
            cp -- "$f" "$staged_project/supabase/migrations/"
          done

          # Four-digit 0147+ versions are a CI-scratch convention only. A
          # production bundle must receive separate monotonic timestamp versions
          # before any live db push. This command targets only the job-local DB;
          # it never reads a production URL, project ref, or repository secret.
          supabase db push \
            --db-url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            --workdir "$staged_project" \
            --include-all \
            --skip-vault \
            --yes

          expected_count="${#staged_migrations[@]}"
          actual_count="$(psql -h localhost -U postgres -Atc \
            'SELECT count(*) FROM supabase_migrations.schema_migrations')"
          if [[ "$actual_count" != "$expected_count" ]]; then
            echo "Migration ledger has $actual_count rows; expected $expected_count" >&2
            exit 1
          fi

          for f in "${staged_migrations[@]}"; do
            base="${f##*/}"
            version="${base%%_*}"
            name="${base#*_}"
            name="${name%.sql}"
            row="$(psql -h localhost -U postgres -AtF '|' \
              -c "SELECT version, name, COALESCE(cardinality(statements), 0)
                  FROM supabase_migrations.schema_migrations
                  WHERE version = '$version'")"
            IFS='|' read -r actual_version actual_name statement_count <<< "$row"
            if [[ "$actual_version" != "$version" \
               || "$actual_name" != "$name" \
               || ! "$statement_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "Incomplete migration ledger record for $base" >&2
              exit 1
            fi
          done

          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'relation_people'
                AND column_name = 'client_revision'
                AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION '0147 end state is missing relation_people.client_revision';
            END IF;

            IF to_regprocedure('public.complete_verified_email_signup()') IS NULL THEN
              RAISE EXCEPTION '0148 end state is missing complete_verified_email_signup()';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_trigger
              WHERE tgname = 'trg_complete_verified_email_signup'
                AND tgrelid = 'auth.users'::regclass
                AND tgfoid = 'public.complete_verified_email_signup()'::regprocedure
                AND tgenabled <> 'D'
            ) THEN
              RAISE EXCEPTION 'verified-email completion trigger is missing or disabled';
            END IF;
          END $$;
          SQL
      - name: Apply cumulative server-first drafts on an isolated scratch clone
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Reuse the rollback lane's TEMPLATE clone pattern after all 173
          # numbered migrations. The service container is disposable; leave the
          # uniquely named clone until that container is torn down.
          # This proves a fresh-schema SQL transaction, not production data,
          # Supabase's timestamp ledger, Edge secrets, or the unreserved numbers.
          unset PGHOSTADDR PGSERVICE PGHOST PGPORT PGUSER PGDATABASE
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo "cumulative draft check requires a GitHub Actions scratch run" >&2
            exit 1
          fi
          draft_db="draft_cumulative_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sql() { # <database> <one SQL statement>; loopback and CI-only password
            psql -X --no-password -qAt -h 127.0.0.1 -p 5432 -U postgres -d "$1" \
              -v ON_ERROR_STOP=1 -c "$2"
          }
          if [[ "$(sql postgres "SELECT count(*) FROM pg_catalog.pg_database WHERE datname='$draft_db'")" != "0" ]]; then
            echo "refusing to replace pre-existing scratch database [$draft_db]" >&2
            exit 1
          fi
          if [[ "$(sql postgres 'SELECT count(*) FROM public.erasure_registry')" != "66" ]]; then
            echo "numbered migration baseline no longer has 66 registry rows" >&2
            exit 1
          fi
          ledger_sql="SELECT md5(coalesce(string_agg(row_to_json(m)::text, '|' ORDER BY m.version, m.name), '')) FROM supabase_migrations.schema_migrations AS m"
          ledger_before="$(sql postgres "$ledger_sql")"
          sql postgres "CREATE DATABASE $draft_db TEMPLATE postgres"

          # One transaction preserves SET LOCAL in the drafts and prevents a
          # partial package from passing. A failed preflight aborts this lane.
          psql -X --no-password -h 127.0.0.1 -p 5432 -U postgres -d "$draft_db" \
            -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i db/migration-drafts/UNNUMBERED_signup_consent_admob_20260925.sql
          \i db/migration-drafts/UNNUMBERED_account_deletion_completion_fence.sql
          \i db/migration-drafts/UNNUMBERED_effective_llm_consent_current_contract.sql
          \i db/migration-drafts/UNNUMBERED_llm_service_consent_management.sql
          \i db/migration-drafts/UNNUMBERED_polaris_generation_allowance.sql
          \i db/migration-drafts/UNNUMBERED_reward_ssv_hardening.sql
          \i db/migration-drafts/UNNUMBERED_paddle_refund_consequence_integrity.sql
          \i db/migration-drafts/UNNUMBERED_service_contract_erasure_registry.sql
          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM public.erasure_registry) <> 70
               OR (SELECT count(*) FROM public.erasure_registry WHERE table_name IN (
                 'account_deletion_tombstones', 'llm_consent_receipts',
                 'polaris_generations', 'reward_ssv_issue_rate_limits')) <> 4
               OR to_regclass('public.account_deletion_tombstones') IS NULL
               OR to_regclass('public.llm_consent_receipts') IS NULL
               OR to_regclass('public.polaris_generations') IS NULL
               OR to_regclass('public.reward_ssv_issue_rate_limits') IS NULL
               OR to_regprocedure('public.signup_consent_contract_status()') IS NULL
               OR to_regprocedure('public.llm_service_consent_status(uuid)') IS NULL
               OR to_regprocedure('public.settle_reward_ssv_ticket_v2(text,text,text,integer,text)') IS NULL
               OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                 WHERE table_schema='public' AND table_name='paddle_webhook_events'
                   AND column_name='refund_consequence_adjustment_id')
               OR (SELECT enabled FROM public.polaris_generation_config WHERE singleton) IS DISTINCT FROM false
               OR has_function_privilege('authenticated','public.erase_my_data(text)','EXECUTE')
               OR NOT has_function_privilege('service_role','public.llm_service_consent_status(uuid)','EXECUTE')
            THEN
              RAISE EXCEPTION 'cumulative server-first draft contract failed';
            END IF;
          END
          $verify$;
          COMMIT;
          SQL

          if [[ "$(sql "$draft_db" "$ledger_sql")" != "$ledger_before" ]]; then
            echo "cumulative draft SQL unexpectedly changed the CLI migration ledger" >&2
            exit 1
          fi
          echo "PASS: eight drafts applied together on a fresh scratch clone; 70 registry rows, contracts and ACL verified; numbered ledger unchanged"
      # db/migrations/rollback/0189_down.sql is run by hand, mid-incident, and the
      # next `db push` is then trusted to put everything back. Nothing exercised
      # that path, and it was broken. The rollback deleted only its OWN ledger row
      # (name = 'erasure_registry'); 0190's row stayed, so the re-push re-created
      # erase_my_data from 0189 and SKIPPED the revoke in 0190. The function came
      # back with the platform default, authenticated=X, under a ledger that read
      # as fully applied (r49: two gates reproduced it separately, B-K01 and
      # B-EX-01).
      #
      # MEASURED 2026-09-20 22:26 KST, scratch PostgreSQL 18.3, THIS pinned CLI:
      #   after the old rollback a plain `supabase db push` FAILS ("Found local
      #   migration files to be inserted before the last migration on remote
      #   database") and the CLI itself suggests `--include-all`, which is also the
      #   flag this job pushes with. Following that advice re-applies 0189 alone:
      #   proacl {postgres=X,authenticated=X,service_role=X}, authenticated = t.
      #   With both rows deleted there is nothing out of order, and 0189 then 0190
      #   re-apply: {postgres=X,service_role=X}, authenticated = f.
      #
      # Both halves run, on throwaway clones of the database the step above just
      # pushed, so no later lane sees any of it. It sits HERE, not at the end,
      # because the clone is then exactly what the CLI pushed and nothing else: a
      # lane that one day commits residue cannot turn this red for a reason that
      # has nothing to do with rollback.
      #
      #   control  the pre-fix end state, rebuilt by STATE rather than by editing
      #            the file's text: run the rollback, put 0190's ledger row back,
      #            re-push. erase_my_data MUST come back executable by
      #            authenticated. If it comes back locked, this database cannot show
      #            the hole at all (no function default-privilege floor, or the CLI
      #            stopped skipping applied versions) and a green below would be
      #            the vacuous kind the floor in the first step exists to end. So
      #            the control failing to OPEN is a red, and it runs first.
      #            MEASURED 2026-09-20 on a scratch DB built without that floor:
      #            the PRE-FIX file, the one that re-opens the function on prod,
      #            reads public=f anon=f authenticated=f after the round trip.
      #            The privilege check alone cannot tell the two files apart
      #            there; the control is what says so out loud.
      #   fixed    the file as shipped: rollback, re-push. No ledger row of the
      #            pair may survive the rollback, no client role may hold EXECUTE
      #            afterwards, and everything that hangs off the two objects must
      #            equal what it was before the rollback: the ledger, the function
      #            (owner, ACL, definition, COMMENT), the registry rows, the table
      #            (owner, ACL, and its whole catalog row), its columns (defaults,
      #            ACLs, comments, and their whole catalog rows), constraints,
      #            indexes (and theirs), policies, triggers, the sequences its
      #            columns own (parameters, owner, ACL, comment, catalog row, and
      #            where each one stands), rules, statistics objects, the comments
      #            on any of those, and whatever else pg_depend hangs off either
      #            object. DROP takes all of it without a word, so a LATER
      #            migration that adds any of it and is left out of the rollback's
      #            list loses it to the round trip. That comparison is what says
      #            so, FOR WHAT IT READS: see "not collected" below.
      #   sight    ...provided it can SEE the thing. It used to make that claim
      #            while reading six facts. MEASURED 2026-09-21 00:28 KST, scratch
      #            PostgreSQL 18.3, one statement at a time inside a rolled-back
      #            transaction: the old line did not move for a new constraint,
      #            index, policy, trigger, rule or statistics object, a table or
      #            column COMMENT, a column grant, FORCE ROW LEVEL SECURITY, a
      #            column default, or a dropped NOT NULL: 12 of the 22 kinds
      #            tried (r50 artifact gate, B-NEW-01). So each kind is applied to
      #            the clone BEFORE the rollback, in a transaction that is rolled
      #            back, and the fingerprint has to move. Where an object is seen
      #            twice (by its own part and by the pg_depend net), it is asked
      #            for more: two definitions of it must give two fingerprints. One
      #            that does not is BLIND, and BLIND is a red, for the control's
      #            reason one layer down: a comparison that cannot see a loss
      #            stays green about it forever.
      #            The gate's own counter-example, ADD COLUMN, was the one kind
      #            the old line did see (its row hash is over r::text, which
      #            carries every column). It leads the list all the same: it is
      #            the statement the finding is known by.
      #
      #   need     ...and that every row the rollback deletes HAD to be deleted. Put
      #            one back, push again: if everything still comes back, that
      #            migration is on the list for no reason this database can show,
      #            and it would be re-applied mid-incident all the same. Red.
      #
      # WHAT THIS STEP SAYS, AND WHAT IT DOES NOT. This is the third round on this
      # rule (r50, r52, r55). Each round closed the hole it was shown and opened one
      # of a new kind while closing it, so in this one the CLAIM was cut down to
      # what a run actually shows, and the rest is listed instead of implied.
      #
      # It says two things about c_names, the rollback's list, and both only AS FAR
      # AS owned_state READS:
      #   enough   nothing owned_state reads is lost to rollback + re-push ("fixed");
      #   needed   no row on the list could have been left off it ("need").
      # It does NOT say that re-applying a listed migration is harmless. It used to:
      # "whether the reason is true is not decidable here; the round trip proves
      # that harmless or refuses" stood in the other half, and a remark of ten
      # characters beside an entry was what admitted it. r55's two gates ran the
      # counter-example (B-R55-N01; artifact gate, finding 2): a migration that
      # touches neither object, listed with 'xxxxxxxxxx' beside it, green on both
      # sides, re-applied, a counter in another table 1 -> 2, fingerprint identical.
      # "need" now refuses THAT entry. It cannot refuse a migration that is needed
      # and ALSO does something else: see the first line of "not collected".
      #
      # NOT COLLECTED. Known, and not a complete list: two gates each found a line
      # of it the other had not, which is the evidence that nobody has all of it.
      # MEASURED 2026-09-21 03:50 KST, scratch PostgreSQL 18.3, two definitions of
      # one thing under this exact query: "same" means a loss here is NOT seen.
      #   - any row of any table other than erasure_registry, and any object that
      #     does not hang off the two. A listed migration is re-applied WHOLE, so
      #     whatever else it does happens twice, and nothing here looks. Re-apply
      #     safety of a migration added to c_names is reviewed in the PR that adds
      #     it, against that migration's own SQL. It is not shown by this step.
      #   - a publication's row filter and its column list for the table: same. (The
      #     table JOINING a publication is seen, by the pg_depend net.)
      #   - the owner of a statistics object: same.
      #   - security labels on either object, a column or an owned sequence:
      #     pg_seclabel is not read. Not measured: no label provider is loaded on
      #     the scratch server. One is on Supabase (pgsodium).
      #   - of a sequence, only one that pg_depend hangs off the table, and of where
      #     it stands, last_value and is_called (not log_cnt).
      #   - what "need" calls needed is "differs when left out". WHY it differs is
      #     not examined.
      #
      # THE OTHER HALF IS NOT A GATE ON THE LIST, and no longer reads as one.
      # src/lib/privacy/__tests__/erasure-registry-migration.test.ts runs in `npm run
      # verify` with no database. It reads every migration from 0189 on, keeps the
      # SQL that executes (restoring run-time SQL wherever it is a constant), and
      # makes sure a PERSON HAS ACCOUNTED FOR each file that names either object, or
      # that runs SQL it cannot restore: the file is in c_names, or it is on that
      # test's list of files whose ledger row may stay. It is an early prompt,
      # before anything is pushed. It proves neither answer; this step judges the
      # list. It used to do more, in both directions. It bounded the list from
      # above (r52 bizlogic gate, B-R52-N01: it failed the author who listed what
      # this step had just told them to), then admitted entries by their remark
      # (r55, above). And its "must be listed" was binding, which the "need" half
      # cannot live with: a file can NAME the two objects and hang nothing on them
      # that re-applying the others does not already restore (the first of two
      # CREATE OR REPLACE of erase_my_data; a table called erasure_registry_audit;
      # a DO block that only reads the registry). Binding on one side and refused
      # on the other is a red with no way out, which is B-R52-N01 again.
      #
      # WHERE A CHANGE IS STILL LOST WITHOUT A RED: where nobody is prompted AND
      # owned_state does not read the fact. "Nobody is prompted" is wider than this
      # comment used to say. It named one case, "a change that goes through a
      # function defined in an earlier migration". r55's counter-example needed no
      # helper and no variable: GRANT USAGE ON SEQUENCE public.generation_counter_seq
      # is plain SQL that spells neither name, because what hangs off the two
      # objects has names of its own (a sequence, an index, a constraint). The
      # reader looks for two names; it is silent about every statement that does
      # not need them. Add to that a person's wrong "its row may stay" about a file
      # they WERE asked about. Both meet a red here only if owned_state reads what
      # was lost. That corner is stated, not closed.
      #
      # Every failure is reported before the step exits, so one run shows the whole
      # shape of a regression rather than its first symptom.
      - name: Exercise the 0189 rollback round trip
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          # The target psql already resolves in every step of this job: PGPORT and
          # PGDATABASE when set, else 5432/postgres. The host is always localhost,
          # so like the push above this reaches the job-local server and nothing
          # else. The fallbacks let the step be replayed as written against a
          # local scratch cluster on another port.
          port="${PGPORT:-5432}"
          source_db="${PGDATABASE:-postgres}"
          down="db/migrations/rollback/0189_down.sql"
          pair="erasure_registry lock_erase_my_data_authenticated"
          run_token="${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$_${RANDOM}"
          control_db="rollback_control_${run_token}"
          fixed_db="rollback_fixed_${run_token}"
          need_db="rollback_need_${run_token}"
          if [[ ! "$source_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
            echo "rollback round trip refuses unsafe source database name [$source_db]" >&2
            exit 1
          fi

          staged_project="$(mktemp -d)"
          trap 'rm -rf -- "$staged_project"' EXIT
          supabase init --workdir "$staged_project"
          mkdir -p -- "$staged_project/supabase/migrations"
          for f in db/migrations/*.sql; do
            base="${f##*/}"
            version="${base%%_*}"
            if (( 10#$version >= 147 )); then
              cp -- "$f" "$staged_project/supabase/migrations/"
            fi
          done

          sql() { # <db> <one statement>
            psql -X -q -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -Atc "$2"
          }
          created_clones=()
          clone() { # <name>
            if [[ ! "$1" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
              echo "rollback round trip refuses unsafe clone database name [$1]" >&2
              return 1
            fi
            if [[ "$(sql "$source_db" "SELECT pg_catalog.count(*) FROM pg_catalog.pg_database WHERE datname = '$1'")" != "0" ]]; then
              echo "rollback round trip refuses to replace pre-existing database [$1]" >&2
              return 1
            fi
            sql "$source_db" "CREATE DATABASE $1 TEMPLATE $source_db"
            created_clones+=("$1")
          }
          roll_back() { # <db>
            psql -X -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -f "$down"
          }
          push_again() { # <db>  -- the same command the step above pushes with
            supabase db push \
              --db-url "postgresql://postgres:postgres@localhost:${port}/$1?sslmode=disable" \
              --workdir "$staged_project" \
              --include-all \
              --skip-vault \
              --yes
          }
          ledger_pair() { # <db>
            sql "$1" "SELECT COALESCE(pg_catalog.string_agg(m.name, ' ' ORDER BY m.version), '(none)')
                      FROM supabase_migrations.schema_migrations AS m
                      WHERE m.name IN ('erasure_registry', 'lock_erase_my_data_authenticated')"
          }
          can_execute() { # <db> <role>
            sql "$1" "SELECT pg_catalog.has_function_privilege('$2', 'public.erase_my_data(text)', 'EXECUTE')"
          }
          # Collected state of the two objects, one fact per line, in a form
          # that survives DROP + CREATE: names and definitions, never an OID. ACLs
          # are sorted, because the order of the entries is the order of the GRANTs
          # and says nothing about who holds what. The last part is the net under
          # the named ones: whatever else pg_depend hangs off either object (a
          # view, a publication). It repeats the constraints, which hang off the
          # table too. That costs lines, and buys a net with no exclusion list to
          # go stale. Internal dependencies do stay out of it: the TOAST table is
          # one, and its name carries the OID of a table the round trip re-creates.
          #
          # WHOLE ROWS, where a row is what holds the properties. The column line
          # used to name eight of pg_attribute's columns, and a statistics target, a
          # storage mode, a compression method and the per-column options are four
          # it did not name: SET STATISTICS moved the catalog and not this
          # fingerprint (r52 artifact gate, B-NEW-01; reproduced here 2026-09-21
          # 01:59 KST, both halves green). Naming those four would leave a list with
          # a fifth missing. So the row is read WHOLE and the columns taken OUT are
          # the named ones: what a re-created table cannot keep (its OIDs, its file),
          # what the autovacuum rewrites on its own schedule (page and tuple counts,
          # the frozen-xid marks, the has-index style hints), and the ACLs, which
          # are printed sorted on the line above. The two lists fail differently.
          # One that names what to READ goes stale in silence. One that names what
          # to SKIP goes stale as a red diff that prints the key: a catalog column a
          # future server adds is compared until someone says it should not be.
          # One key to a line (`column table_name .attstattarget=1000`), so that the
          # diff names the property that moved. MEASURED 2026-09-21 02:17 KST with
          # the row printed as one JSON value: the red was right and unreadable, two
          # 500-character lines that differed in their last twenty.
          #
          # SEQUENCES, three ways, because a sequence keeps what it is in three places
          # and the first version of this part read one of them (r55, two gates, one
          # family each). pg_sequence holds the PARAMETERS. The sequence's own
          # pg_class row holds its owner and its ACL: a plain GRANT USAGE ON SEQUENCE
          # names neither of the two objects, so the other half of this rule says
          # nothing, and the round trip lost the grant with an identical fingerprint
          # (B-R55-N02). And WHERE IT STANDS is in neither catalog: last_value and
          # is_called live in the sequence relation itself. pg_sequences would not
          # do: it reports last_value as NULL until the first nextval(), so RESTART
          # WITH 42 and RESTART WITH 73 read the same (artifact gate, finding 1;
          # MEASURED: states 42:false and 73:false, one fingerprint). The relation
          # has to be read by name, so the name is quoted by format('%I.%I') and the
          # one-row SELECT goes through query_to_xml, which keeps all of this one
          # statement. log_cnt stays out: it counts WAL prefetch, not values.
          owned_state="$(cat <<'SQL'
          WITH reg AS (SELECT pg_catalog.to_regclass('public.erasure_registry') AS oid),
               fn AS (SELECT pg_catalog.to_regprocedure('public.erase_my_data(text)') AS oid),
               owned_seq AS (
                 SELECT DISTINCT sc.oid, n.nspname, sc.relname
                 FROM reg
                 JOIN pg_catalog.pg_depend AS d ON d.refclassid = 'pg_catalog.pg_class'::pg_catalog.regclass AND d.refobjid = reg.oid
                                               AND d.classid = 'pg_catalog.pg_class'::pg_catalog.regclass
                 JOIN pg_catalog.pg_class AS sc ON sc.oid = d.objid AND sc.relkind = 'S'
                 JOIN pg_catalog.pg_namespace AS n ON n.oid = sc.relnamespace)
          SELECT fact.line
          FROM (
            SELECT 1 AS part, 0 AS pos,
                   'ledger ' || pg_catalog.md5(pg_catalog.string_agg(m.version || ':' || COALESCE(m.name, ''), ',' ORDER BY m.version)) AS line
            FROM supabase_migrations.schema_migrations AS m
            UNION ALL
            SELECT 2, 0,
                   'function ' || COALESCE((
                     SELECT 'owner=' || pg_catalog.pg_get_userbyid(p.proowner)
                            || ' acl=' || CASE WHEN p.proacl IS NULL THEN '(default)'
                                              WHEN pg_catalog.cardinality(p.proacl) = 0 THEN '(empty)'
                                              ELSE (SELECT pg_catalog.string_agg(a::text, ',' ORDER BY a::text)
                                                    FROM pg_catalog.unnest(p.proacl) AS a) END
                            || ' definition=' || pg_catalog.md5(pg_catalog.pg_get_functiondef(p.oid))
                            || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(p.oid, 'pg_proc')), '(none)')
                     FROM pg_catalog.pg_proc AS p, fn
                     WHERE p.oid = fn.oid), '(absent)')
            UNION ALL
            SELECT 3, 0,
                   'table ' || COALESCE((
                     SELECT 'owner=' || pg_catalog.pg_get_userbyid(c.relowner)
                            || ' acl=' || CASE WHEN c.relacl IS NULL THEN '(default)'
                                              WHEN pg_catalog.cardinality(c.relacl) = 0 THEN '(empty)'
                                              ELSE (SELECT pg_catalog.string_agg(a::text, ',' ORDER BY a::text)
                                                    FROM pg_catalog.unnest(c.relacl) AS a) END
                            || ' rls=' || c.relrowsecurity || ' force_rls=' || c.relforcerowsecurity
                            || ' persistence=' || c.relpersistence::text || ' replica_identity=' || c.relreplident::text
                            || ' options=' || COALESCE(c.reloptions::text, '(none)')
                            || ' toast_options=' || COALESCE((SELECT t.reloptions::text FROM pg_catalog.pg_class AS t WHERE t.oid = c.reltoastrelid), '(none)')
                            || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(c.oid, 'pg_class')), '(none)')
                     FROM pg_catalog.pg_class AS c, reg
                     WHERE c.oid = reg.oid), '(absent)')
            UNION ALL
            SELECT 3, 1,
                   'table .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_class AS c ON c.oid = reg.oid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(c) - ARRAY[
              'oid', 'reltype', 'relfilenode', 'reltoastrelid', 'relrewrite',
              'relpages', 'reltuples', 'relallvisible', 'relallfrozen', 'relfrozenxid', 'relminmxid',
              'relhasindex', 'relhasrules', 'relhastriggers', 'relhassubclass',
              'relacl']) AS kv
            UNION ALL
            SELECT 4, 0,
                   'rows ' || COALESCE((SELECT pg_catalog.count(*) || ':' || pg_catalog.md5(pg_catalog.string_agg(r::text, ',' ORDER BY r.table_name))
                                        FROM public.erasure_registry AS r), '(none)')
            UNION ALL
            SELECT 5, a.attnum,
                   'column ' || pg_catalog.row_number() OVER (ORDER BY a.attnum) || ' ' || a.attname
                   || ' ' || pg_catalog.format_type(a.atttypid, a.atttypmod)
                   || ' not_null=' || a.attnotnull
                   || ' default=' || COALESCE(pg_catalog.pg_get_expr(d.adbin, d.adrelid), '(none)')
                   || ' identity=' || CASE a.attidentity WHEN '' THEN '(none)' ELSE a.attidentity::text END
                   || ' generated=' || CASE a.attgenerated WHEN '' THEN '(none)' ELSE a.attgenerated::text END
                   || ' collation=' || a.attcollation::pg_catalog.regcollation::text
                   || ' acl=' || CASE WHEN a.attacl IS NULL THEN '(default)'
                                      WHEN pg_catalog.cardinality(a.attacl) = 0 THEN '(empty)'
                                      ELSE (SELECT pg_catalog.string_agg(x::text, ',' ORDER BY x::text)
                                            FROM pg_catalog.unnest(a.attacl) AS x) END
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.col_description(a.attrelid, a.attnum)), '(none)')
            FROM reg
            JOIN pg_catalog.pg_attribute AS a ON a.attrelid = reg.oid AND a.attnum > 0 AND NOT a.attisdropped
            LEFT JOIN pg_catalog.pg_attrdef AS d ON d.adrelid = a.attrelid AND d.adnum = a.attnum
            UNION ALL
            SELECT 5, a.attnum,
                   'column ' || a.attname || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_attribute AS a ON a.attrelid = reg.oid AND a.attnum > 0 AND NOT a.attisdropped
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(a) - ARRAY['attrelid', 'attnum', 'attacl']) AS kv
            UNION ALL
            SELECT 6, 0,
                   'constraint ' || k.conname || ' ' || pg_catalog.pg_get_constraintdef(k.oid)
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(k.oid, 'pg_constraint')), '(none)')
            FROM reg
            JOIN pg_catalog.pg_constraint AS k ON k.conrelid = reg.oid
            UNION ALL
            SELECT 7, 0,
                   'index ' || pg_catalog.pg_get_indexdef(i.indexrelid) || ' valid=' || i.indisvalid
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(i.indexrelid, 'pg_class')), '(none)')
            FROM reg
            JOIN pg_catalog.pg_index AS i ON i.indrelid = reg.oid
            UNION ALL
            SELECT 7, 1,
                   'index ' || x.relname || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_index AS i ON i.indrelid = reg.oid
            JOIN pg_catalog.pg_class AS x ON x.oid = i.indexrelid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(i) - ARRAY[
              'indexrelid', 'indrelid', 'indcheckxmin',
              'indkey', 'indcollation', 'indclass', 'indoption', 'indexprs', 'indpred']) AS kv
            UNION ALL
            SELECT 7, 2,
                   'index ' || x.relname || ' column ' || ia.attnum || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_index AS i ON i.indrelid = reg.oid
            JOIN pg_catalog.pg_class AS x ON x.oid = i.indexrelid
            JOIN pg_catalog.pg_attribute AS ia ON ia.attrelid = i.indexrelid AND ia.attnum > 0
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(ia) - ARRAY['attrelid', 'attnum', 'attacl']) AS kv
            UNION ALL
            SELECT 8, 0,
                   'policy ' || p.polname || ' command=' || p.polcmd::text || ' permissive=' || p.polpermissive
                   || ' roles=' || COALESCE((SELECT pg_catalog.string_agg(named.role_name, ',' ORDER BY named.role_name)
                                             FROM (SELECT CASE WHEN member = 0 THEN 'public' ELSE pg_catalog.pg_get_userbyid(member) END AS role_name
                                                   FROM pg_catalog.unnest(p.polroles) AS member) AS named), '(none)')
                   || ' using=' || COALESCE(pg_catalog.pg_get_expr(p.polqual, p.polrelid), '(none)')
                   || ' check=' || COALESCE(pg_catalog.pg_get_expr(p.polwithcheck, p.polrelid), '(none)')
            FROM reg
            JOIN pg_catalog.pg_policy AS p ON p.polrelid = reg.oid
            UNION ALL
            SELECT 9, 0,
                   'trigger ' || pg_catalog.pg_get_triggerdef(t.oid) || ' enabled=' || t.tgenabled::text
            FROM reg
            JOIN pg_catalog.pg_trigger AS t ON t.tgrelid = reg.oid AND NOT t.tgisinternal
            UNION ALL
            SELECT 9, 1,
                   'sequence ' || sc.nspname || '.' || sc.relname || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM owned_seq AS sc
            JOIN pg_catalog.pg_sequence AS s ON s.seqrelid = sc.oid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(s) - ARRAY['seqrelid']) AS kv
            UNION ALL
            SELECT 9, 2,
                   'sequence ' || sc.nspname || '.' || sc.relname
                   || ' owner=' || pg_catalog.pg_get_userbyid(c.relowner)
                   || ' acl=' || CASE WHEN c.relacl IS NULL THEN '(default)'
                                      WHEN pg_catalog.cardinality(c.relacl) = 0 THEN '(empty)'
                                      ELSE (SELECT pg_catalog.string_agg(a::text, ',' ORDER BY a::text)
                                            FROM pg_catalog.unnest(c.relacl) AS a) END
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(c.oid, 'pg_class')), '(none)')
            FROM owned_seq AS sc
            JOIN pg_catalog.pg_class AS c ON c.oid = sc.oid
            UNION ALL
            SELECT 9, 3,
                   'sequence ' || sc.nspname || '.' || sc.relname || ' relation .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM owned_seq AS sc
            JOIN pg_catalog.pg_class AS c ON c.oid = sc.oid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(c) - ARRAY[
              'oid', 'reltype', 'relfilenode', 'reltoastrelid', 'relrewrite',
              'relpages', 'reltuples', 'relallvisible', 'relallfrozen', 'relfrozenxid', 'relminmxid',
              'relhasindex', 'relhasrules', 'relhastriggers', 'relhassubclass',
              'relacl']) AS kv
            UNION ALL
            SELECT 9, 4,
                   'sequence ' || sc.nspname || '.' || sc.relname || ' stands at .' || slot.key || '='
                   || COALESCE(pg_catalog.substring(standing.one_row, '<' || slot.key || '>([^<]*)</' || slot.key || '>'), '(unread)')
            FROM owned_seq AS sc
            CROSS JOIN LATERAL (
              SELECT pg_catalog.query_to_xml(
                       pg_catalog.format('SELECT last_value, is_called FROM %I.%I', sc.nspname, sc.relname),
                       false, true, '')::text AS one_row) AS standing
            CROSS JOIN (VALUES ('last_value'), ('is_called')) AS slot(key)
            UNION ALL
            SELECT 10, 0,
                   'rule ' || pg_catalog.pg_get_ruledef(r.oid) || ' enabled=' || r.ev_enabled::text
            FROM reg
            JOIN pg_catalog.pg_rewrite AS r ON r.ev_class = reg.oid
            UNION ALL
            SELECT 11, 0,
                   'statistics ' || pg_catalog.pg_get_statisticsobjdef(s.oid)
                   || ' target=' || COALESCE(s.stxstattarget::text, '(default)')
            FROM reg
            JOIN pg_catalog.pg_statistic_ext AS s ON s.stxrelid = reg.oid
            UNION ALL
            SELECT DISTINCT 12, 0,
                   'comment_on ' || pg_catalog.pg_describe_object(d.classid, d.objid, d.objsubid)
                   || ' ' || pg_catalog.md5(described.description)
            FROM pg_catalog.pg_depend AS d
            JOIN pg_catalog.pg_description AS described
              ON described.classoid = d.classid AND described.objoid = d.objid AND described.objsubid = d.objsubid,
                 reg, fn
            WHERE d.deptype <> 'i'
              AND ((d.refclassid = 'pg_catalog.pg_class'::pg_catalog.regclass AND d.refobjid = reg.oid)
                   OR (d.refclassid = 'pg_catalog.pg_proc'::pg_catalog.regclass AND d.refobjid = fn.oid))
            UNION ALL
            SELECT DISTINCT 13, 0,
                   'hangs_off ' || pg_catalog.pg_describe_object(d.classid, d.objid, d.objsubid)
            FROM pg_catalog.pg_depend AS d, reg, fn
            WHERE d.deptype <> 'i'
              AND ((d.refclassid = 'pg_catalog.pg_class'::pg_catalog.regclass AND d.refobjid = reg.oid)
                   OR (d.refclassid = 'pg_catalog.pg_proc'::pg_catalog.regclass AND d.refobjid = fn.oid))
          ) AS fact
          WHERE fact.line IS NOT NULL
          ORDER BY fact.part, fact.pos, fact.line
          SQL
          )"
          fingerprint() { # <db>
            sql "$1" "$owned_state"
          }

          failed=0
          fail() {
            echo "rollback round trip FAILED: $*" >&2
            failed=1
          }

          # Execute the exact NULL/empty distinction against the job's PostgreSQL,
          # rather than letting a text assertion stand in for ACL semantics.
          acl_sentinels="$(sql "$source_db" "SELECT pg_catalog.string_agg(
            CASE WHEN fixture.acl IS NULL THEN '(default)'
                 WHEN pg_catalog.cardinality(fixture.acl) = 0 THEN '(empty)'
                 ELSE '(entries)'
            END,
            '|' ORDER BY fixture.ord)
          FROM (VALUES
            (1, NULL::pg_catalog.aclitem[]),
            (2, ARRAY[]::pg_catalog.aclitem[])
          ) AS fixture(ord, acl)")"
          if [[ "$acl_sentinels" != "(default)|(empty)" ]]; then
            echo "rollback round trip cannot start: ACL default/empty fixture collapsed to [$acl_sentinels]" >&2
            exit 1
          fi
          echo "ACL sentinel fixture: default and explicit empty remain distinct"

          # The shipped state this lane starts from. Without it there is nothing to
          # come back TO, so stop rather than compare against a wrong baseline.
          if [[ "$(ledger_pair "$source_db")" != "$pair" ]]; then
            echo "rollback round trip cannot start: expected the ledger rows [$pair] after the push, found [$(ledger_pair "$source_db")]" >&2
            exit 1
          fi
          for role in public anon authenticated; do
            if [[ "$(can_execute "$source_db" "$role")" != "f" ]]; then
              echo "rollback round trip cannot start: $role already holds EXECUTE on erase_my_data before any rollback" >&2
              exit 1
            fi
          done

          echo "== control: the rollback, with 0190's ledger row put back (the pre-fix end state)"
          clone "$control_db"
          sql "$control_db" "CREATE TABLE supabase_migrations.rollback_probe_kept AS
                             SELECT * FROM supabase_migrations.schema_migrations
                             WHERE name = 'lock_erase_my_data_authenticated'"
          roll_back "$control_db"
          # ON CONFLICT: if the rollback under test leaves the row in place (the very
          # regression this lane is for), the control still builds the same state
          # and the verdict comes from the "fixed" half, with a message that says so.
          sql "$control_db" "INSERT INTO supabase_migrations.schema_migrations
                             SELECT * FROM supabase_migrations.rollback_probe_kept
                             ON CONFLICT (version) DO NOTHING"
          sql "$control_db" "DROP TABLE supabase_migrations.rollback_probe_kept"
          control_ledger="$(ledger_pair "$control_db")"
          push_again "$control_db"
          control_open="$(can_execute "$control_db" authenticated)"
          echo "control: ledger before the re-push [$control_ledger] -> authenticated EXECUTE after it = $control_open"
          if [[ "$control_ledger" != "lock_erase_my_data_authenticated" ]]; then
            fail "the control did not reach the pre-fix state: ledger held [$control_ledger], expected only lock_erase_my_data_authenticated"
          fi
          if [[ "$control_open" != "t" ]]; then
            fail "VACUOUS. With 0190's ledger row left behind, erase_my_data should come back executable by authenticated, and it did not (authenticated EXECUTE = $control_open). This database cannot show the hole, so the verdict below proves nothing. Either the function default-privilege floor is missing (see \"Seed Supabase compatibility layer\") or the CLI no longer skips an applied version."
          fi

          echo "== fixed: $down as shipped"
          clone "$fixed_db"
          before="$(fingerprint "$fixed_db")"
          echo "fixed: what hangs off erase_my_data and erasure_registry before the rollback"
          sed 's/^/  /' <<< "$before"

          echo "== sight: can that list see what a later migration would hang there?"
          probed() { # <one statement>  -- the fingerprint with it applied, then rolled back
            psql -X -q -h localhost -U postgres -d "$fixed_db" -v ON_ERROR_STOP=1 -At \
              -c 'BEGIN' -c "$1" -c "$owned_state" -c 'ROLLBACK'
          }
          sees() { # <what> <one statement a later migration could run>
            local moved
            if ! moved="$(probed "$2")"; then
              fail "the sight probe for $1 could not run: $2"
            elif [[ "$moved" == "$before" ]]; then
              fail "BLIND to $1. The fingerprint did not move when this ran: $2. A later migration that does the same and is left out of the list in $down loses it to the rollback's DROP, and the comparison below stays green about it. Add the fact to owned_state."
            else
              echo "sight: sees $1"
            fi
          }
          # MEASURED 2026-09-21 00:48 KST: with the whole policy part cut out of
          # owned_state, sees "a policy" still passed. Creating an object moves
          # TWO parts, its own and the pg_depend net at the end, so the net alone
          # kept the probe green while nothing read the policy's USING clause any
          # more. (A new column is seen twice the same way: by its own line and by
          # the row hash, which is over r::text.) What only the named part can do
          # is tell two DEFINITIONS of one object apart, so that is what it is
          # asked: the same name, defined two ways, must give two fingerprints.
          tells_apart() { # <what> <one statement> <the same object, defined differently>
            local one other
            if ! one="$(probed "$2")" || ! other="$(probed "$3")"; then
              fail "the sight probe for $1 could not run: $2 / $3"
            elif [[ "$one" == "$before" || "$one" == "$other" ]]; then
              fail "BLIND to the definition of $1. These two give the same fingerprint: [$2] and [$3]. A later migration that re-defines it and is left out of the list in $down loses the new definition to the rollback's DROP, and the comparison below stays green about it. Put the definition back into owned_state."
            else
              echo "sight: tells apart two definitions of $1"
            fi
          }
          # A probe has to move the fingerprint on TODAY's schema and on next year's, so
          # none of them may be something a real migration would do. MEASURED 2026-09-21
          # 00:39 KST: the first column probe was the gate's statement verbatim (ADD COLUMN
          # deletion_generation), and the run that mattered most went red on it. A 0191
          # that really adds that column, correctly listed in the rollback, met "column
          # already exists". Hence one reserved name (rollback_probe), grants that go to
          # anon (authenticated is who S3-C / S3-D will open the RPC to, and a GRANT that
          # is already there moves nothing), and values no one would choose.
          tells_apart "a column" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint NOT NULL DEFAULT 0" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe integer NOT NULL DEFAULT 0"
          tells_apart "a constraint" \
            "ALTER TABLE public.erasure_registry ADD CONSTRAINT rollback_probe CHECK (table_name <> '')" \
            "ALTER TABLE public.erasure_registry ADD CONSTRAINT rollback_probe CHECK (table_name <> 'rollback probe')"
          tells_apart "an index" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name)" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name) WHERE table_name <> ''"
          tells_apart "a policy" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (false)" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (true)"
          tells_apart "a trigger" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger()" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW WHEN (OLD.table_name <> '') EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger()"
          tells_apart "a rule" \
            "CREATE RULE rollback_probe AS ON DELETE TO public.erasure_registry DO INSTEAD NOTHING" \
            "CREATE RULE rollback_probe AS ON DELETE TO public.erasure_registry DO ALSO NOTHING"
          tells_apart "a statistics object" \
            "CREATE STATISTICS public.rollback_probe ON (pg_catalog.length(table_name)) FROM public.erasure_registry" \
            "CREATE STATISTICS public.rollback_probe ON (pg_catalog.upper(table_name)) FROM public.erasure_registry"
          # The same object twice, the second time with one more statement after it:
          # the property is what has to tell the two apart, not the object's arrival.
          tells_apart "a trigger that is switched off" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger()" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger(); ALTER TABLE public.erasure_registry DISABLE TRIGGER rollback_probe"
          tells_apart "the index the table is clustered on" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name)" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name); ALTER TABLE public.erasure_registry CLUSTER ON rollback_probe"
          tells_apart "an index column's statistics target" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (pg_catalog.lower(table_name))" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (pg_catalog.lower(table_name)); ALTER INDEX public.rollback_probe ALTER COLUMN 1 SET STATISTICS 9189"
          # An identity column's sequence hangs off the table INTERNALLY, which is the
          # one kind of dependency the net at the end leaves out (it has to: the TOAST
          # table is internal too, and is named after an OID). MEASURED 2026-09-21
          # 02:29 KST: SET INCREMENT BY moved pg_sequence and nothing here. The
          # generation counter S3-C / S3-D will add is the column this is about.
          #
          # Three probes, one for each place a sequence keeps what it is (see the
          # note above owned_state). The first used to stand for all three and only
          # bites on the parameters. r55's two gates found the other two from
          # opposite ends: where it STANDS (42 against 73: both leave pg_sequence
          # untouched and both read NULL in pg_sequences, so nothing short of the
          # relation's own row tells them apart) and who may USE it.
          tells_apart "the parameters of the sequence behind a column" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY; ALTER TABLE public.erasure_registry ALTER COLUMN rollback_probe SET INCREMENT BY 7"
          tells_apart "where the sequence behind a column stands" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY; ALTER TABLE public.erasure_registry ALTER COLUMN rollback_probe RESTART WITH 42" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY; ALTER TABLE public.erasure_registry ALTER COLUMN rollback_probe RESTART WITH 73"
          tells_apart "a grant on the sequence behind a column" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY (SEQUENCE NAME public.rollback_probe_seq)" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY (SEQUENCE NAME public.rollback_probe_seq); GRANT USAGE ON SEQUENCE public.rollback_probe_seq TO anon"
          tells_apart "a comment on something that hangs off the table" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (false); COMMENT ON POLICY rollback_probe ON public.erasure_registry IS 'rollback probe'" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (false); COMMENT ON POLICY rollback_probe ON public.erasure_registry IS 'another rollback probe'"
          # r52 artifact gate, B-NEW-01: the four column facts nobody collected. The
          # first is the gate's statement. A property with one slot cannot be probed
          # under a reserved NAME, so it gets a value no migration would choose, or
          # (two of them have only a handful of values) whichever value it does not
          # hold now: a probe that sets what is already set moves nothing and would
          # read as BLIND on the day a real migration picks the same one.
          sees "a column's statistics target" "ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET STATISTICS 9189"
          sees "a column's storage mode" "DO \$flip\$ BEGIN IF (SELECT a.attstorage FROM pg_catalog.pg_attribute AS a WHERE a.attrelid = pg_catalog.to_regclass('public.erasure_registry') AND a.attname = 'table_name') = 'e' THEN ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET STORAGE MAIN; ELSE ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET STORAGE EXTERNAL; END IF; END \$flip\$"
          sees "a column's compression method" "DO \$flip\$ BEGIN IF (SELECT a.attcompression FROM pg_catalog.pg_attribute AS a WHERE a.attrelid = pg_catalog.to_regclass('public.erasure_registry') AND a.attname = 'table_name') = 'p' THEN ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET COMPRESSION default; ELSE ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET COMPRESSION pglz; END IF; END \$flip\$"
          sees "a column's options" "ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET (n_distinct = -0.190189)"
          # ...and one that nobody named at all, in the gate's list or this one. It is
          # here to show what reading the whole row buys: inheritance is recorded on
          # the COLUMN (attislocal, attinhcount), and no line of this query says so.
          sees "a column the table now inherits" "CREATE TABLE public.rollback_probe_parent (table_name text); ALTER TABLE public.erasure_registry INHERIT public.rollback_probe_parent"
          sees "the table's storage parameters" "ALTER TABLE public.erasure_registry SET (autovacuum_analyze_threshold = 190189)"
          sees "the TOAST table's storage parameters" "ALTER TABLE public.erasure_registry SET (toast.autovacuum_vacuum_threshold = 190189)"
          sees "the table's owner" "ALTER TABLE public.erasure_registry OWNER TO anon"
          sees "the table's comment" "COMMENT ON TABLE public.erasure_registry IS 'rollback probe'"
          sees "a column's comment" "COMMENT ON COLUMN public.erasure_registry.table_name IS 'rollback probe'"
          sees "a table grant" "GRANT TRUNCATE ON public.erasure_registry TO anon"
          sees "a column grant" "GRANT REFERENCES (table_name) ON public.erasure_registry TO anon"
          sees "row security switched off" "ALTER TABLE public.erasure_registry DISABLE ROW LEVEL SECURITY"
          sees "row security forced, or unforced" "DO \$flip\$ BEGIN IF (SELECT c.relforcerowsecurity FROM pg_catalog.pg_class AS c WHERE c.oid = pg_catalog.to_regclass('public.erasure_registry')) THEN ALTER TABLE public.erasure_registry NO FORCE ROW LEVEL SECURITY; ELSE ALTER TABLE public.erasure_registry FORCE ROW LEVEL SECURITY; END IF; END \$flip\$"
          sees "a column default" "ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET DEFAULT 'rollback probe'"
          sees "a dropped NOT NULL" "ALTER TABLE public.erasure_registry ALTER COLUMN reason DROP NOT NULL"
          sees "the registry rows" "DELETE FROM public.erasure_registry"
          sees "the function's owner" "ALTER FUNCTION public.erase_my_data(text) OWNER TO anon"
          sees "the function's settings" "ALTER FUNCTION public.erase_my_data(text) SET statement_timeout = '190189ms'"
          sees "a function grant" "GRANT EXECUTE ON FUNCTION public.erase_my_data(text) TO anon"
          sees "the function's comment" "COMMENT ON FUNCTION public.erase_my_data(text) IS 'rollback probe'"
          sees "a ledger row" "UPDATE supabase_migrations.schema_migrations SET name = name || '_probe' WHERE name = 'lock_erase_my_data_authenticated'"
          if [[ "$(fingerprint "$fixed_db")" != "$before" ]]; then
            fail "the sight probes left something behind. Each one runs inside a transaction that is rolled back, and the fingerprint no longer equals the one taken before them, so the comparison below starts from a state no migration produced."
          fi

          ledger_names() { # <db>  -- one line, so it reads the same through a CRLF psql
            sql "$1" "SELECT COALESCE(pg_catalog.string_agg(m.name, ' ' ORDER BY m.version), '')
                      FROM supabase_migrations.schema_migrations AS m"
          }
          ledger_before_rollback="$(ledger_names "$fixed_db")"
          roll_back "$fixed_db"
          after_rollback="$(ledger_pair "$fixed_db")"
          if [[ "$after_rollback" != "(none)" ]]; then
            fail "$down left [$after_rollback] in the migration ledger. 0189 and 0190 are one set: the DROP FUNCTION takes 0190's revoke with it, so a surviving 0190 row makes the next push skip the revoke and re-create erase_my_data open to authenticated."
          fi
          # What the shipped file DID to this ledger, not what its text says: the rows
          # that were there before it ran and are not there now. The "need" half
          # below asks its question of each of them.
          ledger_after_rollback=" $(ledger_names "$fixed_db") "
          deleted_by_the_rollback=""
          for name in $ledger_before_rollback; do
            if [[ "$ledger_after_rollback" != *" $name "* ]]; then
              deleted_by_the_rollback+="$name "
            fi
          done
          push_again "$fixed_db"
          after="$(fingerprint "$fixed_db")"
          verdict=""
          for role in public anon authenticated; do
            held="$(can_execute "$fixed_db" "$role")"
            verdict+="$role=$held "
            if [[ "$held" != "f" ]]; then
              fail "after rollback + re-push, $role can EXECUTE erase_my_data. It ships locked until a per-user delete fence exists (0190), and a rollback must not be the way it opens."
            fi
          done
          echo "fixed: ledger after the rollback [$after_rollback] -> EXECUTE after the re-push: $verdict"
          if [[ "$before" != "$after" ]]; then
            fail "rollback + re-push did not restore what hangs off erase_my_data and erasure_registry ('<' is before the rollback, '>' is after the re-push). A migration that alters either object loses its effect to the rollback's DROP, so its ledger row has to go too. In the same PR, add its ledger name to c_names in $down. By that file's convention an entry sits on its own line with the file's number and what it hangs there beside it:   'its_ledger_name',  -- NNNN: what it hangs on the two objects   That remark is for whoever runs the file by hand. It is documentation and nothing reads it as evidence: what admits an entry is this comparison going green with it, and the 'need' half below staying green."
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") | sed 's/^/  /' >&2 || true
          else
            echo "fixed: after the re-push, all $(wc -l <<< "$before" | tr -d ' ') facts are what they were"
          fi

          echo "== need: is every ledger row the rollback deletes one the re-push needs gone?"
          # The comparison above holds the list to a LOWER bound: leave out a row that
          # had to go and something does not come back. Nothing held it to an upper
          # one. A remark beside each entry was meant to (its file's number and ten
          # characters of reason, read by npm run verify), and r55's two gates showed
          # what that is worth: a migration that touches neither object, listed with
          # 'xxxxxxxxxx' beside it, passed both halves, was re-applied by the push
          # that follows a rollback, and took a counter in another table from 1 to 2
          # under an identical fingerprint (B-R55-N01; artifact gate, finding 2). A
          # sentence is not evidence. So each row the rollback deleted is asked the
          # only question a database can answer about it: put THAT ONE ROW back, as
          # if it had been left off the list, and push again. If everything
          # owned_state reads still comes back, nothing visible here needs that
          # migration re-applied, and it is on the list for no reason this step can
          # check: red. A push failure is evidence only when it is the exact causal
          # 0190/42883 failure produced by retaining 0189's row. Every other failure
          # is inconclusive and red; the causal case must recover after that one row
          # is removed before the gate may call it necessary.
          #
          # This is the control's move, for every row instead of 0190's alone. The
          # control stays because it asks for more than "differs": it demands the
          # SPECIFIC difference that is the hole (authenticated = t), and says
          # VACUOUS when this database cannot show it.
          #
          # What "needed" does NOT say: that re-applying is HARMLESS. A needed
          # migration is re-applied whole, and whatever else it does, to any table
          # that is not erasure_registry, happens twice. See "not collected" above.
          need_index=0
          needs() { # <ledger name>
            local case_db push_log push_rc state
            if [[ ! "$1" =~ ^[A-Za-z0-9_]+$ ]]; then
              fail "cannot ask whether [$1] is needed: the name goes into SQL text here, so only letters, digits and _ are taken."
              return
            fi
            need_index=$((need_index + 1))
            case_db="${need_db}_${need_index}"
            clone "$case_db"
            sql "$case_db" "CREATE TABLE supabase_migrations.rollback_probe_kept AS
                            SELECT * FROM supabase_migrations.schema_migrations
                            WHERE name = '$1'"
            roll_back "$case_db"
            sql "$case_db" "INSERT INTO supabase_migrations.schema_migrations
                            SELECT * FROM supabase_migrations.rollback_probe_kept
                            ON CONFLICT (version) DO NOTHING"
            sql "$case_db" "DROP TABLE supabase_migrations.rollback_probe_kept"
            echo "need: '$1' left in the ledger, everything else as the rollback leaves it."
            push_log="$staged_project/need-$1.log"
            if push_again "$case_db" >"$push_log" 2>&1; then
              push_rc=0
            else
              push_rc=$?
            fi
            cat "$push_log"

            if (( push_rc != 0 )); then
              if [[ "$1" != "erasure_registry" ]] \
                || ! grep -Fq "Applying migration 0190_lock_erase_my_data_authenticated.sql" "$push_log" \
                || ! grep -Fq "function public.erase_my_data(text) does not exist" "$push_log" \
                || ! grep -Fq "SQLSTATE 42883" "$push_log"; then
                fail "INCONCLUSIVE necessity check: '$1' re-push exited $push_rc without the exact causal 0190 missing-function signature. Infrastructure, CLI, authentication, timeout, and unrelated SQL failures are never evidence that a ledger row belongs in c_names."
                return
              fi

              echo "need: '$1' produced the expected 0190/42883 failure; remove only that retained row and require recovery."
              sql "$case_db" "DELETE FROM supabase_migrations.schema_migrations
                              WHERE name = '$1'"
              if ! push_again "$case_db"; then
                fail "CAUSALITY recovery failed: '$1' had the expected 0190/42883 error, but deleting only its retained ledger row did not make the re-push succeed."
                return
              fi
              if [[ "$(sql "$case_db" "SELECT pg_catalog.to_regclass('public.erasure_registry') IS NOT NULL
                                             AND pg_catalog.to_regprocedure('public.erase_my_data(text)') IS NOT NULL")" == "t" ]]; then
                state="$(fingerprint "$case_db")"
              else
                state="(erase_my_data or erasure_registry is absent after causal recovery)"
              fi
              if [[ "$state" != "$before" ]]; then
                fail "CAUSALITY recovery mismatch: deleting '$1' repaired the expected push failure, but the recovered state still differs from the pre-rollback fingerprint."
                diff <(printf '%s\n' "$before") <(printf '%s\n' "$state") | sed 's/^/  /' | head -n 6 || true
              else
                echo "need: '$1' is causally necessary: its retained row produced the exact failure and removing it restored all collected state."
              fi
              return
            fi

            if [[ "$(sql "$case_db" "SELECT pg_catalog.to_regclass('public.erasure_registry') IS NOT NULL
                                           AND pg_catalog.to_regprocedure('public.erase_my_data(text)') IS NOT NULL")" == "t" ]]; then
              state="$(fingerprint "$case_db")"
            else
              state="(erase_my_data or erasure_registry is absent)"
            fi
            if [[ "$state" == "$before" ]]; then
              fail "UNNEEDED in c_names: '$1'. $down deletes its ledger row, so the push that follows a rollback applies that migration a second time, mid-incident. With that one row LEFT IN PLACE, the re-push ran and all $(wc -l <<< "$before" | tr -d ' ') facts about erase_my_data and erasure_registry still came back, so nothing this step can see needs it re-applied. Either (a) it hangs nothing on the two objects: take it out of c_names, whatever the remark beside it says; or (b) it does, and owned_state is BLIND to what it hangs there: add that fact to owned_state with a sight probe, and this goes green with the entry in place. Do not settle (b) by removing the entry: the thing it hangs there is then lost to the next rollback, in silence."
            else
              echo "need: '$1' has to go. With its row left in place, the re-push ran and this did not come back:"
              diff <(printf '%s\n' "$before") <(printf '%s\n' "$state") | sed 's/^/  /' | head -n 6 || true
            fi
          }
          if [[ -z "$deleted_by_the_rollback" ]]; then
            fail "$down deleted no ledger row at all, so there was nothing to ask the necessity question of."
          fi
          for name in $deleted_by_the_rollback; do
            needs "$name"
          done

          # ON FAILURE THE RUN-UNIQUE CLONES ARE LEFT WHERE THEY ARE, on purpose.
          # The EXIT trap above removes the staging directory and nothing else. In
          # CI a clone lives in the job's own service container and disappears with
          # it. In a local replay the unique clone is the evidence; no later run
          # guesses that it owns the database or deletes it pre-emptively.
          if (( failed )); then
            exit 1
          fi
          for clone_db in "${created_clones[@]}"; do
            sql "$source_db" "DROP DATABASE $clone_db"
          done
          echo "rollback round trip: the control re-opened, the shipped rollback did not, the state came back identical, and every row the rollback deletes (${deleted_by_the_rollback% }) had to go"
      - name: Reject account-deletion policies when Storage RLS is disabled
        env:
          PGPASSWORD: postgres
        run: |
          rls_log="$(mktemp)"
          trap 'rm -f -- "$rls_log"' EXIT
          if psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 >"$rls_log" 2>&1 <<'SQL'
          BEGIN;
          ALTER TABLE storage.objects DISABLE ROW LEVEL SECURITY;
          \i db/migration-drafts/UNNUMBERED_account_deletion_completion_fence.sql
          ROLLBACK;
          SQL
          then
            cat "$rls_log"
            echo "account-deletion draft accepted Storage with RLS disabled" >&2
            exit 1
          fi
          if ! grep -Fq "storage.objects RLS must be enabled before account-deletion policies" "$rls_log"; then
            cat "$rls_log"
            echo "account-deletion RLS preflight failed for the wrong reason" >&2
            exit 1
          fi
      - name: Exercise account-deletion completion fence
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/account_deletion_completion_fence_regression.sql
      - name: Dry-run standalone security migration drafts
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          # Other drafts have behavioral lanes. Execute these against the main
          # scratch schema and roll back each draft together with its prerequisite;
          # the signup lane's separate database cannot supply this dependency.
          drafts=(
            db/migration-drafts/UNNUMBERED_effective_llm_consent_current_contract.sql
            db/migration-drafts/UNNUMBERED_oauth_naver_rate_limit_completion.sql
            db/migration-drafts/UNNUMBERED_rss_proxy_quota.sql
          )

          for draft in "${drafts[@]}"; do
            prerequisite_sql=""
            if [[ "$draft" == "db/migration-drafts/UNNUMBERED_effective_llm_consent_current_contract.sql" ]]; then
              prerequisite_sql='\i db/migration-drafts/UNNUMBERED_signup_consent_admob_20260925.sql'
            fi
            echo "Dry-running $draft"
            psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 <<SQL
          BEGIN;
          $prerequisite_sql
          \i $draft
          ROLLBACK;
          SQL
          done
      # 0189's erase_my_data() is a destructive SECURITY DEFINER function, so it
      # is the one thing in this repo that must not be tested by reading its
      # source. The r38 gate measured 37 green string assertions over a function
      # whose receipt SELECT raised 42883 on every call (a schema-qualified
      # COALESCE) and rolled the whole deletion back. This step is the call.
      # Same scratch DB, same psql, no new secret, permission, or network reach.
      - name: Exercise content-erasure RPC isolation, refusals and receipt
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/erasure_registry_regression.sql
      - name: Exercise public-data quota contract
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/public_data_quota_regression.sql
      - name: Exercise peer-response quota admission accounting
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/peer_response_rate_limit_regression.sql
      - name: Dry-run Paddle refund consequence draft
        env:
          PGPASSWORD: postgres
        run: |
          preflight_log="$(mktemp)"
          if psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 >"$preflight_log" 2>&1 <<'SQL'
          BEGIN;
          \i db/tests/paddle_refund_duplicate_preflight_fixture.sql
          \i db/migration-drafts/UNNUMBERED_paddle_refund_consequence_integrity.sql
          ROLLBACK;
          SQL
          then
            cat "$preflight_log"
            echo "duplicate refund preflight unexpectedly succeeded" >&2
            exit 1
          fi
          if ! grep -Fq "duplicate refund consequences already exist" "$preflight_log"; then
            cat "$preflight_log"
            echo "duplicate refund preflight failed for the wrong reason" >&2
            exit 1
          fi
          rm -f "$preflight_log"

          unmapped_log="$(mktemp)"
          if psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 >"$unmapped_log" 2>&1 <<'SQL'
          BEGIN;
          \i db/tests/paddle_refund_duplicate_preflight_fixture.sql
          DELETE FROM public.paddle_webhook_events
           WHERE event_id = 'evt_ci_preflight_updated:consequence';
          \i db/migration-drafts/UNNUMBERED_paddle_refund_consequence_integrity.sql
          ROLLBACK;
          SQL
          then
            cat "$unmapped_log"
            echo "unmapped refund preflight unexpectedly succeeded" >&2
            exit 1
