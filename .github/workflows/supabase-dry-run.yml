name: Supabase migrations dry-run

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - ".github/workflows/supabase-dry-run.yml"

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled Postgres 16 (official pgvector image) so migration
        # 0047's `CREATE EXTENSION vector` resolves — matches Supabase prod,
        # which ships pgvector. Otherwise identical to stock postgres:16.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Seed Supabase compatibility layer (auth schema + roles + auth.users stub)
        env:
          PGPASSWORD: postgres
        run: |
          # The migrations reference auth.uid(), three Supabase roles
          # (authenticated / anon / service_role), and the auth.users table
          # (0018 attaches a BEFORE INSERT trigger to it). Vanilla Postgres
          # has none of these. We stub them just enough that the DDL parses
          # and role-conditional logic (e.g. 0015) sees the roles exist.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT '00000000-0000-0000-0000-000000000000'::uuid $$;
          CREATE TABLE IF NOT EXISTS auth.users (
            id                 uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email              text,
            email_confirmed_at timestamptz
          );
          -- supabase_auth_admin is the role the JWT claim hook runs as (0139).
          -- It was added to the migrations on 2026-08-21 but NOT to this stub,
          -- so 0139 line 199 (`CREATE POLICY ... TO supabase_auth_admin`) died
          -- with `role does not exist` and this job has been red on main ever
          -- since. The fix belongs here, not in 0139: prod really does have that
          -- role, and guarding the policy in SQL would let it be SILENTLY
          -- SKIPPED -- which is the exact failure 0139's own comment warns about
          -- (the hook returns an empty array and the mechanism looks like it
          -- works while granting nothing). A red CI is the better failure.
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated')       THEN CREATE ROLE authenticated;       END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon')                THEN CREATE ROLE anon;                END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role')        THEN CREATE ROLE service_role;        END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN CREATE ROLE supabase_auth_admin; END IF;
          END $$;
          SQL
      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Confirm key constraints
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "\d+ users" | grep users_birth_date_sane
          psql -h localhost -U postgres -c "\dt guardian_consents" | grep guardian_consents
          psql -h localhost -U postgres -c "\d+ ai_audit_log" | grep vertex_backend
          psql -h localhost -U postgres -c "\d+ revenue_events" | grep month_bucket
          psql -h localhost -U postgres -c "\d+ testimonials" | grep consent_given_at
          psql -h localhost -U postgres -c "\d+ knowledge_sources" | grep ks_must_have
      - name: Confirm the auth hook can still read its table
        env:
          PGPASSWORD: postgres
        # 2026-08-23: 0139's grants block never reached production, so the auth
        # hook could not SELECT public.user_roles and EVERY sign-in returned 500
        # ("Error running hook URI: ... custom_access_token_hook"). A policy
        # alone is not enough -- Postgres needs the table GRANT too, and the
        # migration had one only in a section that went missing.
        #
        # This asserts the END STATE after all migrations, so it catches the
        # class rather than that one file: if a future migration drops or
        # revokes this grant, the job fails here instead of in production at
        # sign-in. 0141 carries the same assertion so a bad APPLY is caught too.
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT has_table_privilege('supabase_auth_admin', 'public.user_roles', 'SELECT') THEN
              RAISE EXCEPTION 'auth hook cannot SELECT public.user_roles -- sign-in would 500';
            END IF;
            IF has_table_privilege('authenticated', 'public.user_roles', 'INSERT') THEN
              RAISE EXCEPTION 'authenticated can INSERT into user_roles -- self-promotion path';
            END IF;
            IF has_table_privilege('anon', 'public.user_roles', 'SELECT') THEN
              RAISE EXCEPTION 'anon holds SELECT on user_roles';
            END IF;
          END $$;
          SQL
