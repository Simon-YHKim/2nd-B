name: Supabase migrations dry-run

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "db/migration-drafts/**"
      - "db/tests/**"
      - "db/ops/**"
      - "scripts/check-reward-ssv-db.sh"
      - "scripts/test-polaris-sql.mjs"
      - "scripts/test-signup-consent-sql.mjs"
      - "scripts/test-unconfirmed-signup-cleanup.py"
      - "scripts/test-weather-sql.mjs"
      - "scripts/test-weather-consent-admission.mjs"
      - "supabase/functions/weather/handler.ts"
      - "scripts/test-dashboard-sql.mjs"
      - "scripts/test-dashboard-lease-sql.mjs"
      - "scripts/test-dashboard-recovery-replay.mjs"
      - "supabase/functions/dashboard-generate/**"
      - "scripts/test-profile-import-sql.mjs"
      - "scripts/test-deletion-receipt-sql.mjs"
      - "scripts/test-records-embedding-consent-sql.mjs"
      - "scripts/test-interview-content-authority-sql.mjs"
      - "scripts/test-support-reports-sql.mjs"
      - "scripts/test-chat-turn-admission-races.sh"
      - "scripts/test-chat-turn-refund-evidence.py"
      - "scripts/test-chat-turn-purpose-restore.py"
      - "scripts/check-account-export-inventory.ts"
      - "scripts/generate-erasure-registry.ts"
      - "db/erasure-registry.json"
      - "supabase/functions/export-account/**"
      - ".github/workflows/supabase-dry-run.yml"

# Least privilege: this workflow only reads the repo (checkout + local tooling).
# It never uses GITHUB_TOKEN to write, so it does not inherit the repository's
# default token scope. Audited 2026-09-06 (C-22): ci.yml, pr-title.yml and
# supabase-dry-run.yml were the three workflows with no permissions block.
permissions:
  contents: read

# Same rationale as ci.yml: a pure check with no deploy side effects, so a newer
# push to the same PR cancels the run it supersedes.
concurrency:
  group: sql-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled Postgres 16 (official pgvector image) so migration
        # 0047's `CREATE EXTENSION vector` resolves — matches Supabase prod,
        # which ships pgvector. Otherwise identical to stock postgres:16.
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b # pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise dormant support report RPC
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE t53_support_test_ci'
          psql -X -h 127.0.0.1 -U postgres -d t53_support_test_ci -v ON_ERROR_STOP=1 -f db/migration-drafts/tests/support-reports.sql
      # The weather SQL fixture runs the real Edge with Node's built-in TS
      # transform. No npm dependencies or app installation are needed here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Race support report retries and quota slots
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE t53_support_test_races'
          node scripts/test-support-reports-sql.mjs 5432 t53_support_test_races
      - name: Exercise Polaris allowance and concurrent reservation contract
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE polaris_local LOGIN SUPERUSER PASSWORD 'postgres';
          CREATE DATABASE polaris_test_ci OWNER polaris_local;
          SQL
          node scripts/test-polaris-sql.mjs 5432 polaris_local polaris_test_ci
      - name: Exercise signup consent forward contract
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE signup_local LOGIN SUPERUSER PASSWORD 'postgres';
          CREATE DATABASE signup_test_ci OWNER signup_local;
          SQL
          node scripts/test-signup-consent-sql.mjs 5432 signup_local signup_test_ci
      - name: Exercise unconfirmed signup cleanup draft and SQL mutations
        timeout-minutes: 5
        env:
          PGPASSWORD: postgres
        run: python3 scripts/test-unconfirmed-signup-cleanup.py 5432 t07_cleanup_test_ci
      - name: Exercise weather location consent and adult lock
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE weather_local LOGIN SUPERUSER PASSWORD 'postgres';
          CREATE DATABASE weather_test_ci OWNER weather_local;
          SQL
          node scripts/test-weather-sql.mjs 5432 weather_local weather_test_ci
      - name: Exercise profile import ownership, withdrawal and concurrent saves
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE profile_import_local LOGIN SUPERUSER PASSWORD 'postgres';
          CREATE DATABASE profile_import_test_ci OWNER profile_import_local;
          SQL
          node scripts/test-profile-import-sql.mjs 5432 profile_import_local profile_import_test_ci
      # The lease fixture uses the real Edge modules with mocked vendor I/O.
      # Reuse Node 24 above and locked TypeScript/Zod; no install hooks.
      - name: Install existing Edge test dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Exercise W1 generation locks, owner isolation and 0248 note backstop
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE dashboard_local LOGIN SUPERUSER PASSWORD 'postgres';
          CREATE DATABASE dashboard_test_ci OWNER dashboard_local;
          SQL
          node scripts/test-dashboard-sql.mjs 5432 dashboard_test_ci
      - name: Seed Supabase compatibility layer (auth, roles, and storage stubs)
        env:
          PGPASSWORD: postgres
        run: |
          # The migrations reference auth.uid(), four Supabase roles
          # (authenticated / anon / service_role / supabase_auth_admin), and
          # the auth.users table
          # (0018 attaches a BEFORE INSERT trigger to it). Vanilla Postgres
          # has none of these. We stub them just enough that the DDL parses
          # and role-conditional logic (e.g. 0015) sees the roles exist.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$
              SELECT COALESCE(
                NULLIF(pg_catalog.current_setting('request.jwt.claim.sub', true), ''),
                NULLIF(pg_catalog.current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub'
              )::uuid
            $$;
          CREATE TABLE IF NOT EXISTS auth.users (
            id                 uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email              text,
            deleted_at         timestamptz,
            email_confirmed_at timestamptz,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE TABLE IF NOT EXISTS auth.sessions (
            id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id    uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            created_at timestamptz NOT NULL DEFAULT pg_catalog.now()
          );

          -- Supabase Storage is absent from the plain PostgreSQL service. Its
          -- minimal contract keeps the raw-clippings policies and deletion
          -- trigger executable in CI instead of silently taking their
          -- non-Supabase NOTICE branch.
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id                 text PRIMARY KEY,
            name               text NOT NULL,
            public             boolean NOT NULL DEFAULT false,
            file_size_limit    bigint,
            allowed_mime_types text[]
          );
          CREATE TABLE IF NOT EXISTS storage.objects (
            id        uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text REFERENCES storage.buckets(id),
            name      text
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          CREATE OR REPLACE FUNCTION storage.foldername(name text)
          RETURNS text[]
          LANGUAGE plpgsql
          IMMUTABLE
          AS $$
          DECLARE
            parts text[];
          BEGIN
            parts := pg_catalog.string_to_array(name, '/');
            RETURN parts[1:pg_catalog.array_length(parts, 1) - 1];
          END;
          $$;
          -- supabase_auth_admin is the role the JWT claim hook runs as (0139).
          -- It was added to the migrations on 2026-08-21 but NOT to this stub,
          -- so 0139 line 199 (`CREATE POLICY ... TO supabase_auth_admin`) died
          -- with `role does not exist` and this job has been red on main ever
          -- since. The fix belongs here, not in 0139: prod really does have that
          -- role, and guarding the policy in SQL would let it be SILENTLY
          -- SKIPPED -- which is the exact failure 0139's own comment warns about
          -- (the hook returns an empty array and the mechanism looks like it
          -- works while granting nothing). A red CI is the better failure.
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated')       THEN CREATE ROLE authenticated;       END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon')                THEN CREATE ROLE anon;                END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role')        THEN CREATE ROLE service_role;        END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN CREATE ROLE supabase_auth_admin; END IF;
          END $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          GRANT USAGE ON SCHEMA storage TO authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE storage.objects TO authenticated;
          GRANT EXECUTE ON FUNCTION storage.foldername(text) TO authenticated;

          -- Supabase's default privileges for FUNCTIONS in `public`. This must
          -- stand BEFORE the first migration, because a default privilege is
          -- stamped on a function when it is created and never afterwards.
          --
          -- Prod creates every public function with EXECUTE already granted, BY
          -- NAME, to anon, authenticated and service_role. The repo measured it:
          -- after 0035:85 revoked PUBLIC and nothing else, prod's ACL was
          -- {postgres=X,anon=X,authenticated=X,service_role=X}
          -- (0036_lock_bump_gemini_spend.sql:11-13), and 0082 and
          -- scripts/check-definer-grants.ts:3-8 say the same. Vanilla Postgres
          -- grants PUBLIC and nobody by name, so until 2026-09-20 this scratch
          -- DB had no such floor, and every `NOT has_function_privilege(
          -- 'authenticated', ...)` in this job was true of ANY function whose
          -- migration revoked PUBLIC -- whether or not it revoked authenticated.
          -- That is how 0189 shipped `REVOKE ... FROM PUBLIC, anon` on
          -- erase_my_data as "locked" with the lock assertion green, while the
          -- same text on prod leaves authenticated=X (R48 artifact gate F-02;
          -- 0190 is the correction).
          --
          -- MEASURED 2026-09-20, scratch PostgreSQL 18.3, whole tree applied and
          -- every lane of this job replayed except the CLI push and the SSV lane
          -- (which refuses to run outside Actions):
          --   floor, authenticated revoke removed    -> erasure lane RED, ACL
          --     {postgres=X,authenticated=X,service_role=X} -- prod's shape
          --   no floor, authenticated revoke removed -> erasure lane GREEN, ACL
          --     {postgres=X} -- the vacuous pass this floor exists to end
          --   floor, tree as shipped                 -> every replayed lane green;
          --     the apply-time ACL checks in 0141 and 0172-0185 all still hold,
          --     so the floor changes the verdict of nothing else.
          --
          -- FOR ROLE postgres is spelled out because default privileges belong
          -- to the role that CREATES the object, and every migration in this job
          -- is applied as postgres (psql -U postgres, and the CLI's db-url).
          -- db/tests/erasure_registry_regression.sql block (L) creates a probe
          -- function and refuses to draw a conclusion if this floor is absent,
          -- so deleting these lines turns that lane red instead of vacuous.
          --
          -- FUNCTIONS only here. The targeted audit TABLE grants are installed
          -- after baseline replay, immediately before the staged CLI push. That
          -- reproduces production's existing-table ACL at the 0179 boundary
          -- without changing the unrelated baseline table fixtures.
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;
          SQL
      - name: Apply baseline migrations (0001-0146) in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            base="${f##*/}"
            version="${base%%_*}"
            if [[ ! "$version" =~ ^[0-9]+$ ]]; then
              echo "Migration filename has no numeric version: $base" >&2
              exit 1
            fi
            if (( 10#$version <= 146 )); then
              echo "Applying baseline $f"
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
            fi
          done
      - name: Reproduce production audit table grants before 0179
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          -- Production public-table defaults grant these rights by name. Earlier
          -- migrations created both tables without revoking them; 0181's REVOKE
          -- is too late to make 0179 pass. Start the staged replay from the
          -- production ACL so 0179's own postcondition tests the repair.
          GRANT ALL ON TABLE public.ai_audit_log, public.crisis_events
            TO anon, authenticated, service_role;
          -- Vanilla PG has no Supabase public-table grant floor. 0140 narrows
          -- users UPDATE but deliberately preserves SELECT; 0263 checks that
          -- real clients can read their own RETURNING row (RLS still applies).
          GRANT SELECT ON public.users TO authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON public.records TO authenticated;
          DO $precondition$
          BEGIN
            IF NOT has_table_privilege('anon', 'public.ai_audit_log', 'TRUNCATE')
               OR NOT has_table_privilege('authenticated', 'public.ai_audit_log', 'TRUNCATE')
               OR NOT has_table_privilege('anon', 'public.crisis_events', 'TRUNCATE')
               OR NOT has_table_privilege('authenticated', 'public.crisis_events', 'TRUNCATE') THEN
              RAISE EXCEPTION 'production audit grant fixture missing before 0179';
            END IF;
          END
          $precondition$;
          SQL
      # Pin the executable because its statement splitting and migration-ledger
      # writes are part of this test contract, not an ambient runner detail.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.116.0
      - name: Apply staged migrations (0147+) through Supabase CLI
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          staged_project="$(mktemp -d)"
          trap 'rm -rf -- "$staged_project"' EXIT
          supabase init --workdir "$staged_project"
          mkdir -p -- "$staged_project/supabase/migrations"

          staged_migrations=()
          for f in db/migrations/*.sql; do
            base="${f##*/}"
            version="${base%%_*}"
            if [[ ! "$version" =~ ^[0-9]+$ ]]; then
              echo "Migration filename has no numeric version: $base" >&2
              exit 1
            fi
            if (( 10#$version >= 147 )); then
              staged_migrations+=("$f")
            fi
          done

          if (( ${#staged_migrations[@]} == 0 )); then
            echo "No CLI-managed migrations found at version 0147 or later" >&2
            exit 1
          fi

          transaction_re='^[[:space:]]*(BEGIN([[:space:]]+(WORK|TRANSACTION))?|COMMIT([[:space:]]+WORK)?)[[:space:]]*;([[:space:]]*--.*)?$'
          for f in "${staged_migrations[@]}"; do
            if grep -HEn "$transaction_re" "$f"; then
              echo "Top-level transaction wrapper is forbidden in CLI-managed migration: $f" >&2
              exit 1
            fi
          done

          # Vanilla CI has no pg_cron; opt out explicitly for this scratch DB only.
          psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE postgres SET app.allow_missing_pg_cron = 'on'"

          # Four-digit 0147+ versions are a CI-scratch convention only. A
          # production bundle must receive separate monotonic timestamp versions
          # before any live db push. This command targets only the job-local DB;
          # it never reads a production URL, project ref, or repository secret.
          # Keep exact pre-promotion schemas for historical apply/backfill/down tests.
          # Each numbered file enters the CLI directory once; later pushes see its ledger.
          for boundary in 0265 0266 0267 0270 final; do
            for f in "${staged_migrations[@]}"; do
              base="${f##*/}"
              version="${base%%_*}"
              if [[ "$boundary" == final ]] || (( 10#$version < 10#$boundary )); then
                cp -- "$f" "$staged_project/supabase/migrations/"
              fi
            done
            # CLI 2.116 sends top-level LOCK outside an explicit transaction.
            # Keep repository bytes untouched; one DO executes each complete S/F
            # body atomically, like the Relay block. Never split its table locks.
            python3 - "$staged_project/supabase/migrations" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for name in ('0266_chat_turn_refund_evidence.sql', '0267_chat_turn_purpose_restore.sql'):
              path = root / name
              if not path.exists():
                  continue
              source = path.read_bytes()
              if b'$cli_body$' in source or b'$cli_transaction$' in source:
                  raise ValueError('CLI wrapper delimiter collision')
              path.write_bytes(b'DO $cli_transaction$ BEGIN EXECUTE $cli_body$' + source
                               + b'$cli_body$; END $cli_transaction$;\n')
          PY
            supabase db push \
              --db-url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
              --workdir "$staged_project" \
              --include-all \
              --skip-vault \
              --yes
            if [[ "$boundary" != final ]]; then
              psql -X -h localhost -U postgres -d template1 -v ON_ERROR_STOP=1 \
                -c "CREATE DATABASE t39_t40_before_${boundary} TEMPLATE postgres"
            fi
          done

          expected_count="${#staged_migrations[@]}"
          actual_count="$(psql -h localhost -U postgres -Atc \
            'SELECT count(*) FROM supabase_migrations.schema_migrations')"
          if [[ "$actual_count" != "$expected_count" ]]; then
            echo "Migration ledger has $actual_count rows; expected $expected_count" >&2
            exit 1
          fi

          for f in "${staged_migrations[@]}"; do
            base="${f##*/}"
            version="${base%%_*}"
            name="${base#*_}"
            name="${name%.sql}"
            row="$(psql -h localhost -U postgres -AtF '|' \
              -c "SELECT version, name, COALESCE(cardinality(statements), 0)
                  FROM supabase_migrations.schema_migrations
                  WHERE version = '$version'")"
            IFS='|' read -r actual_version actual_name statement_count <<< "$row"
            if [[ "$actual_version" != "$version" \
               || "$actual_name" != "$name" \
               || ! "$statement_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "Incomplete migration ledger record for $base" >&2
              exit 1
            fi
          done

          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'relation_people'
                AND column_name = 'client_revision'
                AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION '0147 end state is missing relation_people.client_revision';
            END IF;

            IF to_regprocedure('public.complete_verified_email_signup()') IS NULL THEN
              RAISE EXCEPTION '0148 end state is missing complete_verified_email_signup()';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_trigger
              WHERE tgname = 'trg_complete_verified_email_signup'
                AND tgrelid = 'auth.users'::regclass
                AND tgfoid = 'public.complete_verified_email_signup()'::regprocedure
                AND tgenabled <> 'D'
            ) THEN
              RAISE EXCEPTION 'verified-email completion trigger is missing or disabled';
            END IF;
          END $$;
          SQL
      - name: Exercise account export column grants on full schema clone
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Keep the draft out of the numbered replay DB and all other lanes.
          psql -X -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE account_export_grants_test_ci TEMPLATE postgres'
          trap 'psql -X -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS account_export_grants_test_ci"' EXIT
          psql -X -h 127.0.0.1 -U postgres -d account_export_grants_test_ci -v ON_ERROR_STOP=1 -f db/migration-drafts/tests/account-export-read-grants.sql
      - name: Exercise records embedding consent on full schema clone
        env:
          PGPASSWORD: postgres
          LOCAL_SQL_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE embed_consent_test_ci TEMPLATE postgres'
          node scripts/test-records-embedding-consent-sql.mjs "$LOCAL_SQL_CONTAINER" embed_consent_test_ci
      - name: Exercise dormant deletion-receipt contract on full schema clone
        env:
          PGPASSWORD: postgres
          LOCAL_SQL_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # Clone only this job's fully replayed schema, before later lanes
          # deliberately mutate the main scratch DB. The runner refuses other
          # database names, accepts no URL, and does not read production env.
          psql -X -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE t04_receipt_test_ci TEMPLATE postgres'
          node scripts/test-deletion-receipt-sql.mjs "$LOCAL_SQL_CONTAINER" t04_receipt_test_ci
      - name: Exercise dormant interview content authority on full schema clone
        env:
          PGPASSWORD: postgres
          LOCAL_SQL_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # Use this job's freshly replayed numbered schema, not a cached DB.
          # The runner checks the complete ledger and installed writer locks
          # before applying the draft, then exercises real two-connection races.
          psql -X -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE t16_authority_test_ci TEMPLATE postgres'
          node scripts/test-interview-content-authority-sql.mjs "$LOCAL_SQL_CONTAINER" t16_authority_test_ci
      - name: Exercise dormant T39 admission on full schema clone
        timeout-minutes: 10
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # 0265 is already installed in this pre-0266 snapshot. Reapply its exact file.
          # Only this job's fresh local schema is cloned; no remote URL or secrets.
          psql -X -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE t39_admission_test_ci TEMPLATE t39_t40_before_0266'
          t39_snapshot() {
            pg_dump -h 127.0.0.1 -U postgres -d t39_admission_test_ci \
              --schema=public --schema=supabase_migrations \
              | sed -E '/^\\(un)?restrict /d'
          }
          t39_before="$(t39_snapshot)"
          psql -X -h 127.0.0.1 -U postgres -d t39_admission_test_ci -v ON_ERROR_STOP=1 \
            --single-transaction -f db/migrations/0265_chat_turn_attempt_with_quota.sql
          t39_after="$(t39_snapshot)"
          cmp <(printf '%s\n' "$t39_before") <(printf '%s\n' "$t39_after")
          echo "PASS: exact 0265 reapply leaves public schema/data and migration ledger unchanged"
          psql -X -h 127.0.0.1 -U postgres -d t39_admission_test_ci -v ON_ERROR_STOP=1 \
            -f db/tests/chat-turn-attempt-with-quota.sql
          psql -X -h 127.0.0.1 -U postgres -d t39_admission_test_ci -v ON_ERROR_STOP=1 \
            --single-transaction -f db/migrations/rollback/0265_down.sql
          psql -X -h 127.0.0.1 -U postgres -d t39_admission_test_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $t39_down$
          BEGIN
            IF to_regprocedure('public.begin_chat_turn_attempt_with_quota(uuid,uuid,uuid,text,text)') IS NOT NULL
               OR to_regprocedure('public.begin_chat_turn_attempt(uuid,uuid,uuid)') IS NULL
