            END;
            BEGIN
              PERFORM public.complete_profile_signup_consent(
                '1990-01-01', 'en', NULL, 'complete-profile-v1',
                true, true, true, false, true, false
              );
            EXCEPTION WHEN SQLSTATE '22023' THEN
              missing_ack := SQLERRM = 'signup_consent_required_ack_missing';
            END;
            IF NOT invalid_revision OR NOT missing_ack THEN
              RAISE EXCEPTION 'invalid revision or missing ack did not fail closed';
            END IF;
          END $$;
          RESET ROLE;

          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM public.users
                       WHERE id = '01490000-0000-0000-0000-000000000005') THEN
              RAISE EXCEPTION 'invalid RPC input created a profile';
            END IF;
          END $$;

          -- Force the second write to fail after profile insertion. The
          -- function statement must roll the profile insert back with it.
          INSERT INTO auth.users (id, email, email_confirmed_at)
          VALUES (
            '01490000-0000-0000-0000-000000000006',
            'atomic-rollback-ci@example.invalid',
