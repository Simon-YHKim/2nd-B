          reapply_0255_over rsv_same_table "$good_table" ""
          reapply_0255_over rsv_no_default "$(broken " DEFAULT gen_random_uuid()" "")" "chat_turn_reservations has other columns"
          reapply_0255_over rsv_audit_as_text "$(broken "audit_id uuid," "audit_id text,")" "chat_turn_reservations has other columns"
          reapply_0255_over rsv_extra_column "$(broken "refunded_at timestamptz," "refunded_at timestamptz, note text,")" "chat_turn_reservations has other columns"
          reapply_0255_over rsv_round6_shape "$(broken " attempt1_audit_id uuid, attempt2_audit_id uuid," " pending_audit_id uuid,")" "chat_turn_reservations has other columns"
          reapply_0255_over rsv_round7_shape "$(broken " attempt1_audit_id uuid, attempt2_audit_id uuid, attempted_at timestamptz," " pending_audit_id uuid, attempted_at timestamptz, attempt_started_at timestamptz,")" "chat_turn_reservations has other columns"
          reapply_0255_over rsv_no_unique_answer "$(broken "CONSTRAINT chat_turn_reservations_audit_id_key UNIQUE (audit_id), " "")" "chat_turn_reservations lacks its primary key on turn_id or its unique on audit_id"
          reapply_0255_over rsv_deferrable_unique "$(broken "UNIQUE (audit_id)," "UNIQUE (audit_id) DEFERRABLE,")" "chat_turn_reservations lacks its primary key on turn_id or its unique on audit_id"
          reapply_0255_over rsv_no_cascade "$(broken " ON DELETE CASCADE" "")" "chat_turn_reservations.user_id does not follow public.users(id) with ON DELETE CASCADE"
          reapply_0255_over rsv_no_answer_check "$(broken ", CONSTRAINT chat_turn_reservations_answer_check CHECK ((state = 'counted') = (audit_id IS NULL))" "")" "chat_turn_reservations lacks its state checks"
          reapply_0255_over rsv_unlogged "$(broken "CREATE TABLE" "CREATE UNLOGGED TABLE")" "chat_turn_reservations is not a permanent table with row security on"
          reapply_0255_over rsv_generated_state "$(broken "state text NOT NULL DEFAULT 'counted'," "state text NOT NULL GENERATED ALWAYS AS ('counted'::text) STORED,")" "chat_turn_reservations has other columns"
          reapply_0255_over rsv_check_other_meaning "$(broken "CHECK ((state = 'counted') = (audit_id IS NULL))" "CHECK (state IS NOT NULL)")" "chat_turn_reservations lacks its state checks"
          reapply_0255_over rsv_deferrable_owner_link "$(broken " ON DELETE CASCADE," " ON DELETE CASCADE DEFERRABLE,")" "chat_turn_reservations.user_id does not follow public.users(id) with ON DELETE CASCADE"
          reapply_0255_over rsv_extra_check "$good_table; ALTER TABLE public.chat_turn_reservations ADD CONSTRAINT z46_extra CHECK (counted_day IS NOT NULL)" "chat_turn_reservations carries a constraint, index, trigger or rule this migration does not create"
          reapply_0255_over rsv_extra_index "$good_table; CREATE INDEX z46_extra ON public.chat_turn_reservations (counted_day)" "chat_turn_reservations carries a constraint, index, trigger or rule this migration does not create"
          reapply_0255_over rsv_extra_rule "$good_table; CREATE RULE z46_extra AS ON UPDATE TO public.chat_turn_reservations DO ALSO NOTHING" "chat_turn_reservations carries a constraint, index, trigger or rule this migration does not create"
          reapply_0255_over rsv_with_child "$good_table; CREATE TABLE public.z46_child () INHERITS (public.chat_turn_reservations)" "chat_turn_reservations is not a permanent table with row security on"
          reapply_0255_over rsv_extra_trigger "$good_table; CREATE FUNCTION public.z46_noop() RETURNS trigger LANGUAGE plpgsql AS 'BEGIN RETURN NEW; END'; CREATE TRIGGER z46_noop BEFORE UPDATE ON public.chat_turn_reservations FOR EACH ROW EXECUTE FUNCTION public.z46_noop()" "chat_turn_reservations carries a constraint, index, trigger or rule this migration does not create"
          reapply_0255_over rsv_other_lookup_index "$good_table; CREATE UNIQUE INDEX chat_turn_reservations_user_issued_idx ON public.chat_turn_reservations (user_id, issued_at)" "chat_turn_reservations carries a constraint, index, trigger or rule this migration does not create"
          reapply_0255_over rsv_include_lookup_index "$good_table; CREATE INDEX chat_turn_reservations_user_issued_idx ON public.chat_turn_reservations (user_id) INCLUDE (issued_at)" "chat_turn_reservations carries a constraint, index, trigger or rule this migration does not create"
