            END IF;
            IF has_table_privilege('authenticated', 'public.user_roles', 'INSERT') THEN
              RAISE EXCEPTION 'authenticated can INSERT into user_roles -- self-promotion path';
            END IF;
            IF has_table_privilege('anon', 'public.user_roles', 'SELECT') THEN
