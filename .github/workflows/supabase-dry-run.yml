          claim_race one_answer_two_turns row "a=true b=false answered:01:1:01,-/counted:-:1:01,-"
          claim_race two_retries_one_turn retry "a=true b=false answered:03:2:03,01/counted:-:0:-,-"
          # Two bumps at once for one user on two days (yesterday's turn, then today's): only the per-user lock
          # puts them in line, and the later one closes the earlier one, so one reservation is left open.
          bump_race two_bumps_two_days "a=1 b=1 1:0"
          # A re-ask of the old turn arrives while a new turn is being counted: it waits for the bump's per-user
          # lock and is refused once the new turn is in (only the latest turn can be re-asked).
          reask_race reask_during_bump "a=2 b=false 1:01,-"
          # A first call that started before the re-ask reaches the server after it (R2438-21): it writes nothing.
          late_begin_race late_first_attempt "a=true b=true c=true 2:02,01 answered:02"
          # A refund that arrives while a bump holds the user's turns waits on the user's lock, not on a row the bump
          # holds (R2438-22); the bump removed the old turn, so the refund then finds nothing to give back.
          lock_order_race bump_then_refund bump "b=4 r=null wait=Lock:advisory"
          # A bump that waits for today's row (held by a third session) already holds the user's lock, so a refund
          # that arrives then waits on that lock too and never takes the row the bump is waiting for.
          lock_order_race bump_waits_for_row row "a=3 b=4 r=null wait=Lock:advisory"
          # 0255 over the tables as 0252 left them, then over a ledger key that is missing, may raise at commit or
          # covers another column.
          reapply_0255_over same_ledger "" ""
          reapply_0255_over no_primary_key "ALTER TABLE public.chat_turn_refunds DROP CONSTRAINT chat_turn_refunds_pkey" "chat_turn_refunds must have a primary key on audit_id alone that is not deferrable"
