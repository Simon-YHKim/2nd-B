      # db/migrations/rollback/0189_down.sql is run by hand, mid-incident, and the
      # next `db push` is then trusted to put everything back. Nothing exercised
      # that path, and it was broken. The rollback deleted only its OWN ledger row
      # (name = 'erasure_registry'); 0190's row stayed, so the re-push re-created
      # erase_my_data from 0189 and SKIPPED the revoke in 0190. The function came
      # back with the platform default, authenticated=X, under a ledger that read
      # as fully applied (r49: two gates reproduced it separately, B-K01 and
      # B-EX-01).
      #
      # MEASURED 2026-09-20 22:26 KST, scratch PostgreSQL 18.3, THIS pinned CLI:
      #   after the old rollback a plain `supabase db push` FAILS ("Found local
      #   migration files to be inserted before the last migration on remote
      #   database") and the CLI itself suggests `--include-all`, which is also the
      #   flag this job pushes with. Following that advice re-applies 0189 alone:
      #   proacl {postgres=X,authenticated=X,service_role=X}, authenticated = t.
      #   With both rows deleted there is nothing out of order, and 0189 then 0190
      #   re-apply: {postgres=X,service_role=X}, authenticated = f.
      #
      # Both halves run, on throwaway clones of the database the step above just
      # pushed, so no later lane sees any of it. It sits HERE, not at the end,
      # because the clone is then exactly what the CLI pushed and nothing else: a
      # lane that one day commits residue cannot turn this red for a reason that
      # has nothing to do with rollback.
      #
      #   control  the pre-fix end state, rebuilt by STATE rather than by editing
      #            the file's text: run the rollback, put 0190's ledger row back,
      #            re-push. erase_my_data MUST come back executable by
      #            authenticated. If it comes back locked, this database cannot show
      #            the hole at all (no function default-privilege floor, or the CLI
      #            stopped skipping applied versions) and a green below would be
      #            the vacuous kind the floor in the first step exists to end. So
      #            the control failing to OPEN is a red, and it runs first.
      #            MEASURED 2026-09-20 on a scratch DB built without that floor:
      #            the PRE-FIX file, the one that re-opens the function on prod,
      #            reads public=f anon=f authenticated=f after the round trip.
      #            The privilege check alone cannot tell the two files apart
      #            there; the control is what says so out loud.
      #   fixed    the file as shipped: rollback, re-push. No ledger row of the
      #            pair may survive the rollback, no client role may hold EXECUTE
      #            afterwards, and everything that hangs off the two objects must
      #            equal what it was before the rollback: the ledger, the function
      #            (owner, ACL, definition, COMMENT), the registry rows, the table
      #            (owner, ACL, and its whole catalog row), its columns (defaults,
      #            ACLs, comments, and their whole catalog rows), constraints,
      #            indexes (and theirs), policies, triggers, the sequences its
      #            columns own (parameters, owner, ACL, comment, catalog row, and
      #            where each one stands), rules, statistics objects, the comments
      #            on any of those, and whatever else pg_depend hangs off either
      #            object. DROP takes all of it without a word, so a LATER
      #            migration that adds any of it and is left out of the rollback's
      #            list loses it to the round trip. That comparison is what says
      #            so, FOR WHAT IT READS: see "not collected" below.
      #   sight    ...provided it can SEE the thing. It used to make that claim
      #            while reading six facts. MEASURED 2026-09-21 00:28 KST, scratch
      #            PostgreSQL 18.3, one statement at a time inside a rolled-back
      #            transaction: the old line did not move for a new constraint,
      #            index, policy, trigger, rule or statistics object, a table or
      #            column COMMENT, a column grant, FORCE ROW LEVEL SECURITY, a
      #            column default, or a dropped NOT NULL: 12 of the 22 kinds
      #            tried (r50 artifact gate, B-NEW-01). So each kind is applied to
      #            the clone BEFORE the rollback, in a transaction that is rolled
      #            back, and the fingerprint has to move. Where an object is seen
      #            twice (by its own part and by the pg_depend net), it is asked
      #            for more: two definitions of it must give two fingerprints. One
      #            that does not is BLIND, and BLIND is a red, for the control's
      #            reason one layer down: a comparison that cannot see a loss
      #            stays green about it forever.
      #            The gate's own counter-example, ADD COLUMN, was the one kind
      #            the old line did see (its row hash is over r::text, which
      #            carries every column). It leads the list all the same: it is
      #            the statement the finding is known by.
      #
      #   need     ...and that every row the rollback deletes HAD to be deleted. Put
      #            one back, push again: if everything still comes back, that
      #            migration is on the list for no reason this database can show,
      #            and it would be re-applied mid-incident all the same. Red.
      #
      # WHAT THIS STEP SAYS, AND WHAT IT DOES NOT. This is the third round on this
      # rule (r50, r52, r55). Each round closed the hole it was shown and opened one
      # of a new kind while closing it, so in this one the CLAIM was cut down to
      # what a run actually shows, and the rest is listed instead of implied.
      #
      # It says two things about c_names, the rollback's list, and both only AS FAR
      # AS owned_state READS:
      #   enough   nothing owned_state reads is lost to rollback + re-push ("fixed");
      #   needed   no row on the list could have been left off it ("need").
      # It does NOT say that re-applying a listed migration is harmless. It used to:
      # "whether the reason is true is not decidable here; the round trip proves
      # that harmless or refuses" stood in the other half, and a remark of ten
      # characters beside an entry was what admitted it. r55's two gates ran the
      # counter-example (B-R55-N01; artifact gate, finding 2): a migration that
      # touches neither object, listed with 'xxxxxxxxxx' beside it, green on both
      # sides, re-applied, a counter in another table 1 -> 2, fingerprint identical.
      # "need" now refuses THAT entry. It cannot refuse a migration that is needed
      # and ALSO does something else: see the first line of "not collected".
      #
      # NOT COLLECTED. Known, and not a complete list: two gates each found a line
      # of it the other had not, which is the evidence that nobody has all of it.
      # MEASURED 2026-09-21 03:50 KST, scratch PostgreSQL 18.3, two definitions of
      # one thing under this exact query: "same" means a loss here is NOT seen.
      #   - any row of any table other than erasure_registry, and any object that
      #     does not hang off the two. A listed migration is re-applied WHOLE, so
      #     whatever else it does happens twice, and nothing here looks. Re-apply
      #     safety of a migration added to c_names is reviewed in the PR that adds
      #     it, against that migration's own SQL. It is not shown by this step.
      #   - a publication's row filter and its column list for the table: same. (The
      #     table JOINING a publication is seen, by the pg_depend net.)
      #   - the owner of a statistics object: same.
      #   - security labels on either object, a column or an owned sequence:
      #     pg_seclabel is not read. Not measured: no label provider is loaded on
      #     the scratch server. One is on Supabase (pgsodium).
      #   - of a sequence, only one that pg_depend hangs off the table, and of where
      #     it stands, last_value and is_called (not log_cnt).
      #   - what "need" calls needed is "differs when left out". WHY it differs is
      #     not examined.
      #
      # THE OTHER HALF IS NOT A GATE ON THE LIST, and no longer reads as one.
      # src/lib/privacy/__tests__/erasure-registry-migration.test.ts runs in `npm run
      # verify` with no database. It reads every migration from 0189 on, keeps the
      # SQL that executes (restoring run-time SQL wherever it is a constant), and
      # makes sure a PERSON HAS ACCOUNTED FOR each file that names either object, or
      # that runs SQL it cannot restore: the file is in c_names, or it is on that
      # test's list of files whose ledger row may stay. It is an early prompt,
      # before anything is pushed. It proves neither answer; this step judges the
      # list. It used to do more, in both directions. It bounded the list from
      # above (r52 bizlogic gate, B-R52-N01: it failed the author who listed what
      # this step had just told them to), then admitted entries by their remark
      # (r55, above). And its "must be listed" was binding, which the "need" half
      # cannot live with: a file can NAME the two objects and hang nothing on them
      # that re-applying the others does not already restore (the first of two
      # CREATE OR REPLACE of erase_my_data; a table called erasure_registry_audit;
      # a DO block that only reads the registry). Binding on one side and refused
      # on the other is a red with no way out, which is B-R52-N01 again.
      #
      # WHERE A CHANGE IS STILL LOST WITHOUT A RED: where nobody is prompted AND
      # owned_state does not read the fact. "Nobody is prompted" is wider than this
      # comment used to say. It named one case, "a change that goes through a
      # function defined in an earlier migration". r55's counter-example needed no
      # helper and no variable: GRANT USAGE ON SEQUENCE public.generation_counter_seq
      # is plain SQL that spells neither name, because what hangs off the two
      # objects has names of its own (a sequence, an index, a constraint). The
      # reader looks for two names; it is silent about every statement that does
      # not need them. Add to that a person's wrong "its row may stay" about a file
      # they WERE asked about. Both meet a red here only if owned_state reads what
      # was lost. That corner is stated, not closed.
      #
      # Every failure is reported before the step exits, so one run shows the whole
      # shape of a regression rather than its first symptom.
      - name: Exercise the 0189 rollback round trip
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          # The target psql already resolves in every step of this job: PGPORT and
          # PGDATABASE when set, else 5432/postgres. The host is always localhost,
          # so like the push above this reaches the job-local server and nothing
          # else. The fallbacks let the step be replayed as written against a
          # local scratch cluster on another port.
          port="${PGPORT:-5432}"
          source_db="${PGDATABASE:-postgres}"
          down="db/migrations/rollback/0189_down.sql"
          pair="erasure_registry lock_erase_my_data_authenticated service_contract_erasure_registry rss_proxy_erasure_registry credit_ledger_erasure_registry_reason reward_records_erasure_registry_reason interview_transcript_erasure_registry weather_erasure_registry dashboard_erasure_registry profile_context_import_erasure_registry chat_turn_reservations_erasure_registry chat_turn_refund_evidence_erasure_registry_reason chat_turn_purpose_restore_erasure_registry_reason"
          run_token="${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$_${RANDOM}"
          control_db="rollback_control_${run_token}"
          fixed_db="rollback_fixed_${run_token}"
          need_db="rollback_need_${run_token}"
          if [[ ! "$source_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
            echo "rollback round trip refuses unsafe source database name [$source_db]" >&2
            exit 1
          fi

          staged_project="$(mktemp -d)"
          trap 'rm -rf -- "$staged_project"' EXIT
          supabase init --workdir "$staged_project"
          mkdir -p -- "$staged_project/supabase/migrations"
          for f in db/migrations/*.sql; do
            base="${f##*/}"
            version="${base%%_*}"
            if (( 10#$version >= 147 )); then
              cp -- "$f" "$staged_project/supabase/migrations/"
            fi
          done
          # Since B-EX-02 (Simon decision 3, 2026-09-26) 0189 revokes authenticated
          # itself, so replaying 0189 without 0190 no longer opens erase_my_data and
          # the control below could never show the hole. What this lane guards is the
          # rollback's ledger discipline (0189 and 0190 are one set), not 0189's own
          # line. So the staged copy it replays is the pre-decision 0189, which left
          # authenticated to 0190. Only this lane's copy changes; the database it
          # starts from was built from the real file by the push above.
          staged_0189="$staged_project/supabase/migrations/0189_erasure_registry.sql"
          sed -i -E 's/^(REVOKE EXECUTE ON FUNCTION public\.erase_my_data\(text\) FROM PUBLIC, anon), authenticated;(\r?)$/\1;\2/' "$staged_0189"
          if [[ "$(grep -c '^REVOKE EXECUTE ON FUNCTION public.erase_my_data(text) FROM PUBLIC, anon;' "$staged_0189")" != "1" ]] \
            || grep -q '^REVOKE EXECUTE ON FUNCTION public.erase_my_data(text) FROM PUBLIC, anon, authenticated;' "$staged_0189"; then
            echo "rollback round trip cannot stage the pre-decision 0189: expected exactly one REVOKE line to lose 'authenticated'" >&2
            exit 1
          fi

          sql() { # <db> <one statement>
            psql -X -q -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -Atc "$2"
          }
          created_clones=()
          clone() { # <name>
            if [[ ! "$1" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
              echo "rollback round trip refuses unsafe clone database name [$1]" >&2
              return 1
            fi
            if [[ "$(sql "$source_db" "SELECT pg_catalog.count(*) FROM pg_catalog.pg_database WHERE datname = '$1'")" != "0" ]]; then
              echo "rollback round trip refuses to replace pre-existing database [$1]" >&2
              return 1
            fi
            sql "$source_db" "CREATE DATABASE $1 TEMPLATE $source_db"
            created_clones+=("$1")
          }
          roll_back() { # <db>
            psql -X -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -f "$down"
          }
          push_again() { # <db>  -- the same command the step above pushes with
            supabase db push \
              --db-url "postgresql://postgres:postgres@localhost:${port}/$1?sslmode=disable" \
              --workdir "$staged_project" \
              --include-all \
              --skip-vault \
              --yes
          }
          ledger_pair() { # <db>
            sql "$1" "SELECT COALESCE(pg_catalog.string_agg(m.name, ' ' ORDER BY m.version), '(none)')
                      FROM supabase_migrations.schema_migrations AS m
                      WHERE m.name IN ('erasure_registry', 'lock_erase_my_data_authenticated',
                                       'service_contract_erasure_registry', 'rss_proxy_erasure_registry',
                                       'credit_ledger_erasure_registry_reason',
                                       'reward_records_erasure_registry_reason',
                                       'interview_transcript_erasure_registry', 'weather_erasure_registry', 'dashboard_erasure_registry', 'profile_context_import_erasure_registry', 'chat_turn_reservations_erasure_registry', 'chat_turn_refund_evidence_erasure_registry_reason', 'chat_turn_purpose_restore_erasure_registry_reason')"
          }
          can_execute() { # <db> <role>
            sql "$1" "SELECT pg_catalog.has_function_privilege('$2', 'public.erase_my_data(text)', 'EXECUTE')"
          }
          # Collected state of the two objects, one fact per line, in a form
          # that survives DROP + CREATE: names and definitions, never an OID. ACLs
          # are sorted, because the order of the entries is the order of the GRANTs
          # and says nothing about who holds what. The last part is the net under
          # the named ones: whatever else pg_depend hangs off either object (a
          # view, a publication). It repeats the constraints, which hang off the
          # table too. That costs lines, and buys a net with no exclusion list to
          # go stale. Internal dependencies do stay out of it: the TOAST table is
          # one, and its name carries the OID of a table the round trip re-creates.
          #
          # WHOLE ROWS, where a row is what holds the properties. The column line
          # used to name eight of pg_attribute's columns, and a statistics target, a
          # storage mode, a compression method and the per-column options are four
          # it did not name: SET STATISTICS moved the catalog and not this
          # fingerprint (r52 artifact gate, B-NEW-01; reproduced here 2026-09-21
          # 01:59 KST, both halves green). Naming those four would leave a list with
          # a fifth missing. So the row is read WHOLE and the columns taken OUT are
          # the named ones: what a re-created table cannot keep (its OIDs, its file),
          # what the autovacuum rewrites on its own schedule (page and tuple counts,
          # the frozen-xid marks, the has-index style hints), and the ACLs, which
          # are printed sorted on the line above. The two lists fail differently.
          # One that names what to READ goes stale in silence. One that names what
          # to SKIP goes stale as a red diff that prints the key: a catalog column a
          # future server adds is compared until someone says it should not be.
          # One key to a line (`column table_name .attstattarget=1000`), so that the
          # diff names the property that moved. MEASURED 2026-09-21 02:17 KST with
          # the row printed as one JSON value: the red was right and unreadable, two
          # 500-character lines that differed in their last twenty.
          #
          # SEQUENCES, three ways, because a sequence keeps what it is in three places
          # and the first version of this part read one of them (r55, two gates, one
          # family each). pg_sequence holds the PARAMETERS. The sequence's own
          # pg_class row holds its owner and its ACL: a plain GRANT USAGE ON SEQUENCE
          # names neither of the two objects, so the other half of this rule says
          # nothing, and the round trip lost the grant with an identical fingerprint
          # (B-R55-N02). And WHERE IT STANDS is in neither catalog: last_value and
          # is_called live in the sequence relation itself. pg_sequences would not
          # do: it reports last_value as NULL until the first nextval(), so RESTART
          # WITH 42 and RESTART WITH 73 read the same (artifact gate, finding 1;
          # MEASURED: states 42:false and 73:false, one fingerprint). The relation
          # has to be read by name, so the name is quoted by format('%I.%I') and the
          # one-row SELECT goes through query_to_xml, which keeps all of this one
          # statement. log_cnt stays out: it counts WAL prefetch, not values.
          owned_state="$(cat <<'SQL'
          WITH reg AS (SELECT pg_catalog.to_regclass('public.erasure_registry') AS oid),
               fn AS (SELECT pg_catalog.to_regprocedure('public.erase_my_data(text)') AS oid),
               owned_seq AS (
                 SELECT DISTINCT sc.oid, n.nspname, sc.relname
                 FROM reg
                 JOIN pg_catalog.pg_depend AS d ON d.refclassid = 'pg_catalog.pg_class'::pg_catalog.regclass AND d.refobjid = reg.oid
                                               AND d.classid = 'pg_catalog.pg_class'::pg_catalog.regclass
                 JOIN pg_catalog.pg_class AS sc ON sc.oid = d.objid AND sc.relkind = 'S'
                 JOIN pg_catalog.pg_namespace AS n ON n.oid = sc.relnamespace)
          SELECT fact.line
          FROM (
            SELECT 1 AS part, 0 AS pos,
                   'ledger ' || pg_catalog.md5(pg_catalog.string_agg(m.version || ':' || COALESCE(m.name, ''), ',' ORDER BY m.version)) AS line
            FROM supabase_migrations.schema_migrations AS m
            UNION ALL
            SELECT 2, 0,
                   'function ' || COALESCE((
                     SELECT 'owner=' || pg_catalog.pg_get_userbyid(p.proowner)
                            || ' acl=' || CASE WHEN p.proacl IS NULL THEN '(default)'
                                              WHEN pg_catalog.cardinality(p.proacl) = 0 THEN '(empty)'
                                              ELSE (SELECT pg_catalog.string_agg(a::text, ',' ORDER BY a::text)
                                                    FROM pg_catalog.unnest(p.proacl) AS a) END
                            || ' definition=' || pg_catalog.md5(pg_catalog.pg_get_functiondef(p.oid))
                            || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(p.oid, 'pg_proc')), '(none)')
                     FROM pg_catalog.pg_proc AS p, fn
                     WHERE p.oid = fn.oid), '(absent)')
            UNION ALL
            SELECT 3, 0,
                   'table ' || COALESCE((
                     SELECT 'owner=' || pg_catalog.pg_get_userbyid(c.relowner)
                            || ' acl=' || CASE WHEN c.relacl IS NULL THEN '(default)'
                                              WHEN pg_catalog.cardinality(c.relacl) = 0 THEN '(empty)'
                                              ELSE (SELECT pg_catalog.string_agg(a::text, ',' ORDER BY a::text)
                                                    FROM pg_catalog.unnest(c.relacl) AS a) END
                            || ' rls=' || c.relrowsecurity || ' force_rls=' || c.relforcerowsecurity
                            || ' persistence=' || c.relpersistence::text || ' replica_identity=' || c.relreplident::text
                            || ' options=' || COALESCE(c.reloptions::text, '(none)')
                            || ' toast_options=' || COALESCE((SELECT t.reloptions::text FROM pg_catalog.pg_class AS t WHERE t.oid = c.reltoastrelid), '(none)')
                            || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(c.oid, 'pg_class')), '(none)')
                     FROM pg_catalog.pg_class AS c, reg
                     WHERE c.oid = reg.oid), '(absent)')
            UNION ALL
            SELECT 3, 1,
                   'table .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_class AS c ON c.oid = reg.oid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(c) - ARRAY[
              'oid', 'reltype', 'relfilenode', 'reltoastrelid', 'relrewrite',
              'relpages', 'reltuples', 'relallvisible', 'relallfrozen', 'relfrozenxid', 'relminmxid',
              'relhasindex', 'relhasrules', 'relhastriggers', 'relhassubclass',
              'relacl']) AS kv
            UNION ALL
            SELECT 4, 0,
                   'rows ' || COALESCE((SELECT pg_catalog.count(*) || ':' || pg_catalog.md5(pg_catalog.string_agg(r::text, ',' ORDER BY r.table_name))
                                        FROM public.erasure_registry AS r), '(none)')
            UNION ALL
            SELECT 5, a.attnum,
                   'column ' || pg_catalog.row_number() OVER (ORDER BY a.attnum) || ' ' || a.attname
                   || ' ' || pg_catalog.format_type(a.atttypid, a.atttypmod)
                   || ' not_null=' || a.attnotnull
                   || ' default=' || COALESCE(pg_catalog.pg_get_expr(d.adbin, d.adrelid), '(none)')
                   || ' identity=' || CASE a.attidentity WHEN '' THEN '(none)' ELSE a.attidentity::text END
                   || ' generated=' || CASE a.attgenerated WHEN '' THEN '(none)' ELSE a.attgenerated::text END
                   || ' collation=' || a.attcollation::pg_catalog.regcollation::text
                   || ' acl=' || CASE WHEN a.attacl IS NULL THEN '(default)'
                                      WHEN pg_catalog.cardinality(a.attacl) = 0 THEN '(empty)'
                                      ELSE (SELECT pg_catalog.string_agg(x::text, ',' ORDER BY x::text)
                                            FROM pg_catalog.unnest(a.attacl) AS x) END
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.col_description(a.attrelid, a.attnum)), '(none)')
            FROM reg
            JOIN pg_catalog.pg_attribute AS a ON a.attrelid = reg.oid AND a.attnum > 0 AND NOT a.attisdropped
            LEFT JOIN pg_catalog.pg_attrdef AS d ON d.adrelid = a.attrelid AND d.adnum = a.attnum
            UNION ALL
            SELECT 5, a.attnum,
                   'column ' || a.attname || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_attribute AS a ON a.attrelid = reg.oid AND a.attnum > 0 AND NOT a.attisdropped
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(a) - ARRAY['attrelid', 'attnum', 'attacl']) AS kv
            UNION ALL
            SELECT 6, 0,
                   'constraint ' || k.conname || ' ' || pg_catalog.pg_get_constraintdef(k.oid)
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(k.oid, 'pg_constraint')), '(none)')
            FROM reg
            JOIN pg_catalog.pg_constraint AS k ON k.conrelid = reg.oid
            UNION ALL
            SELECT 7, 0,
                   'index ' || pg_catalog.pg_get_indexdef(i.indexrelid) || ' valid=' || i.indisvalid
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(i.indexrelid, 'pg_class')), '(none)')
            FROM reg
            JOIN pg_catalog.pg_index AS i ON i.indrelid = reg.oid
            UNION ALL
            SELECT 7, 1,
                   'index ' || x.relname || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_index AS i ON i.indrelid = reg.oid
            JOIN pg_catalog.pg_class AS x ON x.oid = i.indexrelid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(i) - ARRAY[
              'indexrelid', 'indrelid', 'indcheckxmin',
              'indkey', 'indcollation', 'indclass', 'indoption', 'indexprs', 'indpred']) AS kv
            UNION ALL
            SELECT 7, 2,
                   'index ' || x.relname || ' column ' || ia.attnum || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM reg
            JOIN pg_catalog.pg_index AS i ON i.indrelid = reg.oid
            JOIN pg_catalog.pg_class AS x ON x.oid = i.indexrelid
            JOIN pg_catalog.pg_attribute AS ia ON ia.attrelid = i.indexrelid AND ia.attnum > 0
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(ia) - ARRAY['attrelid', 'attnum', 'attacl']) AS kv
            UNION ALL
            SELECT 8, 0,
                   'policy ' || p.polname || ' command=' || p.polcmd::text || ' permissive=' || p.polpermissive
                   || ' roles=' || COALESCE((SELECT pg_catalog.string_agg(named.role_name, ',' ORDER BY named.role_name)
                                             FROM (SELECT CASE WHEN member = 0 THEN 'public' ELSE pg_catalog.pg_get_userbyid(member) END AS role_name
                                                   FROM pg_catalog.unnest(p.polroles) AS member) AS named), '(none)')
                   || ' using=' || COALESCE(pg_catalog.pg_get_expr(p.polqual, p.polrelid), '(none)')
                   || ' check=' || COALESCE(pg_catalog.pg_get_expr(p.polwithcheck, p.polrelid), '(none)')
            FROM reg
            JOIN pg_catalog.pg_policy AS p ON p.polrelid = reg.oid
            UNION ALL
            SELECT 9, 0,
                   'trigger ' || pg_catalog.pg_get_triggerdef(t.oid) || ' enabled=' || t.tgenabled::text
            FROM reg
            JOIN pg_catalog.pg_trigger AS t ON t.tgrelid = reg.oid AND NOT t.tgisinternal
            UNION ALL
            SELECT 9, 1,
                   'sequence ' || sc.nspname || '.' || sc.relname || ' .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM owned_seq AS sc
            JOIN pg_catalog.pg_sequence AS s ON s.seqrelid = sc.oid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(s) - ARRAY['seqrelid']) AS kv
            UNION ALL
            SELECT 9, 2,
                   'sequence ' || sc.nspname || '.' || sc.relname
                   || ' owner=' || pg_catalog.pg_get_userbyid(c.relowner)
                   || ' acl=' || CASE WHEN c.relacl IS NULL THEN '(default)'
                                      WHEN pg_catalog.cardinality(c.relacl) = 0 THEN '(empty)'
                                      ELSE (SELECT pg_catalog.string_agg(a::text, ',' ORDER BY a::text)
                                            FROM pg_catalog.unnest(c.relacl) AS a) END
                   || ' comment=' || COALESCE(pg_catalog.md5(pg_catalog.obj_description(c.oid, 'pg_class')), '(none)')
            FROM owned_seq AS sc
            JOIN pg_catalog.pg_class AS c ON c.oid = sc.oid
            UNION ALL
            SELECT 9, 3,
                   'sequence ' || sc.nspname || '.' || sc.relname || ' relation .' || kv.key || '=' || COALESCE(kv.value, '(null)')
            FROM owned_seq AS sc
            JOIN pg_catalog.pg_class AS c ON c.oid = sc.oid
            CROSS JOIN LATERAL pg_catalog.jsonb_each_text(pg_catalog.to_jsonb(c) - ARRAY[
              'oid', 'reltype', 'relfilenode', 'reltoastrelid', 'relrewrite',
              'relpages', 'reltuples', 'relallvisible', 'relallfrozen', 'relfrozenxid', 'relminmxid',
              'relhasindex', 'relhasrules', 'relhastriggers', 'relhassubclass',
              'relacl']) AS kv
            UNION ALL
            SELECT 9, 4,
                   'sequence ' || sc.nspname || '.' || sc.relname || ' stands at .' || slot.key || '='
                   || COALESCE(pg_catalog.substring(standing.one_row, '<' || slot.key || '>([^<]*)</' || slot.key || '>'), '(unread)')
            FROM owned_seq AS sc
            CROSS JOIN LATERAL (
              SELECT pg_catalog.query_to_xml(
                       pg_catalog.format('SELECT last_value, is_called FROM %I.%I', sc.nspname, sc.relname),
                       false, true, '')::text AS one_row) AS standing
            CROSS JOIN (VALUES ('last_value'), ('is_called')) AS slot(key)
            UNION ALL
            SELECT 10, 0,
                   'rule ' || pg_catalog.pg_get_ruledef(r.oid) || ' enabled=' || r.ev_enabled::text
            FROM reg
            JOIN pg_catalog.pg_rewrite AS r ON r.ev_class = reg.oid
            UNION ALL
            SELECT 11, 0,
                   'statistics ' || pg_catalog.pg_get_statisticsobjdef(s.oid)
                   || ' target=' || COALESCE(s.stxstattarget::text, '(default)')
            FROM reg
            JOIN pg_catalog.pg_statistic_ext AS s ON s.stxrelid = reg.oid
            UNION ALL
            SELECT DISTINCT 12, 0,
                   'comment_on ' || pg_catalog.pg_describe_object(d.classid, d.objid, d.objsubid)
                   || ' ' || pg_catalog.md5(described.description)
            FROM pg_catalog.pg_depend AS d
            JOIN pg_catalog.pg_description AS described
              ON described.classoid = d.classid AND described.objoid = d.objid AND described.objsubid = d.objsubid,
                 reg, fn
            WHERE d.deptype <> 'i'
              AND ((d.refclassid = 'pg_catalog.pg_class'::pg_catalog.regclass AND d.refobjid = reg.oid)
                   OR (d.refclassid = 'pg_catalog.pg_proc'::pg_catalog.regclass AND d.refobjid = fn.oid))
            UNION ALL
            SELECT DISTINCT 13, 0,
                   'hangs_off ' || pg_catalog.pg_describe_object(d.classid, d.objid, d.objsubid)
            FROM pg_catalog.pg_depend AS d, reg, fn
            WHERE d.deptype <> 'i'
              AND ((d.refclassid = 'pg_catalog.pg_class'::pg_catalog.regclass AND d.refobjid = reg.oid)
                   OR (d.refclassid = 'pg_catalog.pg_proc'::pg_catalog.regclass AND d.refobjid = fn.oid))
          ) AS fact
          WHERE fact.line IS NOT NULL
          ORDER BY fact.part, fact.pos, fact.line
          SQL
          )"
          fingerprint() { # <db>
            sql "$1" "$owned_state"
          }

          failed=0
          fail() {
            echo "rollback round trip FAILED: $*" >&2
            failed=1
          }

          # Execute the exact NULL/empty distinction against the job's PostgreSQL,
          # rather than letting a text assertion stand in for ACL semantics.
          acl_sentinels="$(sql "$source_db" "SELECT pg_catalog.string_agg(
            CASE WHEN fixture.acl IS NULL THEN '(default)'
                 WHEN pg_catalog.cardinality(fixture.acl) = 0 THEN '(empty)'
                 ELSE '(entries)'
            END,
            '|' ORDER BY fixture.ord)
          FROM (VALUES
            (1, NULL::pg_catalog.aclitem[]),
            (2, ARRAY[]::pg_catalog.aclitem[])
          ) AS fixture(ord, acl)")"
          if [[ "$acl_sentinels" != "(default)|(empty)" ]]; then
            echo "rollback round trip cannot start: ACL default/empty fixture collapsed to [$acl_sentinels]" >&2
            exit 1
          fi
          echo "ACL sentinel fixture: default and explicit empty remain distinct"

          # The shipped state this lane starts from. Without it there is nothing to
          # come back TO, so stop rather than compare against a wrong baseline.
          if [[ "$(ledger_pair "$source_db")" != "$pair" ]]; then
            echo "rollback round trip cannot start: expected the ledger rows [$pair] after the push, found [$(ledger_pair "$source_db")]" >&2
            exit 1
          fi
          for role in public anon authenticated; do
            if [[ "$(can_execute "$source_db" "$role")" != "f" ]]; then
              echo "rollback round trip cannot start: $role already holds EXECUTE on erase_my_data before any rollback" >&2
              exit 1
            fi
          done

          # The registry forwards (0198, 0201, 0226, 0233, 0237, 0240, 0258) and the reason revisions (0205, 0212, 0268, 0269) are kept
          # with 0190: each one's guard refuses to run while erase_my_data is open, so
          # re-applying them here would stop the push before the control can look.
          echo "== control: retain 0190 and every registry forward, then replay only 0189"
          clone "$control_db"
          sql "$control_db" "CREATE TABLE supabase_migrations.rollback_probe_kept AS
                             SELECT * FROM supabase_migrations.schema_migrations
                             WHERE name IN ('lock_erase_my_data_authenticated',
                                            'service_contract_erasure_registry',
                                            'rss_proxy_erasure_registry',
                                            'credit_ledger_erasure_registry_reason',
                                            'reward_records_erasure_registry_reason',
                                            'interview_transcript_erasure_registry', 'weather_erasure_registry', 'dashboard_erasure_registry', 'profile_context_import_erasure_registry', 'chat_turn_reservations_erasure_registry', 'chat_turn_refund_evidence_erasure_registry_reason', 'chat_turn_purpose_restore_erasure_registry_reason')"
          roll_back "$control_db"
          # ON CONFLICT: if the rollback under test leaves the row in place (the very
          # regression this lane is for), the control still builds the same state
          # and the verdict comes from the "fixed" half, with a message that says so.
          sql "$control_db" "INSERT INTO supabase_migrations.schema_migrations
                             SELECT * FROM supabase_migrations.rollback_probe_kept
                             ON CONFLICT (version) DO NOTHING"
          sql "$control_db" "DROP TABLE supabase_migrations.rollback_probe_kept"
          control_ledger="$(ledger_pair "$control_db")"
          push_again "$control_db"
          control_open="$(can_execute "$control_db" authenticated)"
          echo "control: ledger before the re-push [$control_ledger] -> authenticated EXECUTE after it = $control_open"
          if [[ "$control_ledger" != "lock_erase_my_data_authenticated service_contract_erasure_registry rss_proxy_erasure_registry credit_ledger_erasure_registry_reason reward_records_erasure_registry_reason interview_transcript_erasure_registry weather_erasure_registry dashboard_erasure_registry profile_context_import_erasure_registry chat_turn_reservations_erasure_registry chat_turn_refund_evidence_erasure_registry_reason chat_turn_purpose_restore_erasure_registry_reason" ]]; then
            fail "the control did not reach the pre-fix state: ledger held [$control_ledger], expected 0190 and every registry forward"
          fi
          if [[ "$control_open" != "t" ]]; then
            fail "VACUOUS. With 0190's ledger row left behind, erase_my_data should come back executable by authenticated, and it did not (authenticated EXECUTE = $control_open). This database cannot show the hole, so the verdict below proves nothing. Either the function default-privilege floor is missing (see \"Seed Supabase compatibility layer\") or the CLI no longer skips an applied version."
          fi

          echo "== fixed: $down as shipped"
          clone "$fixed_db"
          before="$(fingerprint "$fixed_db")"
          echo "fixed: what hangs off erase_my_data and erasure_registry before the rollback"
          sed 's/^/  /' <<< "$before"

          echo "== sight: can that list see what a later migration would hang there?"
          probed() { # <one statement>  -- the fingerprint with it applied, then rolled back
            psql -X -q -h localhost -U postgres -d "$fixed_db" -v ON_ERROR_STOP=1 -At \
              -c 'BEGIN' -c "$1" -c "$owned_state" -c 'ROLLBACK'
          }
          sees() { # <what> <one statement a later migration could run>
            local moved
            if ! moved="$(probed "$2")"; then
              fail "the sight probe for $1 could not run: $2"
            elif [[ "$moved" == "$before" ]]; then
              fail "BLIND to $1. The fingerprint did not move when this ran: $2. A later migration that does the same and is left out of the list in $down loses it to the rollback's DROP, and the comparison below stays green about it. Add the fact to owned_state."
            else
              echo "sight: sees $1"
            fi
          }
          # MEASURED 2026-09-21 00:48 KST: with the whole policy part cut out of
          # owned_state, sees "a policy" still passed. Creating an object moves
          # TWO parts, its own and the pg_depend net at the end, so the net alone
          # kept the probe green while nothing read the policy's USING clause any
          # more. (A new column is seen twice the same way: by its own line and by
          # the row hash, which is over r::text.) What only the named part can do
          # is tell two DEFINITIONS of one object apart, so that is what it is
          # asked: the same name, defined two ways, must give two fingerprints.
          tells_apart() { # <what> <one statement> <the same object, defined differently>
            local one other
            if ! one="$(probed "$2")" || ! other="$(probed "$3")"; then
              fail "the sight probe for $1 could not run: $2 / $3"
            elif [[ "$one" == "$before" || "$one" == "$other" ]]; then
              fail "BLIND to the definition of $1. These two give the same fingerprint: [$2] and [$3]. A later migration that re-defines it and is left out of the list in $down loses the new definition to the rollback's DROP, and the comparison below stays green about it. Put the definition back into owned_state."
            else
              echo "sight: tells apart two definitions of $1"
            fi
          }
          # A probe has to move the fingerprint on TODAY's schema and on next year's, so
          # none of them may be something a real migration would do. MEASURED 2026-09-21
          # 00:39 KST: the first column probe was the gate's statement verbatim (ADD COLUMN
          # deletion_generation), and the run that mattered most went red on it. A 0191
          # that really adds that column, correctly listed in the rollback, met "column
          # already exists". Hence one reserved name (rollback_probe), grants that go to
          # anon (authenticated is who S3-C / S3-D will open the RPC to, and a GRANT that
          # is already there moves nothing), and values no one would choose.
          tells_apart "a column" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint NOT NULL DEFAULT 0" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe integer NOT NULL DEFAULT 0"
          tells_apart "a constraint" \
            "ALTER TABLE public.erasure_registry ADD CONSTRAINT rollback_probe CHECK (table_name <> '')" \
            "ALTER TABLE public.erasure_registry ADD CONSTRAINT rollback_probe CHECK (table_name <> 'rollback probe')"
          tells_apart "an index" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name)" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name) WHERE table_name <> ''"
          tells_apart "a policy" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (false)" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (true)"
          tells_apart "a trigger" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger()" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW WHEN (OLD.table_name <> '') EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger()"
          tells_apart "a rule" \
            "CREATE RULE rollback_probe AS ON DELETE TO public.erasure_registry DO INSTEAD NOTHING" \
            "CREATE RULE rollback_probe AS ON DELETE TO public.erasure_registry DO ALSO NOTHING"
          tells_apart "a statistics object" \
            "CREATE STATISTICS public.rollback_probe ON (pg_catalog.length(table_name)) FROM public.erasure_registry" \
            "CREATE STATISTICS public.rollback_probe ON (pg_catalog.upper(table_name)) FROM public.erasure_registry"
          # The same object twice, the second time with one more statement after it:
          # the property is what has to tell the two apart, not the object's arrival.
          tells_apart "a trigger that is switched off" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger()" \
            "CREATE TRIGGER rollback_probe BEFORE UPDATE ON public.erasure_registry FOR EACH ROW EXECUTE FUNCTION pg_catalog.suppress_redundant_updates_trigger(); ALTER TABLE public.erasure_registry DISABLE TRIGGER rollback_probe"
          tells_apart "the index the table is clustered on" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name)" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (table_name); ALTER TABLE public.erasure_registry CLUSTER ON rollback_probe"
          tells_apart "an index column's statistics target" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (pg_catalog.lower(table_name))" \
            "CREATE INDEX rollback_probe ON public.erasure_registry (pg_catalog.lower(table_name)); ALTER INDEX public.rollback_probe ALTER COLUMN 1 SET STATISTICS 9189"
          # An identity column's sequence hangs off the table INTERNALLY, which is the
          # one kind of dependency the net at the end leaves out (it has to: the TOAST
          # table is internal too, and is named after an OID). MEASURED 2026-09-21
          # 02:29 KST: SET INCREMENT BY moved pg_sequence and nothing here. The
          # generation counter S3-C / S3-D will add is the column this is about.
          #
          # Three probes, one for each place a sequence keeps what it is (see the
          # note above owned_state). The first used to stand for all three and only
          # bites on the parameters. r55's two gates found the other two from
          # opposite ends: where it STANDS (42 against 73: both leave pg_sequence
          # untouched and both read NULL in pg_sequences, so nothing short of the
          # relation's own row tells them apart) and who may USE it.
          tells_apart "the parameters of the sequence behind a column" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY; ALTER TABLE public.erasure_registry ALTER COLUMN rollback_probe SET INCREMENT BY 7"
          tells_apart "where the sequence behind a column stands" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY; ALTER TABLE public.erasure_registry ALTER COLUMN rollback_probe RESTART WITH 42" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY; ALTER TABLE public.erasure_registry ALTER COLUMN rollback_probe RESTART WITH 73"
          tells_apart "a grant on the sequence behind a column" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY (SEQUENCE NAME public.rollback_probe_seq)" \
            "ALTER TABLE public.erasure_registry ADD COLUMN rollback_probe bigint GENERATED BY DEFAULT AS IDENTITY (SEQUENCE NAME public.rollback_probe_seq); GRANT USAGE ON SEQUENCE public.rollback_probe_seq TO anon"
          tells_apart "a comment on something that hangs off the table" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (false); COMMENT ON POLICY rollback_probe ON public.erasure_registry IS 'rollback probe'" \
            "CREATE POLICY rollback_probe ON public.erasure_registry FOR SELECT TO anon USING (false); COMMENT ON POLICY rollback_probe ON public.erasure_registry IS 'another rollback probe'"
          # r52 artifact gate, B-NEW-01: the four column facts nobody collected. The
          # first is the gate's statement. A property with one slot cannot be probed
          # under a reserved NAME, so it gets a value no migration would choose, or
          # (two of them have only a handful of values) whichever value it does not
          # hold now: a probe that sets what is already set moves nothing and would
          # read as BLIND on the day a real migration picks the same one.
          sees "a column's statistics target" "ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET STATISTICS 9189"
          sees "a column's storage mode" "DO \$flip\$ BEGIN IF (SELECT a.attstorage FROM pg_catalog.pg_attribute AS a WHERE a.attrelid = pg_catalog.to_regclass('public.erasure_registry') AND a.attname = 'table_name') = 'e' THEN ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET STORAGE MAIN; ELSE ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET STORAGE EXTERNAL; END IF; END \$flip\$"
          sees "a column's compression method" "DO \$flip\$ BEGIN IF (SELECT a.attcompression FROM pg_catalog.pg_attribute AS a WHERE a.attrelid = pg_catalog.to_regclass('public.erasure_registry') AND a.attname = 'table_name') = 'p' THEN ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET COMPRESSION default; ELSE ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET COMPRESSION pglz; END IF; END \$flip\$"
          sees "a column's options" "ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET (n_distinct = -0.190189)"
          # ...and one that nobody named at all, in the gate's list or this one. It is
          # here to show what reading the whole row buys: inheritance is recorded on
          # the COLUMN (attislocal, attinhcount), and no line of this query says so.
          sees "a column the table now inherits" "CREATE TABLE public.rollback_probe_parent (table_name text); ALTER TABLE public.erasure_registry INHERIT public.rollback_probe_parent"
          sees "the table's storage parameters" "ALTER TABLE public.erasure_registry SET (autovacuum_analyze_threshold = 190189)"
          sees "the TOAST table's storage parameters" "ALTER TABLE public.erasure_registry SET (toast.autovacuum_vacuum_threshold = 190189)"
          sees "the table's owner" "ALTER TABLE public.erasure_registry OWNER TO anon"
          sees "the table's comment" "COMMENT ON TABLE public.erasure_registry IS 'rollback probe'"
          sees "a column's comment" "COMMENT ON COLUMN public.erasure_registry.table_name IS 'rollback probe'"
          sees "a table grant" "GRANT TRUNCATE ON public.erasure_registry TO anon"
          sees "a column grant" "GRANT REFERENCES (table_name) ON public.erasure_registry TO anon"
          sees "row security switched off" "ALTER TABLE public.erasure_registry DISABLE ROW LEVEL SECURITY"
          sees "row security forced, or unforced" "DO \$flip\$ BEGIN IF (SELECT c.relforcerowsecurity FROM pg_catalog.pg_class AS c WHERE c.oid = pg_catalog.to_regclass('public.erasure_registry')) THEN ALTER TABLE public.erasure_registry NO FORCE ROW LEVEL SECURITY; ELSE ALTER TABLE public.erasure_registry FORCE ROW LEVEL SECURITY; END IF; END \$flip\$"
          sees "a column default" "ALTER TABLE public.erasure_registry ALTER COLUMN table_name SET DEFAULT 'rollback probe'"
          sees "a dropped NOT NULL" "ALTER TABLE public.erasure_registry ALTER COLUMN reason DROP NOT NULL"
          sees "the registry rows" "DELETE FROM public.erasure_registry"
          sees "the function's owner" "ALTER FUNCTION public.erase_my_data(text) OWNER TO anon"
          sees "the function's settings" "ALTER FUNCTION public.erase_my_data(text) SET statement_timeout = '190189ms'"
          sees "a function grant" "GRANT EXECUTE ON FUNCTION public.erase_my_data(text) TO anon"
          sees "the function's comment" "COMMENT ON FUNCTION public.erase_my_data(text) IS 'rollback probe'"
          sees "a ledger row" "UPDATE supabase_migrations.schema_migrations SET name = name || '_probe' WHERE name = 'lock_erase_my_data_authenticated'"
          if [[ "$(fingerprint "$fixed_db")" != "$before" ]]; then
            fail "the sight probes left something behind. Each one runs inside a transaction that is rolled back, and the fingerprint no longer equals the one taken before them, so the comparison below starts from a state no migration produced."
          fi

          ledger_names() { # <db>  -- one line, so it reads the same through a CRLF psql
            sql "$1" "SELECT COALESCE(pg_catalog.string_agg(m.name, ' ' ORDER BY m.version), '')
                      FROM supabase_migrations.schema_migrations AS m"
          }
          ledger_before_rollback="$(ledger_names "$fixed_db")"
          roll_back "$fixed_db"
          after_rollback="$(ledger_pair "$fixed_db")"
          if [[ "$after_rollback" != "(none)" ]]; then
            fail "$down left [$after_rollback] in the migration ledger. 0189 and 0190 are one set: the DROP FUNCTION takes 0190's revoke with it, so a surviving 0190 row makes the next push skip the revoke and re-create erase_my_data open to authenticated."
          fi
          # What the shipped file DID to this ledger, not what its text says: the rows
          # that were there before it ran and are not there now. The "need" half
          # below asks its question of each of them.
          ledger_after_rollback=" $(ledger_names "$fixed_db") "
          deleted_by_the_rollback=""
          for name in $ledger_before_rollback; do
            if [[ "$ledger_after_rollback" != *" $name "* ]]; then
              deleted_by_the_rollback+="$name "
            fi
          done
          push_again "$fixed_db"
          after="$(fingerprint "$fixed_db")"
          verdict=""
          for role in public anon authenticated; do
            held="$(can_execute "$fixed_db" "$role")"
            verdict+="$role=$held "
            if [[ "$held" != "f" ]]; then
              fail "after rollback + re-push, $role can EXECUTE erase_my_data. It ships locked until a per-user delete fence exists (0190), and a rollback must not be the way it opens."
            fi
          done
          echo "fixed: ledger after the rollback [$after_rollback] -> EXECUTE after the re-push: $verdict"
          if [[ "$before" != "$after" ]]; then
            fail "rollback + re-push did not restore what hangs off erase_my_data and erasure_registry ('<' is before the rollback, '>' is after the re-push). A migration that alters either object loses its effect to the rollback's DROP, so its ledger row has to go too. In the same PR, add its ledger name to c_names in $down. By that file's convention an entry sits on its own line with the file's number and what it hangs there beside it:   'its_ledger_name',  -- NNNN: what it hangs on the two objects   That remark is for whoever runs the file by hand. It is documentation and nothing reads it as evidence: what admits an entry is this comparison going green with it, and the 'need' half below staying green."
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") | sed 's/^/  /' >&2 || true
          else
            echo "fixed: after the re-push, all $(wc -l <<< "$before" | tr -d ' ') facts are what they were"
          fi

          echo "== need: is every ledger row the rollback deletes one the re-push needs gone?"
          # The comparison above holds the list to a LOWER bound: leave out a row that
          # had to go and something does not come back. Nothing held it to an upper
          # one. A remark beside each entry was meant to (its file's number and ten
          # characters of reason, read by npm run verify), and r55's two gates showed
          # what that is worth: a migration that touches neither object, listed with
          # 'xxxxxxxxxx' beside it, passed both halves, was re-applied by the push
          # that follows a rollback, and took a counter in another table from 1 to 2
          # under an identical fingerprint (B-R55-N01; artifact gate, finding 2). A
          # sentence is not evidence. So each row the rollback deleted is asked the
          # only question a database can answer about it: put THAT ONE ROW back, as
          # if it had been left off the list, and push again. If everything
          # owned_state reads still comes back, nothing visible here needs that
          # migration re-applied, and it is on the list for no reason this step can
          # check: red. A push failure is evidence only when it is one of the exact
          # causal failures listed in needs(): 0190/42883 from retaining 0189's row,
          # 0198/P0001 from retaining 0190's, and 0212/P0001 from retaining 0198's or
          # 0205's (0212 finds the registry row those two write outside its recorded
          # state). Every other failure is inconclusive and red; the causal case must
          # recover after that one row is removed before the gate may call it necessary.
          #
          # This is the control's move, for every row instead of 0190's alone. The
          # control stays because it asks for more than "differs": it demands the
          # SPECIFIC difference that is the hole (authenticated = t), and says
          # VACUOUS when this database cannot show it.
          #
          # What "needed" does NOT say: that re-applying is HARMLESS. A needed
          # migration is re-applied whole, and whatever else it does, to any table
          # that is not erasure_registry, happens twice. See "not collected" above.
          need_index=0
          needs() { # <ledger name>
            local case_db push_log push_rc state causal_failure
            if [[ ! "$1" =~ ^[A-Za-z0-9_]+$ ]]; then
              fail "cannot ask whether [$1] is needed: the name goes into SQL text here, so only letters, digits and _ are taken."
              return
            fi
            need_index=$((need_index + 1))
            case_db="${need_db}_${need_index}"
            clone "$case_db"
            sql "$case_db" "CREATE TABLE supabase_migrations.rollback_probe_kept AS
                            SELECT * FROM supabase_migrations.schema_migrations
                            WHERE name = '$1'"
            roll_back "$case_db"
            sql "$case_db" "INSERT INTO supabase_migrations.schema_migrations
                            SELECT * FROM supabase_migrations.rollback_probe_kept
                            ON CONFLICT (version) DO NOTHING"
            sql "$case_db" "DROP TABLE supabase_migrations.rollback_probe_kept"
            echo "need: '$1' left in the ledger, everything else as the rollback leaves it."
            push_log="$staged_project/need-$1.log"
            if push_again "$case_db" >"$push_log" 2>&1; then
              push_rc=0
            else
              push_rc=$?
            fi
            cat "$push_log"

            if (( push_rc != 0 )); then
              causal_failure=""
              if [[ "$1" == "erasure_registry" ]] \
                && grep -Fq "Applying migration 0190_lock_erase_my_data_authenticated.sql" "$push_log" \
                && grep -Fq "function public.erase_my_data(text) does not exist" "$push_log" \
                && grep -Fq "SQLSTATE 42883" "$push_log"; then
                causal_failure="0190/42883 missing function"
              elif [[ "$1" == "lock_erase_my_data_authenticated" ]] \
                && grep -Fq "Applying migration 0198_service_contract_erasure_registry.sql" "$push_log" \
                && grep -Fq "erasure_additions_rpc_must_remain_locked" "$push_log" \
                && grep -Fq "SQLSTATE P0001" "$push_log"; then
                causal_failure="0198/P0001 unlocked function"
              # 0212 restates reasons on rows 0198 adds (reward_ssv_issue_rate_limits)
              # and 0205 rewrote (credit_ledger). Retaining either row skips its
              # migration, so 0212 meets a row outside its recorded state and stops.
              elif [[ "$1" == "service_contract_erasure_registry" ]] \
                && grep -Fq "Applying migration 0212_reward_records_erasure_registry_reason.sql" "$push_log" \
                && grep -Fq "erasure_revisions_row_not_in_recorded_state: reward_ssv_issue_rate_limits" "$push_log" \
                && grep -Fq "SQLSTATE P0001" "$push_log"; then
                causal_failure="0212/P0001 registry row 0198 adds"
              elif [[ "$1" == "credit_ledger_erasure_registry_reason" ]] \
                && grep -Fq "Applying migration 0212_reward_records_erasure_registry_reason.sql" "$push_log" \
                && grep -Fq "erasure_revisions_row_not_in_recorded_state: credit_ledger" "$push_log" \
                && grep -Fq "SQLSTATE P0001" "$push_log"; then
                causal_failure="0212/P0001 credit_ledger reason 0205 writes"
              elif [[ "$1" == "chat_turn_reservations_erasure_registry" ]] \
                && grep -Fq "Applying migration 0268_chat_turn_refund_evidence_erasure_registry_reason.sql" "$push_log" \
                && grep -Fq "erasure_revisions_row_not_in_recorded_state: chat_turn_reservations" "$push_log" \
                && grep -Fq "SQLSTATE P0001" "$push_log"; then
                causal_failure="0268/P0001 registry row 0258 adds"
              elif [[ "$1" == "chat_turn_refund_evidence_erasure_registry_reason" ]] \
                && grep -Fq "Applying migration 0269_chat_turn_purpose_restore_erasure_registry_reason.sql" "$push_log" \
                && grep -Fq "erasure_revisions_row_not_in_recorded_state: chat_turn_reservations" "$push_log" \
                && grep -Fq "SQLSTATE P0001" "$push_log"; then
                causal_failure="0269/P0001 reservation reason 0268 writes"
              fi
              if [[ -z "$causal_failure" ]]; then
                fail "INCONCLUSIVE necessity check: '$1' re-push exited $push_rc without a reviewed causal SQL failure. Infrastructure, CLI, authentication, timeout, and unrelated SQL failures are never evidence that a ledger row belongs in c_names."
                return
              fi

              echo "need: '$1' produced the expected $causal_failure; remove only that retained row and require recovery."
              sql "$case_db" "DELETE FROM supabase_migrations.schema_migrations
                              WHERE name = '$1'"
              if ! push_again "$case_db"; then
                fail "CAUSALITY recovery failed: '$1' had the expected $causal_failure, but deleting only its retained ledger row did not make the re-push succeed."
                return
              fi
              if [[ "$(sql "$case_db" "SELECT pg_catalog.to_regclass('public.erasure_registry') IS NOT NULL
                                             AND pg_catalog.to_regprocedure('public.erase_my_data(text)') IS NOT NULL")" == "t" ]]; then
                state="$(fingerprint "$case_db")"
              else
                state="(erase_my_data or erasure_registry is absent after causal recovery)"
              fi
              if [[ "$state" != "$before" ]]; then
                fail "CAUSALITY recovery mismatch: deleting '$1' repaired the expected push failure, but the recovered state still differs from the pre-rollback fingerprint."
                diff <(printf '%s\n' "$before") <(printf '%s\n' "$state") | sed 's/^/  /' | head -n 6 || true
              else
                echo "need: '$1' is causally necessary: its retained row produced the exact failure and removing it restored all collected state."
              fi
              return
            fi

            if [[ "$(sql "$case_db" "SELECT pg_catalog.to_regclass('public.erasure_registry') IS NOT NULL
                                           AND pg_catalog.to_regprocedure('public.erase_my_data(text)') IS NOT NULL")" == "t" ]]; then
              state="$(fingerprint "$case_db")"
            else
              state="(erase_my_data or erasure_registry is absent)"
            fi
            if [[ "$state" == "$before" ]]; then
              fail "UNNEEDED in c_names: '$1'. $down deletes its ledger row, so the push that follows a rollback applies that migration a second time, mid-incident. With that one row LEFT IN PLACE, the re-push ran and all $(wc -l <<< "$before" | tr -d ' ') facts about erase_my_data and erasure_registry still came back, so nothing this step can see needs it re-applied. Either (a) it hangs nothing on the two objects: take it out of c_names, whatever the remark beside it says; or (b) it does, and owned_state is BLIND to what it hangs there: add that fact to owned_state with a sight probe, and this goes green with the entry in place. Do not settle (b) by removing the entry: the thing it hangs there is then lost to the next rollback, in silence."
            else
              echo "need: '$1' has to go. With its row left in place, the re-push ran and this did not come back:"
              diff <(printf '%s\n' "$before") <(printf '%s\n' "$state") | sed 's/^/  /' | head -n 6 || true
            fi
          }
          if [[ -z "$deleted_by_the_rollback" ]]; then
            fail "$down deleted no ledger row at all, so there was nothing to ask the necessity question of."
          fi
          for name in $deleted_by_the_rollback; do
            needs "$name"
          done

          # ON FAILURE THE RUN-UNIQUE CLONES ARE LEFT WHERE THEY ARE, on purpose.
          # The EXIT trap above removes the staging directory and nothing else. In
          # CI a clone lives in the job's own service container and disappears with
          # it. In a local replay the unique clone is the evidence; no later run
          # guesses that it owns the database or deletes it pre-emptively.
          if (( failed )); then
            exit 1
          fi
          for clone_db in "${created_clones[@]}"; do
            sql "$source_db" "DROP DATABASE $clone_db"
          done
          echo "rollback round trip: the control re-opened, the shipped rollback did not, the state came back identical, and every row the rollback deletes (${deleted_by_the_rollback% }) had to go"
      - name: Reject account-deletion policies when Storage RLS is disabled
        env:
          PGPASSWORD: postgres
        run: |
          rls_log="$(mktemp)"
          trap 'rm -f -- "$rls_log"' EXIT
          if psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 >"$rls_log" 2>&1 <<'SQL'
          BEGIN;
          ALTER TABLE storage.objects DISABLE ROW LEVEL SECURITY;
          \i db/migrations/0192_account_deletion_completion_fence.sql
          ROLLBACK;
          SQL
          then
            cat "$rls_log"
            echo "account-deletion migration accepted Storage with RLS disabled" >&2
            exit 1
          fi
          if ! grep -Fq "storage.objects RLS must be enabled before account-deletion policies" "$rls_log"; then
            cat "$rls_log"
            echo "account-deletion RLS preflight failed for the wrong reason" >&2
            exit 1
          fi
      - name: Exercise account-deletion completion fence
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/account_deletion_completion_fence_regression.sql
      # 0209: the record-photos bucket (글 photo attachments). Private, jpeg-only,
      # owner-only select/insert/delete at the flat photo path, no update, and the
      # 0192 account-deletion fence refuses uploads once deletion has begun.
      - name: Exercise record-photos bucket boundary and deletion fence
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/record_photos_storage_regression.sql
      - name: Parse managed Storage read-only preflight on scratch schema
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/account_deletion_managed_storage_preflight.sql
      - name: Exercise numbered 0192 ledger alias on scratch schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Only the disposable CI database is modified. The real preflight
          # stays read-only and must also accept the managed apply_migration
          # timestamp/name pair, not just the CLI's 0192/bare-stem pair.
          restore_ledger() {
            psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
              "UPDATE supabase_migrations.schema_migrations SET version='0192', name='account_deletion_completion_fence' WHERE version='20990101000000' AND name='0192_account_deletion_completion_fence'"
          }
          trap restore_ledger EXIT
          changed="$(psql -X -h localhost -U postgres -At -v ON_ERROR_STOP=1 -c \
            "WITH moved AS (UPDATE supabase_migrations.schema_migrations SET version='20990101000000', name='0192_account_deletion_completion_fence' WHERE version='0192' AND name='account_deletion_completion_fence' RETURNING 1) SELECT count(*) FROM moved")"
          test "$changed" = 1
          psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/account_deletion_managed_storage_preflight.sql
      - name: Exercise numbered Naver OAuth limiter on scratch schema
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/oauth_naver_rate_limit_completion_regression.sql
      - name: Exercise numbered RSS quota and account deletion on scratch schema
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/rss_proxy_quota_regression.sql
      - name: Exercise ad-reward ledger erasure on account deletion
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/ad_reward_account_erasure_regression.sql
      # 0204 widens the same trigger to promo lots and 0205 revises the registry
      # reason. A deleted user's promo lot (and the spend against it) must go, a
      # purchase lot must stay with user_id NULL, another user's promo lot must
      # stay whole, and the registry reason and column comment must say so.
      - name: Exercise promo-lot erasure on account deletion
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/promo_lot_account_erasure_regression.sql
      # 0211: rewarded-ad records go 88 days after they were granted (policy max
      # 90). Old ad lots go whole with no orphan rows or balance drift, purchase
      # lots and recent records stay, a held transaction (and its month and day
      # counters) stays until the hold is released, an account deletion still
      # removes a held transaction, dispute audit rows go three years after the
      # dispute ended, reviews push the deadline out by 90 days, and client
      # roles cannot reach any of it. Rolled back.
      - name: Exercise numbered SSV helper ACL with real service role
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/reward_ssv_grant_helper_acl_regression.sql
      - name: Exercise 88-day reward purge
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/reward_records_90d_purge_regression.sql
      # Security gate r1 (DB-01 / BL-01): placing a dispute hold and the purge
      # queue on one advisory lock. Without it, a purge that started while a hold
      # was still uncommitted deleted the ad lot (step 3-1 locks only the ledger)
      # and left the transaction behind under SKIP LOCKED: an active hold over a
      # record whose ledger was gone. Two sessions on a throw-away clone, because
      # the hold leaves audit rows that the 0211 rollback round trip below refuses.
      # txn-race-2 is the same age with no hold and must go, so the held one
      # surviving proves the lock, not an ineligible fixture.
      - name: Race a dispute hold against the 88-day purge
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          source_db="${PGDATABASE:-postgres}"
          clone_db="race_0211_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
          if [[ ! "$source_db" =~ ^[a-z_][a-z0-9_]{0,62}$ || ! "$clone_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
            echo "0211 hold race refuses an unsafe database name" >&2
            exit 1
          fi
          sql() { # <db> <one statement>
            psql -X -q -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -Atc "$2"
          }
          sql "$source_db" "CREATE DATABASE $clone_db TEMPLATE $source_db"
          trap 'sql "$source_db" "DROP DATABASE IF EXISTS $clone_db WITH (FORCE)" || true' EXIT
          psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO auth.users (id, email) VALUES ('30000000-0000-0000-0000-000000000299', 'purge90-race@example.com');
          SET session_replication_role = origin;
          INSERT INTO public.users (id, email, birth_date, locale)
          VALUES ('30000000-0000-0000-0000-000000000299', 'purge90-race@example.com', DATE '1990-01-01', 'en');
          UPDATE public.users SET privacy_prefs = privacy_prefs || '{"ads": "true"}'::jsonb
           WHERE id = '30000000-0000-0000-0000-000000000299';
          SET request.jwt.claim.role = 'service_role';
          DO $seed$
          DECLARE
            v_user constant uuid := '30000000-0000-0000-0000-000000000299';
            v_month constant text := pg_catalog.to_char(pg_catalog.now() AT TIME ZONE 'Asia/Seoul', 'YYYY-MM');
            v_shift constant interval := make_interval(days => 130);
          BEGIN
            PERFORM public.grant_reward_credits_ssv(v_user, v_month, 2, 'txn-race-1');
            PERFORM public.grant_reward_credits_ssv(v_user, v_month, 2, 'txn-race-2');
            UPDATE public.credit_ledger
               SET created_at = created_at - v_shift,
                   lot_opened_at = lot_opened_at - v_shift,
                   lot_expires_at = lot_expires_at - v_shift
             WHERE user_id = v_user AND kind = 'ad_reward';
            UPDATE public.rewarded_ssv_txns SET granted_at = granted_at - v_shift WHERE user_id = v_user;
            PERFORM public.expire_credit_lots(pg_catalog.now(), 500);
          END
          $seed$;
          RESET request.jwt.claim.role;
          SQL
          state() { # lot present / txn rows / active holds for one transaction id
            sql "$clone_db" "SELECT (SELECT (count(*) > 0)::int FROM public.credit_ledger WHERE memo = 'rewarded SSV $1')
                                || '/' || (SELECT count(*) FROM public.rewarded_ssv_txns WHERE transaction_id = '$1')
                                || '/' || (SELECT count(*) FROM public.reward_dispute_holds
                                            WHERE transaction_id = '$1' AND released_at IS NULL)"
          }
          echo "before: txn-race-1 $(state txn-race-1), txn-race-2 $(state txn-race-2) (lot/txn/active hold)"
          if [[ "$(state txn-race-1)" != "1/1/0" || "$(state txn-race-2)" != "1/1/0" ]]; then
            echo "0211 hold race fixture is not in the expected state" >&2
            exit 1
          fi
          # Session A places the hold and keeps its transaction open for three seconds.
          psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
            -c "BEGIN" \
            -c "SELECT public.place_reward_dispute_hold('txn-race-1', 'user_dispute', 'CASE-RACE-1', 'ci', 'ci-approver')" \
            -c "SELECT pg_sleep(3)" \
            -c "COMMIT" > hold.out &
          hold_pid=$!
          waited=0
          until [[ "$(sql "$clone_db" "SELECT count(*) FROM pg_catalog.pg_stat_activity
                                        WHERE datname = current_database() AND state = 'active'
                                          AND query = 'SELECT pg_sleep(3)'")" == "1" ]]; do
            waited=$((waited + 1))
            if (( waited > 50 )); then echo "the hold session never reached its pause" >&2; exit 1; fi
            sleep 0.2
          done
          # The hold is placed and uncommitted. It must hold the purge's advisory lock.
          if [[ "$(sql "$clone_db" "SELECT count(*) FROM pg_catalog.pg_locks
                                  WHERE locktype = 'advisory' AND granted
                                    AND database = (SELECT oid FROM pg_catalog.pg_database WHERE datname = current_database())")" != "1" ]]; then
            echo "place_reward_dispute_hold() did not take the purge advisory lock" >&2
            exit 1
          fi
          # Session B: the purge must wait for A, then see its hold.
          started="$(date +%s%N)"
          sql "$clone_db" "SELECT public.purge_reward_records()" > purge.out
          waited_ms=$(( ($(date +%s%N) - started) / 1000000 ))
          wait "$hold_pid"
          echo "purge waited ${waited_ms} ms: $(cat purge.out)"
          echo "after: txn-race-1 $(state txn-race-1), txn-race-2 $(state txn-race-2)"
          if [[ "$(state txn-race-1)" != "1/1/1" ]]; then
            echo "the purge removed records of a transaction whose hold was being placed" >&2
            exit 1
          fi
          if [[ "$(state txn-race-2)" != "0/0/0" ]]; then
            echo "the unheld control was not purged, so the race proves nothing" >&2
            exit 1
          fi
          if (( waited_ms < 500 )); then
            echo "the purge did not wait for the hold session (${waited_ms} ms)" >&2
            exit 1
          fi
      # rollback/0211_down.sql is run by hand mid-incident, like 0189's, and no
      # other step here runs it. On a throw-away clone it must remove the eight
      # functions, two tables and seven indexes 0211 made (the cron job too, when
      # pg_cron exists), and 0211 must then apply twice in a row to the same set.
      - name: Round-trip the 88-day reward purge rollback
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          source_db="${PGDATABASE:-postgres}"
          clone_db="rollback_0211_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
          if [[ ! "$source_db" =~ ^[a-z_][a-z0-9_]{0,62}$ || ! "$clone_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
            echo "0211 rollback round trip refuses an unsafe database name" >&2
            exit 1
          fi
          sql() { # <db> <one statement>
            psql -X -q -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -Atc "$2"
          }
          apply() { # <db> <file>
            psql -X -q -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -f "$2" >/dev/null
          }
          sql "$source_db" "CREATE DATABASE $clone_db TEMPLATE $source_db"
          trap 'sql "$source_db" "DROP DATABASE IF EXISTS $clone_db WITH (FORCE)" || true' EXIT
          made="SELECT (SELECT pg_catalog.count(*) FROM pg_catalog.pg_proc AS p
                          JOIN pg_catalog.pg_namespace AS n ON n.oid = p.pronamespace
                         WHERE n.nspname = 'public'
                           AND p.proname IN ('purge_reward_records', 'reward_retention_health',
                                             'place_reward_dispute_hold', 'review_reward_dispute_hold',
                                             'release_reward_dispute_hold', 'reward_hold_caller_role',
                                             'reward_dispute_holds_log_delete',
                                             'reward_dispute_hold_events_append_only'))
                  || '/' ||
                  (SELECT pg_catalog.count(*) FROM pg_catalog.pg_class AS c
                     JOIN pg_catalog.pg_namespace AS n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public'
                      AND c.relname IN ('reward_dispute_holds', 'reward_dispute_hold_events',
                                        'reward_dispute_hold_events_case_idx',
                                        'reward_dispute_hold_events_txn_idx',
                                        'rewarded_ssv_txns_granted_at_idx',
                                        'credit_ledger_ad_reward_opened_idx',
                                        'usage_counters_reward_nonzero_idx',
                                        'chat_usage_ad_bonus_nonzero_idx',
                                        'reward_ssv_issue_rate_limits_updated_idx'))"
          # cron.job may not exist on the scratch server. A static reference fails at
          # plan time even under a CASE, so the job is counted in a separate call.
          made_all() { # <db>
            local cron="no_cron"
            if [[ "$(sql "$1" "SELECT pg_catalog.to_regclass('cron.job') IS NOT NULL")" == "t" ]]; then
              cron="$(sql "$1" "SELECT pg_catalog.count(*) FROM cron.job WHERE jobname = 'purge-reward-records-90d'")"
            fi
            echo "$(sql "$1" "$made")/$cron"
          }
          before="$(made_all "$clone_db")"
          echo "0211 objects before the rollback: $before (functions/relations/cron)"
          if [[ "$before" != 8/9/* ]]; then
            echo "0211 rollback round trip cannot start: expected 8 functions and 9 relations, found [$before]" >&2
            exit 1
          fi
          apply "$clone_db" db/migrations/rollback/0211_down.sql
          after_down="$(made_all "$clone_db")"
          echo "after rollback/0211_down.sql: $after_down"
          if [[ "$after_down" != "0/0/0" && "$after_down" != "0/0/no_cron" ]]; then
            echo "rollback/0211_down.sql left 0211 objects behind: [$after_down]" >&2
            exit 1
          fi
          apply "$clone_db" db/migrations/0211_reward_records_90d_purge.sql
          apply "$clone_db" db/migrations/0211_reward_records_90d_purge.sql
          again="$(made_all "$clone_db")"
          echo "after re-applying 0211 twice: $again"
          if [[ "$again" != "$before" ]]; then
            echo "0211 did not come back to the same set after its rollback: [$before] -> [$again]" >&2
            exit 1
          fi
      # 0203: the 2026-09-28 privacy policy is a NOTICE revision (Simon). A v5
      # signup must get the new tuple and an email-v5 receipt, an installed v4
      # client must still sign up, and LLM consent must count both tuples as
      # current with exactly one decision row per user. Rolled back.
      - name: Exercise the 2026-09-28 notice-revision consent contract
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/signup_consent_privacy_20260928_regression.sql
      # 0208: the 2026-09-29 privacy policy (v5, optional avatar setting) is a
      # NOTICE revision too. A v6 signup must get its own tuple and an email-v6
      # receipt, installed v5 and v4 clients must still sign up, and LLM consent
      # must count all three tuples as current. Rolled back.
      - name: Exercise the 2026-09-29 notice-revision consent contract
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/signup_consent_privacy_20260929_regression.sql
      # 0194 is replayed before 0208 in numeric order, but its writer must use
      # the final email-v6 tuple at call time. The retained draft test creates
      # 0194 itself, so exercise the installed RPCs after the complete replay.
      - name: Exercise service-consent v1 after the email-v6 notice revision
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/llm_service_consent_management_regression.sql
      # 0189's erase_my_data() is a destructive SECURITY DEFINER function, so it
      # is the one thing in this repo that must not be tested by reading its
      # source. The r38 gate measured 37 green string assertions over a function
      # whose receipt SELECT raised 42883 on every call (a schema-qualified
      # COALESCE) and rolled the whole deletion back. This step is the call.
      # Same scratch DB, same psql, no new secret, permission, or network reach.
      - name: Exercise content-erasure RPC isolation, refusals and receipt
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/erasure_registry_regression.sql
      - name: Compare account-export inventory with the public FK catalog
        env:
          PGPASSWORD: postgres
        run: |
          npx tsx scripts/check-account-export-inventory.ts --catalog-sql "$RUNNER_TEMP/account-export-inventory.sql"
          psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/account-export-inventory.sql" \
            -f db/tests/account_export_inventory_regression.sql
      # 0253: a record or source deleted while its reasoning run was still
      # working. complete_reasoning_run must not store a proposal whose target is
      # gone for that owner, and must store everything it cannot judge.
      - name: Exercise reasoning completion against erased targets
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/reasoning_complete_skips_erased_regression.sql
      # 0256, the second stage of 0253: the rows the old function left behind are removed once, in a
      # transaction of its own. The file commits what it does, so it runs on a clone that is dropped.
      - name: Exercise the one-time cleanup of proposals whose target is gone (0256)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          source_db="${PGDATABASE:-postgres}"
          clone_db="cleanup_0256_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
          if [[ ! "$source_db" =~ ^[a-z_][a-z0-9_]{0,62}$ || ! "$clone_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
            echo "0256 cleanup regression refuses an unsafe database name" >&2
            exit 1
          fi
          # The test role the file makes belongs to the cluster, not to the clone, so it goes on every
          # way out as well (a failure inside the file would otherwise leave it on a reused local cluster).
          drop_clone() {
            psql -X -q -h localhost -U postgres -d "$source_db" -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS $clone_db WITH (FORCE)" \
              -c "DROP ROLE IF EXISTS z66d_plain"
          }
          trap 'drop_clone || true' EXIT
          psql -X -q -h localhost -U postgres -d "$source_db" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE $clone_db TEMPLATE $source_db"
          psql -X -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 \
            -f db/tests/reasoning_orphan_proposals_cleanup_regression.sql
          trap - EXIT
          drop_clone
      # The same thing with the delete and the completion in flight together.
      # delete_first: the delete holds the record row, the completion waits for
      # it and then stores nothing. complete_first: the completion holds the row,
      # the delete waits, then removes the stored row through 0251's trigger and
      # closes the run. Neither order may end in a deadlock or leave a row whose
      # record is gone. source_delete_first is the first case again for a source.
      # The two transition cases are the hand-over from the old function to the
      # new one (0253, then 0256) with an old call still open.
      - name: Race a record delete against a reasoning completion
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          source_db="${PGDATABASE:-postgres}"
          if [[ ! "$source_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
            echo "0253 completion race refuses an unsafe database name" >&2
            exit 1
          fi
          sql() { # <db> <one statement>
            psql -X -q -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -Atc "$2"
          }
          user="26101354-0000-4000-8000-00000000000a"
          record="26101354-1000-4000-8000-0000000000a1"
          source="26101354-2000-4000-8000-0000000000a1"
          run_id="26101354-3000-4000-8000-000000000001"
          proposals="[{\"key\":\"record:$record\",\"refKind\":\"record\",\"refId\":\"$record\",\"title\":\"t\",\"domain\":\"growth\"}]"
          complete="public.complete_reasoning_run('$user', '$run_id', '$proposals'::jsonb)"
          delete="DELETE FROM public.records WHERE id = '$record'"
          source_proposals="[{\"key\":\"source:$source\",\"refKind\":\"source\",\"refId\":\"$source\",\"title\":\"t\",\"domain\":\"growth\"}]"
          complete_source="public.complete_reasoning_run('$user', '$run_id', '$source_proposals'::jsonb)"
          delete_source="DELETE FROM public.sources WHERE id = '$source'"
          # Every way out of a case ends its sessions and drops its clone: a normal end, a failed check and a
          # command that fails under `set -e` alike (the EXIT trap). A clone that cannot be dropped fails the step.
          active_db=""
          end_case() {
            local db="$active_db"
            active_db=""
            if [[ -n "$db" ]]; then
              sql "$source_db" "SELECT pg_catalog.pg_terminate_backend(pid) FROM pg_catalog.pg_stat_activity
                                 WHERE datname = '$db'" > /dev/null 2>&1 || true
              wait 2> /dev/null || true
              sql "$source_db" "DROP DATABASE IF EXISTS $db WITH (FORCE)"
            fi
          }
          trap 'end_case || true' EXIT
          clone() { # <label> : a clone with one user, one record, one source and one run that is still working
            local db="race_0253_${1}_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            if [[ ! "$db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
              echo "0253 completion race refuses an unsafe database name" >&2
              return 1
            fi
            active_db="$db"
            sql "$source_db" "CREATE DATABASE $db TEMPLATE $source_db"
            psql -X -q -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO auth.users (id, email) VALUES ('26101354-0000-4000-8000-00000000000a', 'z66c-race@example.com');
          SET session_replication_role = origin;
          INSERT INTO public.users (id, email, birth_date, locale)
          VALUES ('26101354-0000-4000-8000-00000000000a', 'z66c-race@example.com', DATE '1990-01-01', 'en');
          INSERT INTO public.records (id, user_id, kind, body)
          VALUES ('26101354-1000-4000-8000-0000000000a1', '26101354-0000-4000-8000-00000000000a', 'note', 'deleted mid-run');
          INSERT INTO public.sources (id, user_id, kind, title, storage_path)
          VALUES ('26101354-2000-4000-8000-0000000000a1', '26101354-0000-4000-8000-00000000000a', 'article', 'deleted mid-run',
                  'raw/z66c-race.md');
          INSERT INTO public.reasoning_runs (id, user_id, idempotency_key, trigger_kind, status, spend, week_bucket, month_bucket)
          VALUES ('26101354-3000-4000-8000-000000000001', '26101354-0000-4000-8000-00000000000a', 'z66c-race-0001', 'auto',
                  'running', 'none', '2026-W42', '2026-10');
          SQL
          }
          seen() { # <db> <what must become true> <query returning 1 when it is>
            local n=0
            until [[ "$(sql "$1" "$3")" == "1" ]]; do
              n=$((n + 1))
              if (( n > 150 )); then echo "$2" >&2; return 1; fi
              sleep 0.2
            done
          }
          row_state() { # <db> : rows/run/records/sources
            sql "$1" "SELECT (SELECT count(*) FROM public.reasoning_run_proposals WHERE run_id = '$run_id')
                       || '/' || (SELECT status FROM public.reasoning_runs WHERE id = '$run_id')
                       || '/' || (SELECT count(*) FROM public.records WHERE id = '$record')
                       || '/' || (SELECT count(*) FROM public.sources WHERE id = '$source')" | tr -d '\r'
          }
          race() { # <label> <first statement> <second statement> <expected: first rc/second rc/rows/run/records/sources>
            local label="$1" first="$2" second="$3" want="$4"
            clone "$label"
            local clone_db="$active_db"
            # A barrier instead of a timed pause. A holder session keeps an advisory lock; the first session
            # runs its statement and then waits for that lock with its transaction open; only then is the
            # second session started. The case fails unless the second session is SEEN waiting for a lock
            # the first one holds. Two statements that merely ran one after the other do not pass.
            local key=2530253 h_app="race0253_h_$label" a_app="race0253_a_$label" b_app="race0253_b_$label"
            local a_rc=0 b_rc=0 a b state h_pid a_pid b_pid
            PGAPPNAME="$h_app" psql -X -q -h localhost -U postgres -d "$clone_db" -At \
              -c "SELECT pg_advisory_lock($key)" -c "SELECT pg_sleep(120)" > /dev/null 2>&1 &
            h_pid=$!
            seen "$clone_db" "$label: the holder never took the barrier" \
              "SELECT count(*) FROM pg_catalog.pg_locks l JOIN pg_catalog.pg_stat_activity s ON s.pid = l.pid
                WHERE l.locktype = 'advisory' AND l.granted AND s.application_name = '$h_app'"
            PGAPPNAME="$a_app" PGOPTIONS="-c statement_timeout=90s" \
              psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
              -c "BEGIN" \
              -c "SET LOCAL request.jwt.claim.sub = '$user'" \
              -c "$first" \
              -c "SELECT pg_advisory_xact_lock($key)" \
              -c "COMMIT" > "race_0253_a_$label.out" 2>&1 &
            a_pid=$!
            seen "$clone_db" "$label: the first session never reached the barrier" \
              "SELECT count(*) FROM pg_catalog.pg_locks l JOIN pg_catalog.pg_stat_activity s ON s.pid = l.pid
                WHERE l.locktype = 'advisory' AND NOT l.granted AND s.application_name = '$a_app'"
            PGAPPNAME="$b_app" PGOPTIONS="-c statement_timeout=90s" \
              psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
              -c "BEGIN" \
              -c "SET LOCAL request.jwt.claim.sub = '$user'" \
              -c "$second" \
              -c "COMMIT" > "race_0253_b_$label.out" 2>&1 &
            b_pid=$!
            # With the lock on the target gone, the second session runs through and this never becomes true.
            seen "$clone_db" "$label: the second session did not wait for a lock the first session holds" \
              "SELECT count(*) FROM pg_catalog.pg_stat_activity w
                WHERE w.application_name = '$b_app' AND w.wait_event_type = 'Lock'
                  AND (SELECT f.pid FROM pg_catalog.pg_stat_activity f WHERE f.application_name = '$a_app')
                      = ANY (pg_catalog.pg_blocking_pids(w.pid))"
            # Open the barrier by ending the holder. The first session commits, then the second one goes on.
            sql "$clone_db" "SELECT pg_catalog.pg_terminate_backend(pid) FROM pg_catalog.pg_stat_activity
                              WHERE application_name = '$h_app'" > /dev/null
            wait "$h_pid" 2> /dev/null || true
            wait "$a_pid" || a_rc=$?
            wait "$b_pid" || b_rc=$?
            a="$(tr -d '\r' < "race_0253_a_$label.out" | tr '\n' ' ')"
            b="$(tr -d '\r' < "race_0253_b_$label.out" | tr '\n' ' ')"
            state="$(row_state "$clone_db")"
            end_case
            echo "$label: first session rc=$a_rc [$a] second session rc=$b_rc [$b] rows/run/records/sources $state"
            if [[ "$a_rc/$b_rc/$state" != "$want" ]]; then
              echo "$label: wanted $want" >&2
              return 1
            fi
            if grep -q -i "deadlock" <<< "$a $b"; then
              echo "$label: a session ended in a deadlock" >&2
              return 1
            fi
          }
          # The hand-over (review round 2, Z66C-01). A completion that entered the OLD function before 0253
          # was committed stores its row late. The old call is held inside the old body before it takes its
          # run row: auth.uid(), the first thing that body evaluates, waits on a gate for that one session.
          # 0253 is then committed, the record is deleted, and 0256 is started while the old call is open.
          # released: 0256 must be SEEN waiting; the gate opens, the old call stores its row (stored=1 is the
          # old body; the new one would store 0), and 0256 then removes that row and closes the run.
          # held: the old call stays open, 0256 gives up after its 20 seconds having changed nothing; the old
          # call then stores its row, nothing removes it, and a second 0256 does.
          transition() { # <label> <released|held>
            local label="$1" mode="$2"
            clone "$label"
            local db="$active_db" a_app="race0253_a_$label" c_app="race0253_c_$label"
            local a_pid c_pid a_rc=0 c_rc=0 a c state
            psql -X -q -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 -f db/migrations/rollback/0253_down.sql
            if [[ "$(sql "$db" "SELECT pg_catalog.strpos(p.prosrc, 'FOR KEY SHARE') FROM pg_catalog.pg_proc AS p
                                 WHERE p.oid = 'public.complete_reasoning_run(uuid, uuid, jsonb)'::regprocedure")" != "0" ]]; then
              echo "$label: the clone does not start from the old function" >&2
              return 1
            fi
            sql "$db" "CREATE TABLE public.z66c_gate (open boolean NOT NULL)"
            sql "$db" "INSERT INTO public.z66c_gate VALUES (false)"
            sql "$db" "CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE plpgsql AS \$gate\$
                       BEGIN
                         IF pg_catalog.current_setting('application_name') = '$a_app' THEN
                           WHILE NOT (SELECT g.open FROM public.z66c_gate AS g) LOOP
                             PERFORM pg_catalog.pg_sleep(0.05);
                           END LOOP;
                         END IF;
                         RETURN NULLIF(pg_catalog.current_setting('request.jwt.claim.sub', true), '')::uuid;
                       END \$gate\$"
            PGAPPNAME="$a_app" PGOPTIONS="-c statement_timeout=90s" \
              psql -X -q -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 -At \
              -c "BEGIN" \
              -c "SET LOCAL request.jwt.claim.sub = '$user'" \
              -c "SELECT 'stored=' || $complete" \
              -c "COMMIT" > "race_0253_a_$label.out" 2>&1 &
            a_pid=$!
            seen "$db" "$label: the old call never reached the gate inside the old function" \
              "SELECT count(*) FROM pg_catalog.pg_stat_activity
                WHERE application_name = '$a_app' AND state = 'active' AND wait_event = 'PgSleep'
                  AND query LIKE '%complete_reasoning_run%'"
            # The first stage, committed while the old call is open. Then the record goes.
            psql -X -q -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 \
              -f db/migrations/0253_reasoning_complete_skips_erased.sql
            sql "$db" "$delete"
            PGAPPNAME="$c_app" psql -X -q -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 \
              -f db/migrations/0256_reasoning_orphan_proposals_cleanup.sql > "race_0253_c_$label.out" 2>&1 &
            c_pid=$!
            # Without the wait in 0256 it runs through, and this never becomes true.
            seen "$db" "$label: 0256 did not wait for the transaction that was already open" \
              "SELECT count(*) FROM pg_catalog.pg_stat_activity
                WHERE application_name = '$c_app' AND state = 'active' AND wait_event = 'PgSleep'"
            state="$(row_state "$db")"
            if [[ "$state" != "0/running/0/1" ]]; then
              echo "$label: before the gate opened the state was $state" >&2
              return 1
            fi
            if [[ "$mode" == "held" ]]; then
              wait "$c_pid" || c_rc=$?
              c="$(tr -d '\r' < "race_0253_c_$label.out" | tr '\n' ' ')"
              if (( c_rc == 0 )) || ! grep -q "0256 cleanup refused: 1 older transaction(s) still open after 20 seconds" <<< "$c"; then
                echo "$label: 0256 did not give up while the old call was open: rc=$c_rc [$c]" >&2
                return 1
              fi
              state="$(row_state "$db")"
              if [[ "$state" != "0/running/0/1" ]]; then
                echo "$label: a 0256 that gave up changed the state to $state" >&2
                return 1
              fi
            fi
            sql "$db" "UPDATE public.z66c_gate SET open = true"
            wait "$a_pid" || a_rc=$?
            a="$(tr -d '\r' < "race_0253_a_$label.out" | tr '\n' ' ')"
            if [[ "$mode" == "held" ]]; then
              # The old body stored the row and nothing has removed it: this is the row 0256 exists for.
              state="$(row_state "$db")"
              if [[ "$state" != "1/proposed/0/1" ]]; then
                echo "$label: after the old call the state was $state, not the row it should have left" >&2
                return 1
              fi
              c_rc=0
              PGAPPNAME="$c_app" psql -X -q -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 \
                -f db/migrations/0256_reasoning_orphan_proposals_cleanup.sql > "race_0253_c_$label.out" 2>&1 || c_rc=$?
            else
              wait "$c_pid" || c_rc=$?
            fi
            c="$(tr -d '\r' < "race_0253_c_$label.out" | tr '\n' ' ')"
            state="$(row_state "$db")"
            end_case
            echo "$label: old call rc=$a_rc [$a] 0256 rc=$c_rc [$c] rows/run/records/sources $state"
            if [[ "$a_rc/$c_rc/$state" != "0/0/0/ratified/0/1" ]]; then
              echo "$label: wanted 0/0/0/ratified/0/1" >&2
              return 1
            fi
            if ! grep -q "stored=1" <<< "$a"; then
              echo "$label: the open call did not run the old function body" >&2
              return 1
            fi
            if ! grep -q "removed 1 proposal rows, closed 1 runs" <<< "$c"; then
              echo "$label: 0256 did not remove the row the old call stored" >&2
              return 1
            fi
          }
          # The delete is open when the completion arrives: nothing is stored, the run ends as proposed.
          race delete_first "$delete" "SELECT 'stored=' || $complete" "0/0/0/proposed/0/1"
          # The completion is open when the delete arrives: the row is stored, then removed with its record.
          race complete_first "SELECT 'stored=' || $complete" "$delete" "0/0/0/ratified/0/1"
          # The same as the first case for a source.
          race source_delete_first "$delete_source" "SELECT 'stored=' || $complete_source" "0/0/0/proposed/1/0"
          # An old call is open across the hand-over: 0256 waits for it, then removes what it stored.
          transition transition_released released
          # The old call outlasts 0256's patience: 0256 changes nothing, and a later run finishes the job.
          transition transition_held held
          left="$(sql "$source_db" "SELECT count(*) FROM pg_catalog.pg_database WHERE datname LIKE 'race\_0253\_%'")"
          if [[ "$left" != "0" ]]; then
            echo "0253 completion race left $left clone database(s) behind" >&2
            exit 1
          fi
      # 0251: a deleted record or source takes its reasoning proposal rows with
      # it. The deletes run as `authenticated` through RLS, then the one-time
      # cleanup is replayed over rows shaped like the ones left behind.
      - name: Exercise reasoning proposal purge on record and source deletion
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/reasoning_proposals_purge_regression.sql
      # 0252 + 0255: a chat turn whose answer was swapped for the crisis notice is
      # given back once, on the proxy-written audit row of that very turn and on
      # the day that turn was counted on. Called as `authenticated` with the row's
      # id; client rows, other purposes, old rows, another user's rows and turns,
      # and rows without a counted turn must not count.
      - name: Exercise chat turn refund on proxy evidence only
        env:
          PGPASSWORD: postgres
          PGDATABASE: t39_t40_before_0265
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/tests/chat_turn_refund_regression.sql
      # Two sessions of one user ask at the same moment. Each call names the
      # proxy row of its turn and no day (0255): the day is the row of chat_usage
      # on which that turn was counted. With ONE row, both calls name it. The first
      # pass is the everyday case (READ COMMITTED): the per-user advisory lock
      # makes the second call wait and then find the row used. The second pass is
      # the one a snapshot cannot protect (REPEATABLE READ): the second call still
      # reads the row as unused and ends with 40001 on the chat_usage row the first
      # call changed; nothing of it is kept. With TWO rows the second call names
      # the second row. When both turns were counted today, both calls get a turn
      # under READ COMMITTED, and under REPEATABLE READ the second ends with 40001
      # and its row gives the turn back to the next call. When the second turn was
      # counted yesterday, it comes back on yesterday's row under either level:
      # the two calls touch different rows. No row counts twice and no turn comes
      # back on a day it was not counted on. The app calls through PostgREST, which
      # is READ COMMITTED. The rest of the step applies 0252 again after both down
      # files: once over its own ledger table, which must work, and then over nine
      # tables of another shape, each of which must stop at the check named beside
      # it and leave nothing of 0252 behind. Then the claim that binds an answer to
      # a counted turn (0255): two answers asking for one reservation, and one
      # answer asking for two reservations, at the same moment. One binds, the
      # other gets false. Last, 0255 is applied again after its own down file: over
      # the tables as 0252 left them and over a reservation table of the very shape
      # it makes, which must work, and over a ledger key that is missing, may be
      # deferred or covers another column, and a reservation table of another
      # shape or with something more hanging on it, each of which must stop and
      # leave 0252's function in place.
      - name: Race two chat turn refunds over one proxy row
        env:
          PGPASSWORD: postgres
          PGDATABASE: t39_t40_before_0265
        run: |
          set -euo pipefail
          source_db="${PGDATABASE:-postgres}"
          if [[ ! "$source_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
            echo "0252 refund race refuses an unsafe database name" >&2
            exit 1
          fi
          sql() { # <db> <one statement>
            psql -X -q -h localhost -U postgres -d "$1" -v ON_ERROR_STOP=1 -Atc "$2"
          }
          user="26101347-0000-4000-8000-00000000000a"
          race() { # <label> <BEGIN statement> <days ago the second row's turn was counted> <proxy rows> <expected: a b today/yesterday/used> [expected of a later plain call]
            local label="$1" begin="$2" offset="$3" rows="$4" want="$5" later="${6:-}"
            # Three counted turns: two today, one yesterday. The first row answers the first of today's.
            # Each answer is bound to its turn the way a proxy binds it: through the claim.
            local turn_a="26101347-7000-4000-8000-000000007001" turn_b="26101347-7000-4000-8000-000000007002"
            if [[ "$offset" == "1" ]]; then turn_b="26101347-7000-4000-8000-000000007011"; fi
            # The first call names the first row. The second names the second row when there are two.
            local row_a="26101347-4000-4000-8000-000000000001" row_b="26101347-4000-4000-8000-000000000001"
            if [[ "$rows" == "2" ]]; then row_b="26101347-4000-4000-8000-000000000002"; fi
            local clone_db="race_0252_${label}_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            if [[ ! "$clone_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
              echo "0252 refund race refuses an unsafe database name" >&2
              return 1
            fi
            sql "$source_db" "CREATE DATABASE $clone_db TEMPLATE $source_db"
            psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO auth.users (id, email) VALUES ('26101347-0000-4000-8000-00000000000a', 'z46-race@example.com');
          SET session_replication_role = origin;
          INSERT INTO public.users (id, email, birth_date, locale)
          VALUES ('26101347-0000-4000-8000-00000000000a', 'z46-race@example.com', DATE '1990-01-01', 'en');
          INSERT INTO public.chat_usage (user_id, day, count) VALUES
            ('26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date, 5),
            ('26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date - 1, 3);
          INSERT INTO public.chat_turn_reservations (turn_id, user_id, counted_day) VALUES
            ('26101347-7000-4000-8000-000000007001', '26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date),
            ('26101347-7000-4000-8000-000000007002', '26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date),
            ('26101347-7000-4000-8000-000000007011', '26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date - 1);
          INSERT INTO public.ai_audit_log
            (id, user_id, prompt_hash, output_hash, model_used, vertex_backend, safety_zone, latency_ms, purpose, event_source)
          VALUES ('26101347-4000-4000-8000-000000000001', '26101347-0000-4000-8000-00000000000a', '0a0b0c0d', '0e0f0a0b',
                  'gpt-test', false, 'red', 10, 'secondb_chat', 'server_verified');
          SQL
            if [[ "$(sql "$clone_db" "SELECT public.begin_chat_turn_attempt('$user', '26101347-4000-4000-8000-000000000001', '$turn_a')" | tr -d '\r')" != "t" ]]; then
              echo "$label: the first proxy call was not recorded as its turn's attempt" >&2
              return 1
            fi
            if [[ "$(sql "$clone_db" "SELECT public.claim_chat_turn_for_audit('$user', '26101347-4000-4000-8000-000000000001', '$turn_a')" | tr -d '\r')" != "t" ]]; then
              echo "$label: the first proxy row was not bound to its turn" >&2
              return 1
            fi
            if [[ "$rows" == "2" ]]; then
              sql "$clone_db" "INSERT INTO public.ai_audit_log
                (id, user_id, prompt_hash, output_hash, model_used, vertex_backend, safety_zone, latency_ms, purpose, event_source)
                VALUES ('26101347-4000-4000-8000-000000000002', '$user', '0a0b0c0d', '0e0f0a0b', 'gpt-test', false, 'red', 10, 'secondb_chat', 'server_verified')"
              if [[ "$(sql "$clone_db" "SELECT public.begin_chat_turn_attempt('$user', '26101347-4000-4000-8000-000000000002', '$turn_b')" | tr -d '\r')" != "t" ]]; then
                echo "$label: the second proxy call was not recorded as its turn's attempt" >&2
                return 1
              fi
              if [[ "$(sql "$clone_db" "SELECT public.claim_chat_turn_for_audit('$user', '26101347-4000-4000-8000-000000000002', '$turn_b')" | tr -d '\r')" != "t" ]]; then
                echo "$label: the second proxy row was not bound to its turn" >&2
                return 1
              fi
            fi
            local today="(pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date"
            # Session A takes the refund for its row and keeps its transaction open for three seconds.
            psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
              -c "$begin" \
              -c "SET LOCAL request.jwt.claim.sub = '$user'" \
              -c "SELECT 'a=' || COALESCE(public.refund_chat_turn_after_output_swap('$row_a')::text, 'null')" \
              -c "SELECT pg_sleep(3)" \
              -c "COMMIT" > "refund_a_$label.out" &
            local a_pid=$! waited=0
            until [[ "$(sql "$clone_db" "SELECT count(*) FROM pg_catalog.pg_stat_activity
                                          WHERE datname = current_database() AND state = 'active'
                                            AND query = 'SELECT pg_sleep(3)'")" == "1" ]]; do
              waited=$((waited + 1))
              if (( waited > 50 )); then echo "$label: the first refund session never reached its pause" >&2; return 1; fi
              sleep 0.2
            done
            # Session B asks while A is still open. Its first statement is the call, so under
            # REPEATABLE READ its snapshot is taken here, before A commits.
            local b a state b_out
            b_out="$(psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -At \
              -c "$begin" \
              -c "SET LOCAL request.jwt.claim.sub = '$user'" \
              -c "SELECT 'b=' || COALESCE(public.refund_chat_turn_after_output_swap('$row_b')::text, 'null')" \
              -c "COMMIT" 2>&1 || true)"
            b="$(grep '^b=' <<<"$b_out" | tr -d '\r' || true)"
            # A call that ended with an error is reported by its SQLSTATE.
            if [[ -z "$b" ]]; then b="b=$(grep -o -m1 'ERROR: *[0-9A-Z]\{5\}' <<<"$b_out" | tr -d ' \r' || true)"; fi
            wait "$a_pid"
            a="$(grep '^a=' "refund_a_$label.out" | tr -d '\r')"
            state="$(sql "$clone_db" "SELECT (SELECT count FROM public.chat_usage WHERE user_id = '$user' AND day = $today)
                                        || '/' || (SELECT count FROM public.chat_usage WHERE user_id = '$user' AND day = $today - 1)
                                        || '/' || (SELECT count(*) FROM public.chat_turn_refunds)" | tr -d '\r')"
            local c=""
            if [[ -n "$later" ]]; then
              c="$(psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
                -c "BEGIN" \
                -c "SET LOCAL request.jwt.claim.sub = '$user'" \
                -c "SELECT 'c=' || COALESCE(public.refund_chat_turn_after_output_swap('$row_b')::text, 'null')" \
                -c "COMMIT" | grep '^c=' | tr -d '\r')"
            fi
            sql "$source_db" "DROP DATABASE IF EXISTS $clone_db WITH (FORCE)" || true
            echo "$label: first session $a, second session $b, today/yesterday/used rows $state${c:+, a later call $c}"
            if [[ "$a $b $state" != "$want" ]]; then
              echo "$label: one proxy row gave back more than one turn, or none (wanted $want)" >&2
              return 1
            fi
            if [[ "$c" != "$later" ]]; then
              echo "$label: the row of the call that got nothing was lost (wanted $later)" >&2
              return 1
            fi
          }
          # The claim, twice at the same moment. turn: two fresh answers ask for one reservation. row: one fresh
          # answer asks for two reservations. The first call keeps its transaction open for three seconds; the
          # second is made while it is open. Exactly one binds; the other gets false and changes nothing.
          claim_race() { # <label> <turn|row|retry> <expected: a b, then each reservation as state:answer:attempts:first,second attempt>
            local label="$1" second="$2" want="$3"
            local turn_a="26101347-7000-4000-8000-000000007001" turn_b="26101347-7000-4000-8000-000000007002"
            local row_1="26101347-4000-4000-8000-000000000001" row_2="26101347-4000-4000-8000-000000000002"
            local row_3="26101347-4000-4000-8000-000000000003"
            # turn:  the first attempt (row 01) and the re-ask (row 02) were recorded; the re-ask's claim runs while
            #        the first attempt's claim arrives late. row: one row was named as the attempt of two turns.
            # retry: the first attempt's answer (row 03) was bound and never reached the app; two re-asks are
            #        recorded at once.
            local fn="claim_chat_turn_for_audit" a_args="'$row_2', '$turn_a'" b_args="'$row_1', '$turn_a'"
            local -a setup=("'$row_1', '$turn_a'" "'$row_2', '$turn_a'")
            if [[ "$second" == "row" ]]; then
              a_args="'$row_1', '$turn_a'"; b_args="'$row_1', '$turn_b'"; setup=("'$row_1', '$turn_a'" "'$row_1', '$turn_b'")
            fi
            if [[ "$second" == "retry" ]]; then
              fn="begin_chat_turn_attempt"; setup=("'$row_3', '$turn_a'")
              a_args="'$row_1', '$turn_a'"; b_args="'$row_2', '$turn_a'"
            fi
            local clone_db="race_0255_${label}_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            if [[ ! "$clone_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
              echo "0255 claim race refuses an unsafe database name" >&2
              return 1
            fi
            sql "$source_db" "CREATE DATABASE $clone_db TEMPLATE $source_db"
            psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO auth.users (id, email) VALUES ('26101347-0000-4000-8000-00000000000a', 'z46-race@example.com');
          SET session_replication_role = origin;
          INSERT INTO public.users (id, email, birth_date, locale)
          VALUES ('26101347-0000-4000-8000-00000000000a', 'z46-race@example.com', DATE '1990-01-01', 'en');
          INSERT INTO public.chat_usage (user_id, day, count) VALUES
            ('26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date, 5);
          -- Turn 7001 is the user's latest (7002 was counted a minute before it).
          INSERT INTO public.chat_turn_reservations (turn_id, user_id, counted_day, issued_at) VALUES
            ('26101347-7000-4000-8000-000000007001', '26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date, pg_catalog.now()),
            ('26101347-7000-4000-8000-000000007002', '26101347-0000-4000-8000-00000000000a', (pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date, pg_catalog.now() - interval '1 minute');
          INSERT INTO public.ai_audit_log
            (id, user_id, prompt_hash, output_hash, model_used, vertex_backend, safety_zone, latency_ms, purpose, event_source)
          VALUES ('26101347-4000-4000-8000-000000000001', '26101347-0000-4000-8000-00000000000a', '0a0b0c0d', '0e0f0a0b',
                  'gpt-test', false, 'red', 10, 'secondb_chat', 'server_verified'),
                 ('26101347-4000-4000-8000-000000000002', '26101347-0000-4000-8000-00000000000a', '0a0b0c0d', '0e0f0a0b',
                  'gpt-test', false, 'red', 10, 'secondb_chat', 'server_verified'),
                 ('26101347-4000-4000-8000-000000000003', '26101347-0000-4000-8000-00000000000a', '0a0b0c0d', '0e0f0a0b',
                  'gpt-test', false, 'red', 10, 'secondb_chat', 'server_verified');
          SQL
            # What the proxies did before the race: each recorded its call as an attempt before asking the model.
            local args
            for args in "${setup[@]}"; do
              if [[ "$(sql "$clone_db" "SELECT public.begin_chat_turn_attempt('$user', $args)" | tr -d '\r')" != "t" ]]; then
                echo "$label: an attempt before the race was not recorded" >&2
                return 1
              fi
            done
            if [[ "$second" == "retry" ]]; then
              if [[ "$(sql "$clone_db" "SELECT public.claim_chat_turn_for_audit('$user', '$row_3', '$turn_a')" | tr -d '\r')" != "t" ]]; then
                echo "$label: the first answer was not bound before the race" >&2
                return 1
              fi
            fi
            psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
              -c "BEGIN" \
              -c "SELECT 'a=' || public.$fn('$user', $a_args)::text" \
              -c "SELECT pg_sleep(3)" \
              -c "COMMIT" > "claim_a_$label.out" &
            local a_pid=$! waited=0
            until [[ "$(sql "$clone_db" "SELECT count(*) FROM pg_catalog.pg_stat_activity
                                          WHERE datname = current_database() AND state = 'active'
                                            AND query = 'SELECT pg_sleep(3)'")" == "1" ]]; do
              waited=$((waited + 1))
              if (( waited > 50 )); then echo "$label: the first claim session never reached its pause" >&2; return 1; fi
              sleep 0.2
            done
            local a b state b_out
            b_out="$(psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -At \
              -c "BEGIN" \
              -c "SELECT 'b=' || public.$fn('$user', $b_args)::text" \
              -c "COMMIT" 2>&1 || true)"
            b="$(grep '^b=' <<<"$b_out" | tr -d '\r' || true)"
            if [[ -z "$b" ]]; then b="b=$(grep -o -m1 'ERROR: *[0-9A-Z]\{5\}' <<<"$b_out" | tr -d ' \r' || true)"; fi
            wait "$a_pid"
            a="$(grep '^a=' "claim_a_$label.out" | tr -d '\r')"
            state="$(sql "$clone_db" "SELECT string_agg(r.state || ':' || COALESCE(right(r.audit_id::text, 2), '-') || ':' || r.attempts
                                                        || ':' || COALESCE(right(r.attempt1_audit_id::text, 2), '-')
                                                        || ',' || COALESCE(right(r.attempt2_audit_id::text, 2), '-'), '/' ORDER BY r.turn_id)
                                        FROM public.chat_turn_reservations AS r" | tr -d '\r')"
            sql "$source_db" "DROP DATABASE IF EXISTS $clone_db WITH (FORCE)" || true
            echo "$label: first session $a, second session $b, reservations $state"
            if [[ "$a $b $state" != "$want" ]]; then
              echo "$label: two calls at once did not end with exactly one answer bound to each turn (wanted $want)" >&2
              return 1
            fi
          }
          bump_race() { # <label> <expected: a b counted-reservations as count:day offsets>
            local label="$1" want="$2"
            local clone_db="race_0255_${label}_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            if [[ ! "$clone_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
              echo "0255 bump race refuses an unsafe database name" >&2
              return 1
            fi
            sql "$source_db" "CREATE DATABASE $clone_db TEMPLATE $source_db"
            psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO auth.users (id, email) VALUES ('26101347-0000-4000-8000-00000000000a', 'z46-race@example.com');
          SET session_replication_role = origin;
          INSERT INTO public.users (id, email, birth_date, locale)
          VALUES ('26101347-0000-4000-8000-00000000000a', 'z46-race@example.com', DATE '1990-01-01', 'en');
          SQL
            local as_user="SET LOCAL request.jwt.claim.sub = '$user'"
            local kst_today="(pg_catalog.now() AT TIME ZONE 'Asia/Seoul')::date"
            psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
              -c "BEGIN" -c "$as_user" -c "SET LOCAL ROLE authenticated" \
              -c "SELECT 'a=' || (public.bump_chat_usage_for_turn('$user', $kst_today - 1) ->> 'count')" \
              -c "SELECT pg_sleep(3)" \
              -c "COMMIT" > "bump_a_$label.out" &
            local a_pid=$! waited=0
            until [[ "$(sql "$clone_db" "SELECT count(*) FROM pg_catalog.pg_stat_activity
                                          WHERE datname = current_database() AND state = 'active'
                                            AND query = 'SELECT pg_sleep(3)'")" == "1" ]]; do
              waited=$((waited + 1))
              if (( waited > 50 )); then echo "$label: the first bump session never reached its pause" >&2; return 1; fi
              sleep 0.2
            done
            local a b counted
            b="$(psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 -At \
              -c "BEGIN" -c "$as_user" -c "SET LOCAL ROLE authenticated" \
              -c "SELECT 'b=' || (public.bump_chat_usage_for_turn('$user', $kst_today) ->> 'count')" \
              -c "COMMIT" | grep '^b=' | tr -d '\r')"
            wait "$a_pid"
            a="$(grep '^a=' "bump_a_$label.out" | tr -d '\r')"
            counted="$(sql "$clone_db" "SELECT count(*) || ':' || COALESCE(string_agg(($kst_today - r.counted_day)::text, ',' ORDER BY r.counted_day DESC), '-')
                                         FROM public.chat_turn_reservations AS r WHERE r.state = 'counted'" | tr -d '\r')"
            sql "$source_db" "DROP DATABASE IF EXISTS $clone_db WITH (FORCE)" || true
            echo "$label: first session $a, second session $b, counted reservations $counted"
            if [[ "$a $b $counted" != "$want" ]]; then
              echo "$label: two bumps at once did not leave only the later reservation open (wanted $want)" >&2
              return 1
            fi
          }
          reask_race() { # <label> <expected: a b attempts:first,second attempt> : a re-ask recorded while a new turn is counted
            local label="$1" want="$2"
            local clone_db="race_0255_${label}_${GITHUB_RUN_ID:-local}_${GITHUB_RUN_ATTEMPT:-0}_$$"
            if [[ ! "$clone_db" =~ ^[a-z_][a-z0-9_]{0,62}$ ]]; then
              echo "0255 re-ask race refuses an unsafe database name" >&2
              return 1
            fi
            sql "$source_db" "CREATE DATABASE $clone_db TEMPLATE $source_db"
            psql -X -q -h localhost -U postgres -d "$clone_db" -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
