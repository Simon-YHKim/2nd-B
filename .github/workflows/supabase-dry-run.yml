            ) THEN
              RAISE EXCEPTION 'old revision or coerced boolean provisioned a profile';
            END IF;
          END $$;

          -- A profile that predates this confirmation is not proof that this
          -- trigger provisioned it. The primary-key conflict must not attach a
          -- fresh consent event to that existing row.
          INSERT INTO auth.users (id, email, raw_user_meta_data)
          VALUES (
            '01480000-0000-0000-0000-000000000005',
            'stale-profile-ci@example.invalid',
            jsonb_build_object(
              'signup_flow', 'email-v2',
              'signup_birth_date', '1990-01-01',
              'signup_locale', 'en',
