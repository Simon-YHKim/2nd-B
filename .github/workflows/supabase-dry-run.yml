          reapply_0255_over deferred_primary_key "ALTER TABLE public.chat_turn_refunds DROP CONSTRAINT chat_turn_refunds_pkey; ALTER TABLE public.chat_turn_refunds ADD CONSTRAINT chat_turn_refunds_pkey PRIMARY KEY (audit_id) DEFERRABLE INITIALLY DEFERRED" "chat_turn_refunds must have a primary key on audit_id alone that is not deferrable"
          reapply_0255_over wider_primary_key "ALTER TABLE public.chat_turn_refunds DROP CONSTRAINT chat_turn_refunds_pkey; ALTER TABLE public.chat_turn_refunds ADD CONSTRAINT chat_turn_refunds_pkey PRIMARY KEY (audit_id, day)" "chat_turn_refunds must have a primary key on audit_id alone that is not deferrable"
          # A reservation table that is already there. In the shape 0255 makes it, the apply goes through; in any
          # other shape it stops at the check named beside it.
          # (rsv_ = reservations. A clone is named reapply_0255_<label>_<run id>_<attempt>_<pid>, and a
          # database name ends at 63 bytes, so the labels stay short.)
          good_table="CREATE TABLE public.chat_turn_reservations (turn_id uuid NOT NULL DEFAULT gen_random_uuid(), user_id uuid NOT NULL, counted_day date NOT NULL, issued_at timestamptz NOT NULL DEFAULT now(), state text NOT NULL DEFAULT 'counted', audit_id uuid, answered_at timestamptz, refunded_at timestamptz, attempts smallint NOT NULL DEFAULT 0, attempt1_audit_id uuid, attempt2_audit_id uuid, attempted_at timestamptz, CONSTRAINT chat_turn_reservations_pkey PRIMARY KEY (turn_id), CONSTRAINT chat_turn_reservations_audit_id_key UNIQUE (audit_id), CONSTRAINT chat_turn_reservations_user_id_fkey FOREIGN KEY (user_id) REFERENCES public.users (id) ON DELETE CASCADE, CONSTRAINT chat_turn_reservations_state_check CHECK (state IN ('counted', 'answered', 'refunded')), CONSTRAINT chat_turn_reservations_answer_check CHECK ((state = 'counted') = (audit_id IS NULL)))"
          broken() { # <text to find in the good table> <text to put there> : the good table with one thing changed
            local changed="${good_table/"$1"/"$2"}"
