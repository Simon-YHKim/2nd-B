               OR ledger.sensitive_data_ack IS NOT TRUE
               OR ledger.safety_notice_ack IS NOT TRUE
               OR ledger.purposes IS DISTINCT FROM '["service"]'::jsonb
               OR ledger.optional_consents IS DISTINCT FROM '{"marketing":false}'::jsonb THEN
