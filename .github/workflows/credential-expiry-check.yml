name: Credential expiry check

# Why: several credentials this repo depends on expire on a date nobody watches,
# and the failure is silent. An expired iOS distribution cert or provisioning
# profile does not break CI, it breaks the next release. A revoked vendor key
# does not break the build, it turns one seat into a skip. This looks once a
# week and says so out loud.
#
# It never prints a secret value. It prints expiry dates and pass/fail only.
#
# Hardening 2026-08-18 (console session), after the first real run:
#   1. The report went only to $GITHUB_STEP_SUMMARY, so `gh run view --log`
#      showed nothing. You could not read the result without opening a browser.
#      It now goes to stdout as well.
#   2. An unparseable date was never checked. `date -d` failed, TS came out
#      empty, and `(( ( - NOW ) / 86400 ))` then evaluated to a large negative
#      number, so the row read `| Android keystore |  | -20683일 |` and ranked
#      as already expired. Measured, not guessed. That is a false alarm on a
#      blank date rather than a silent pass, but it sends someone chasing a
#      credential that may be fine. Dates are now validated as digits first.
#   3. A missing secret produced no line at all and no warning, so a deleted
#      credential looked exactly like a healthy one. This is the actual silent
#      gap. Missing inputs are now listed and warned on.

on:
  schedule:
    - cron: "0 0 * * 1" # 09:00 KST every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Certificates and keystores (hard expiry dates)
        id: certs
        env:
          IOS_P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ANDROID_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # A repo VARIABLE, not a secret: it is a date, and the key itself must
          # stay in Supabase secrets where the edge function reads it. Copying the
          # key here would widen its blast radius for no gain.
          PADDLE_EXPIRES_AT: ${{ vars.PADDLE_API_KEY_EXPIRES_AT }}
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)
          WARN_DAYS=45
          : > report.md
          worst=0

          note () { echo "$1" >> report.md; }
          bump () { [ "$1" -gt "$worst" ] && worst=$1; return 0; }

          # One place that turns a date string into a report line. Every caller
          # goes through this so no path can skip the validation.
          record () { # label, date-string
            local label=$1 end=$2 ts d
            if [ -z "$end" ]; then
              note "| $label | 읽기 실패 | 확인 필요 |"; bump 1; return 0
            fi
            ts=$(date -u -d "$end" +%s 2>/dev/null || true)
            case "$ts" in
              ''|*[!0-9]*)
                # Used to fall through to arithmetic on an empty TS and report
                # a blank date with a nonsense day count.
                note "| $label | 날짜 해석 실패 | 확인 필요 |"; bump 1; return 0 ;;
            esac
            d=$(( ( ts - NOW ) / 86400 ))
            if   [ "$d" -lt 0 ];           then bump 2
            elif [ "$d" -le "$WARN_DAYS" ]; then bump 1
            fi
            note "| $label | $(date -u -d "$end" +%Y-%m-%d) | ${d}일 |"
          }

          if [ -n "${IOS_P12:-}" ]; then
            echo "$IOS_P12" | base64 -d > dist.p12 2>/dev/null || true
            END=$(openssl pkcs12 -in dist.p12 -passin pass:"${IOS_P12_PW:-}" -nokeys -clcerts -legacy 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
            record "iOS distribution cert" "$END"
            rm -f dist.p12
          else
            note "| iOS distribution cert | 시크릿 없음 | IOS_DIST_P12_BASE64 미설정 |"; bump 1
          fi

          if [ -n "${IOS_PROFILE:-}" ]; then
            echo "$IOS_PROFILE" | base64 -d > p.mobileprovision 2>/dev/null || true
            END=$(openssl smime -inform der -verify -noverify -in p.mobileprovision 2>/dev/null \
                  | python3 -c "import sys,plistlib;print(plistlib.loads(sys.stdin.buffer.read())['ExpirationDate'])" 2>/dev/null || true)
            record "iOS provisioning profile" "$END"
            rm -f p.mobileprovision
          else
            note "| iOS provisioning profile | 시크릿 없음 | IOS_PROVISIONING_PROFILE_BASE64 미설정 |"; bump 1
          fi

          if [ -n "${ANDROID_KS:-}" ]; then
            echo "$ANDROID_KS" | base64 -d > ks.jks 2>/dev/null || true
            END=$(keytool -list -v -keystore ks.jks -storepass "${ANDROID_KS_PW:-}" 2>/dev/null \
                  | grep -m1 "until:" | sed 's/.*until: //' || true)
            record "Android keystore" "$END"
            rm -f ks.jks
          else
            note "| Android keystore | 시크릿 없음 | ANDROID_KEYSTORE_BASE64 미설정 |"; bump 1
          fi


          # Dates we know but cannot probe. Paddle exposes no API-key expiry
          # endpoint, and that key lives in Supabase secrets rather than GitHub,
          # so nothing running here can read it. The date is transcribed by hand
          # from the Paddle dashboard (Developer Tools > Authentication >
          # Edit API key > Expires at).
          #
          # WARNING, and the reason for the Variable: a transcribed date is only
          # as true as its last edit. Held in this file, keeping it current means
          # remembering to open a PR at the exact moment somebody is busy
          # rotating a credential - which is when nobody opens a PR. So the
          # authoritative value is a repo Variable and a rotation is one command:
          #
          #   gh variable set PADDLE_API_KEY_EXPIRES_AT --body 2027-05-01
          #
          # UNSET IS NOT UNKNOWN. The literal below is the date read from the
          # dashboard on 2026-08-19, and it is still used when the Variable is
          # missing, so the check keeps a real deadline instead of raising a
          # false alarm about a key that is fine. What the missing Variable DOES
          # do is warn: "nobody has recorded this where it can be kept current"
          # must not look identical to a healthy row. That is the same silent
          # gap the 2026-08-18 hardening closed for missing secrets, in a
          # different shape - a credential nobody is tracking looked exactly
          # like a credential in good standing.
          #
          # Written as plain record calls on purpose: a heredoc here would put
          # its body at column 0, which ends the YAML block scalar and breaks
          # the workflow file. That was caught by yaml.safe_load, not by CI.
          PADDLE_TRANSCRIBED="2026-11-08"
          if [ -n "${PADDLE_EXPIRES_AT:-}" ]; then
            record "PADDLE_API_KEY (2nd-B subscription-manage)" "$PADDLE_EXPIRES_AT"
          else
            record "PADDLE_API_KEY (2nd-B subscription-manage, 파일 전사값)" "$PADDLE_TRANSCRIBED"
            note "| ㄴ PADDLE_API_KEY_EXPIRES_AT | 미설정 | 회전하면 조용히 낡는다: gh variable set PADDLE_API_KEY_EXPIRES_AT --body YYYY-MM-DD |"
            bump 1
          fi

          echo "worst=$worst" >> "$GITHUB_OUTPUT"

      - name: Vendor keys and tokens (liveness, not expiry)
        id: keys
        env:
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          SUPA: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPO: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -uo pipefail
          : > keys.md
          bad=0
          probe () { # name, http_code
            if [ "$2" = "200" ]; then echo "| $1 | 살아있음 | |" >> keys.md
            elif [ "$2" = "SKIP" ]; then echo "| $1 | 미설정 | 해당 좌석은 skip 된다 |" >> keys.md
            else echo "| $1 | **실패 (HTTP $2)** | 확인 필요 |" >> keys.md; bad=1
            fi
          }

          if [ -n "${OPENAI:-}" ]; then
            C=$(curl -s -o /dev/null -w '%{http_code}' https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI")
            probe "OPENAI_API_KEY" "$C"
          else probe "OPENAI_API_KEY" "SKIP"; fi

          if [ -n "${ANTHROPIC:-}" ]; then
            C=$(curl -s -o /dev/null -w '%{http_code}' https://api.anthropic.com/v1/models -H "x-api-key: $ANTHROPIC" -H "anthropic-version: 2023-06-01")
            probe "ANTHROPIC_API_KEY" "$C"
          else probe "ANTHROPIC_API_KEY" "SKIP"; fi

          if [ -n "${GEMINI:-}" ]; then
            C=$(curl -s -o /dev/null -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models" -H "x-goog-api-key: $GEMINI")
            probe "GEMINI_API_KEY" "$C"
          else probe "GEMINI_API_KEY" "SKIP"; fi

          if [ -n "${SUPA:-}" ]; then
            C=$(curl -s -o /dev/null -w '%{http_code}' https://api.supabase.com/v1/projects -H "Authorization: Bearer $SUPA")
            probe "SUPABASE_ACCESS_TOKEN" "$C"
          else probe "SUPABASE_ACCESS_TOKEN" "SKIP"; fi

          if [ -n "${EXPO:-}" ]; then
            C=$(curl -s -o /dev/null -w '%{http_code}' https://api.expo.dev/v2/auth/userInfo -H "Authorization: Bearer $EXPO")
            probe "EXPO_TOKEN" "$C"
          else probe "EXPO_TOKEN" "SKIP"; fi

          echo "bad=$bad" >> "$GITHUB_OUTPUT"

      - name: Write the summary
        run: |
          set -uo pipefail
          {
            echo "# 자격증명 점검 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            echo ""
            echo "## 만료일이 있는 것"
            echo ""
            echo "| 항목 | 만료일 | 남은 기간 |"
            echo "|---|---|---|"
            cat report.md 2>/dev/null || echo "| (없음) | | |"
            echo ""
            echo "## 살아있는지만 확인 가능한 것"
            echo ""
            echo "| 항목 | 상태 | 비고 |"
            echo "|---|---|---|"
            cat keys.md 2>/dev/null || echo "| (없음) | | |"
            echo ""
            echo "45일 이내 만료 또는 인증 실패가 있으면 이슈가 열린다."
          } | tee summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          # The trailing tee leaves the report on stdout too, so the whole thing
          # is readable with `gh run view <id> --log` without opening a browser.

      - name: Open an issue when something needs a human
        if: steps.certs.outputs.worst != '0' || steps.keys.outputs.bad != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="자격증명 만료/실패 점검: 조치 필요"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file summary.md
          else
            gh issue create --title "$TITLE" --body-file summary.md --label ops || \
            gh issue create --title "$TITLE" --body-file summary.md
          fi
