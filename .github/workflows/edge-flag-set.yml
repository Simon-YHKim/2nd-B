name: Set an edge-function flag

# Only the two non-secret billing switches below can be changed. Production
# must own the PRODUCTION_SUPABASE_* secrets; approval and a shared mutation
# lane serialize this with deploys.

on:
  workflow_dispatch:
    inputs:
      flag:
        description: Which flag to set (non-secret switches only)
        required: true
        type: choice
        options:
          - PADDLE_SELF_SERVICE_ENABLED
          - PADDLE_SELF_SERVICE_DRYRUN
      value:
        description: 1 = on, 0 = off
        required: true
        type: choice
        options:
          - "1"
          - "0"
      reason:
        description: One line, for the run log. Why now?
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-mutations
  cancel-in-progress: false

jobs:
  set:
    if: ${{ github.repository == 'Simon-YHKim/2nd-B' && github.ref == 'refs/heads/main' }}
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Gate current origin/main
        id: main_gate
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REPOSITORY" != "Simon-YHKim/2nd-B" ] || [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error title=Edge flag gate::trusted-main-ref-required"
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error title=Edge flag gate::remote-main-fetch-failed"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error title=Edge flag gate::checkout-is-not-current-remote-main"
            exit 1
          fi
          echo "main_sha=$REMOTE_MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate production credentials
        env:
          TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=Edge flag gate::access-token-required"
            exit 1
          fi
          if ! [[ "${PROJECT_REF:-}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error title=Edge flag gate::invalid-project-ref"
            exit 1
          fi

      - name: Re-check the non-secret allowlist
        id: input_gate
        env:
          FLAG: ${{ inputs.flag }}
          VALUE: ${{ inputs.value }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          case "$FLAG" in
            PADDLE_SELF_SERVICE_ENABLED|PADDLE_SELF_SERVICE_DRYRUN) ;;
            *)
              echo "::error title=Edge flag gate::flag-not-allowlisted"
              exit 1
              ;;
          esac
          case "$VALUE" in
            0|1) ;;
            *)
              echo "::error title=Edge flag gate::value-must-be-zero-or-one"
              exit 1
              ;;
          esac
          if [ -z "$REASON" ] || [ ${#REASON} -gt 200 ] || \
             [[ "$REASON" == *$'\n'* ]] || [[ "$REASON" == *$'\r'* ]] || \
             printf '%s' "$REASON" | LC_ALL=C grep -q '[[:cntrl:]]'; then
            echo "::error title=Edge flag gate::reason-must-be-one-bounded-line"
            exit 1
          fi
          {
            echo "flag=$FLAG"
            echo "value=$VALUE"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: "2.116.0"

      - name: Recheck main and set the validated flag
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          FLAG: ${{ steps.input_gate.outputs.flag }}
          VALUE: ${{ steps.input_gate.outputs.value }}
          MAIN_SHA: ${{ steps.main_gate.outputs.main_sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error title=Edge flag gate::remote-main-recheck-failed"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$MAIN_SHA" ] || \
             [ "$(git rev-parse refs/remotes/origin/main)" != "$MAIN_SHA" ]; then
            echo "::error title=Edge flag gate::main-advanced-before-mutation"
            exit 1
          fi
          supabase secrets set "$FLAG=$VALUE" --project-ref "$PROJECT_REF"

      # The repository is public. The listing holds every production secret
      # name and digest, so it goes to a runner temp file, is never printed,
      # and only the selected flag's digest is compared.
      - name: Verify selected flag after mutation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          FLAG: ${{ steps.input_gate.outputs.flag }}
          VALUE: ${{ steps.input_gate.outputs.value }}
        run: |
          set -euo pipefail
          CATALOG="$RUNNER_TEMP/edge-flag-after.json"
          trap 'rm -f "$CATALOG"' EXIT
          supabase secrets list --project-ref "$PROJECT_REF" --output json > "$CATALOG"
          CATALOG="$CATALOG" node <<'NODE'
          const fs = require("node:fs");
          const { createHash } = require("node:crypto");

          const fail = (message) => {
            process.stderr.write(`::error title=Edge flag postflight::${message}\n`);
            process.exit(1);
          };

          let catalog;
          try {
            catalog = JSON.parse(fs.readFileSync(process.env.CATALOG, "utf8"));
          } catch {
            fail("secret-catalog-json-required");
          }

          if (!Array.isArray(catalog)) fail("secret-catalog-array-required");
          const matches = catalog.filter((item) => item?.name === process.env.FLAG);
          if (matches.length !== 1 || typeof matches[0].value !== "string") {
            fail("selected-flag-returned-once-required");
          }
          const actual = matches[0].value.toLowerCase().replace(/^sha256:/, "");
          const expected = createHash("sha256").update(process.env.VALUE ?? "").digest("hex");
          if (actual !== expected) fail("selected-flag-digest-mismatch");
          NODE
          echo "Selected edge flag verified."
