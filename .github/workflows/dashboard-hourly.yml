name: Dashboard hourly generation
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-hourly
  cancel-in-progress: false
jobs:
  generate:
    if: vars.DASHBOARD_RETENTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate current local slots and expire old caches
        env:
          DASHBOARD_RETENTION_ENABLED: 'true'
          DASHBOARD_GENERATION_ENABLED: ${{ vars.DASHBOARD_GENERATION_ENABLED }}
          DASHBOARD_SUPABASE_URL: ${{ vars.DASHBOARD_SUPABASE_URL }}
          DASHBOARD_SERVICE_ROLE_KEY: ${{ secrets.DASHBOARD_SERVICE_ROLE_KEY }}
          DASHBOARD_CRON_SECRET: ${{ secrets.DASHBOARD_CRON_SECRET }}
        run: node scripts/run-dashboard-hourly.mjs
