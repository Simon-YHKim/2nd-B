name: GitHub Release (APK + AAB + IPA)

# Creates one immutable draft release from three already-finished EAS builds.
# It never starts a paid build and never deletes/replaces a tag, release, or
# asset. A rerun is accepted only when the tag target and all four assets are
# byte-for-byte identical.
# Production must provide RELEASE_APP_CLIENT_ID as an environment variable and
# RELEASE_APP_PRIVATE_KEY as an environment secret. The installed GitHub App is
# limited to this repository with Contents: write and Workflows: write.

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: "Full main commit SHA used by all three finished EAS builds"
        required: true
        type: string
      profile:
        description: "Release contract (paired APK + AAB + IPA only)"
        required: true
        type: choice
        options:
          - paired
        default: paired
      preview_build_id:
        description: "Finished EAS preview build id (APK)"
        required: true
        type: string
      production_build_id:
        description: "Finished EAS production build id (AAB)"
        required: true
        type: string
      ios_build_id:
        description: "Finished EAS production iOS build id (IPA)"
        required: true
        type: string
      prerelease:
        description: "Mark the draft release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The version tag is read from the checked-out app.json, so serialize every
  # release mutation for this repository instead of allowing two SHAs to race
  # for the same tag.
  group: github-release-${{ github.repository }}
  cancel-in-progress: false

env:
  EAS_CLI_VERSION: "22.6.0"
  BUNDLETOOL_VERSION: "1.18.3"
  BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
  APPLE_TEAM_ID: "7CP84WS5C6"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17 for bundletool
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Require the release commit to be an exact main ancestor
        env:
          RELEASE_PROFILE: ${{ inputs.profile }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_PROFILE" != paired ]; then
            echo "::error::Only the paired APK + AAB + IPA release contract is supported."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::The release workflow must be dispatched from refs/heads/main."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_COMMIT" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "::error::release_commit must be a full 40-character Git SHA."
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT,,}" ]; then
            echo "::error::The checkout does not match release_commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "::error::release_commit is not an ancestor of the current origin/main."
            exit 1
          fi

      - name: Materialize the release state helper from the workflow commit
        env:
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TOOLING_COMMIT" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "::error::The workflow tooling commit is not a full Git SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TOOLING_COMMIT" origin/main; then
            echo "::error::The workflow tooling commit is not on current origin/main."
            exit 1
          fi
          tooling_dir="$GITHUB_WORKSPACE/.release-tooling"
          mkdir -p "$tooling_dir"
          helper="$tooling_dir/github-release-state.js"
          apk_verifier="$tooling_dir/check-apk-target-sdk.js"
          signature_verifier="$tooling_dir/check-android-release-signatures.js"
          git show "${TOOLING_COMMIT}:scripts/github-release-state.js" > "$helper"
          git show "${TOOLING_COMMIT}:scripts/check-apk-target-sdk.js" > "$apk_verifier"
          git show "${TOOLING_COMMIT}:scripts/check-android-release-signatures.js" > "$signature_verifier"
          for script in "$helper" "$apk_verifier" "$signature_verifier"; do
            test -s "$script"
            node --check "$script"
          done
          {
            printf 'RELEASE_STATE_HELPER=%s\n' "$helper"
            printf 'APK_VERIFIER=%s\n' "$apk_verifier"
            printf 'SIGNATURE_VERIFIER=%s\n' "$signature_verifier"
          } >> "$GITHUB_ENV"

      - name: Require protected release app configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_APP_CLIENT_ID:-}" ] || [ -z "${RELEASE_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::Protected Production release app configuration is missing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Self-test Android artifact verifier
        run: node "$APK_VERIFIER" --self-test

      - name: Verify OTA/native runtime policy
        run: npm run check:ota-runtime

      - name: Install pinned bundletool verifier
        run: |
          set -euo pipefail
          JAR="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$JAR"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$JAR" | sha256sum --check --strict
          echo "BUNDLETOOL_JAR=$JAR" >> "$GITHUB_ENV"
          java -jar "$JAR" version

      - name: Get the build artifacts, validate provenance, and download all three
        id: artifacts
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PREVIEW_BUILD_ID: ${{ inputs.preview_build_id }}
          PRODUCTION_BUILD_ID: ${{ inputs.production_build_id }}
          IOS_BUILD_ID: ${{ inputs.ios_build_id }}
          EXPECTED_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN is required to verify EAS build metadata."
            exit 1
          fi
          for id in "$PREVIEW_BUILD_ID" "$PRODUCTION_BUILD_ID" "$IOS_BUILD_ID"; do
            if ! printf '%s' "$id" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
              echo "::error::Malformed EAS build id."
              exit 1
            fi
          done

          PREVIEW_JSON="$RUNNER_TEMP/eas-preview.json"
          PRODUCTION_JSON="$RUNNER_TEMP/eas-production.json"
          IOS_JSON="$RUNNER_TEMP/eas-ios.json"
          # This workflow only reuses finished builds; no new build started.
          for SPEC in \
            "preview|$PREVIEW_BUILD_ID|$PREVIEW_JSON" \
            "production|$PRODUCTION_BUILD_ID|$PRODUCTION_JSON" \
            "ios|$IOS_BUILD_ID|$IOS_JSON"; do
            IFS='|' read -r ROLE REUSE_BUILD_ID OUTPUT_JSON <<< "$SPEC"
            echo "Inspecting existing $ROLE EAS build metadata."
            npx --yes "eas-cli@$EAS_CLI_VERSION" build:view "$REUSE_BUILD_ID" --json > "$OUTPUT_JSON"
          done

          node - "$PREVIEW_JSON" "$PRODUCTION_JSON" "$IOS_JSON" "$RUNNER_TEMP/validated-builds.json" <<'NODE'
          const fs = require("node:fs");
          const config = require("./app.json").expo;
          const [previewPath, productionPath, iosPath, outputPath] = process.argv.slice(2);
          const expectedCommit = process.env.EXPECTED_COMMIT.toLowerCase();
          const expectedProject = config.extra?.eas?.projectId;
          const query = `
            query BuildProvenance($buildId: ID!) {
              builds {
                byId(buildId: $buildId) {
                  id
                  isGitWorkingTreeDirty
                  gitCommitHash
                }
              }
            }
          `;
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchBuildProvenance(buildId, profile) {
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 15_000);
              try {
                const response = await fetch("https://api.expo.dev/graphql", {
                  method: "POST",
                  headers: {
                    authorization: `Bearer ${process.env.EXPO_TOKEN}`,
                    "content-type": "application/json",
                  },
                  body: JSON.stringify({ query, variables: { buildId } }),
                  signal: controller.signal,
                });
                if (!response.ok) throw new Error("http");
                let payload;
                try {
                  payload = await response.json();
                } catch {
                  throw new Error("json");
                }
                if (
                  payload?.errors !== undefined &&
                  (!Array.isArray(payload.errors) || payload.errors.length > 0)
                ) {
                  throw new Error("graphql");
                }
                const build = payload?.data?.builds?.byId;
                if (!build) throw new Error("missing");
                return build;
              } catch {
                if (attempt === 3) {
                  throw new Error(`${profile} build rejected: authenticated Expo GraphQL provenance is unavailable`);
                }
                await wait(attempt * 1_000);
              } finally {
                clearTimeout(timer);
              }
            }
            throw new Error(`${profile} build rejected: authenticated Expo GraphQL provenance is unavailable`);
          }

          function validateCliMetadata(path, role, profile, expectedId, expectedPlatform, expectedIdentifier) {
            const value = JSON.parse(fs.readFileSync(path, "utf8"));
            const build = Array.isArray(value) ? value[0] : value;
            const fail = (message) => { throw new Error(`${role} build rejected: ${message}`); };
            const project = build?.app ?? build?.project;
            if (String(build?.id).toLowerCase() !== expectedId.toLowerCase()) fail("returned id differs from requested id");
            if (project?.id !== expectedProject) fail("EAS project id mismatch");
            if (project?.slug !== config.slug) fail("EAS project slug mismatch");
            if (project?.ownerAccount?.name !== config.owner) fail("EAS owner mismatch");
            if (String(build?.platform).toUpperCase() !== expectedPlatform) fail(`platform is not ${expectedPlatform}`);
            if (expectedPlatform === "IOS" && build?.isForIosSimulator === true) fail("iOS build targets a simulator");
            const status = String(build?.status).toUpperCase();
            if (status !== "FINISHED") fail(`status is ${build?.status || "missing"}`);
            if (build?.buildProfile !== profile) fail(`profile is ${build?.buildProfile || "missing"}`);
            if (build?.appIdentifier !== expectedIdentifier) fail("application identifier mismatch");
            if (!build?.appVersion || build.appVersion !== config.version) fail("appVersion does not match app.json");
            if (!/^[1-9][0-9]*$/.test(String(build?.appBuildVersion || ""))) fail("remote build version is missing or invalid");
            const expectedChannel = profile === "preview" ? "preview" : "production";
            const channel = build?.updateChannel?.name ?? build?.channel ?? null;
            if (channel !== expectedChannel) fail(`channel is ${channel || "missing"}, expected ${expectedChannel}`);
            const runtimeVersion = String(build?.runtime?.version ?? build?.runtimeVersion ?? "").toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(runtimeVersion)) fail("runtimeVersion is not a fingerprint hash");
            const artifactUrl = build?.artifacts?.applicationArchiveUrl ?? build?.artifacts?.buildUrl;
            let parsed;
            try { parsed = new URL(artifactUrl); } catch { fail("reports no artifact URL or the URL is invalid"); }
            if (parsed.protocol !== "https:") fail("artifact URL is not HTTPS");
            if (expectedPlatform === "IOS" && !parsed.pathname.toLowerCase().endsWith(".ipa")) {
              fail("artifact URL does not identify an IPA");
            }
            return {
              id: build.id,
              role,
              profile,
              appVersion: build.appVersion,
              appBuildVersion: String(build.appBuildVersion),
              appIdentifier: build.appIdentifier,
              runtimeVersion,
              channel,
              artifactUrl,
            };
          }

          function validateProvenance(provenance, profile, expectedId) {
            const fail = (message) => { throw new Error(`${profile} build rejected: ${message}`); };
            if (String(provenance?.id).toLowerCase() !== expectedId.toLowerCase()) {
              fail("authenticated build id mismatch");
            }
            if (provenance?.isGitWorkingTreeDirty !== false) {
              fail("authenticated source working tree was dirty or provenance is missing");
            }
            const gitCommitHash = String(provenance?.gitCommitHash || "").toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(gitCommitHash) || gitCommitHash !== expectedCommit) {
              fail("authenticated git commit mismatch");
            }
            return gitCommitHash;
          }

          async function main() {
            const preview = validateCliMetadata(
              previewPath, "preview", "preview", process.env.PREVIEW_BUILD_ID,
              "ANDROID", config.android?.package,
            );
            const production = validateCliMetadata(
              productionPath, "production", "production", process.env.PRODUCTION_BUILD_ID,
              "ANDROID", config.android?.package,
            );
            const ios = validateCliMetadata(
              iosPath, "ios", "production", process.env.IOS_BUILD_ID,
              "IOS", config.ios?.bundleIdentifier,
            );
            const [previewProvenance, productionProvenance, iosProvenance] = await Promise.all([
              fetchBuildProvenance(process.env.PREVIEW_BUILD_ID, "preview"),
              fetchBuildProvenance(process.env.PRODUCTION_BUILD_ID, "production"),
              fetchBuildProvenance(process.env.IOS_BUILD_ID, "ios"),
            ]);
            preview.gitCommitHash = validateProvenance(previewProvenance, "preview", process.env.PREVIEW_BUILD_ID);
            production.gitCommitHash = validateProvenance(productionProvenance, "production", process.env.PRODUCTION_BUILD_ID);
            ios.gitCommitHash = validateProvenance(iosProvenance, "ios", process.env.IOS_BUILD_ID);
            if (preview.appVersion !== production.appVersion) throw new Error("APK and AAB appVersion values differ");
            if (preview.appVersion !== ios.appVersion) throw new Error("Android and iOS appVersion values differ");
            fs.writeFileSync(outputPath, JSON.stringify({ preview, production, ios }));
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

          VERSION="$(node -p "require('$RUNNER_TEMP/validated-builds.json').preview.appVersion")"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Remote appVersion cannot safely form a release tag."
            exit 1
          fi
          PREVIEW_CODE="$(node -p "require('$RUNNER_TEMP/validated-builds.json').preview.appBuildVersion")"
          PRODUCTION_CODE="$(node -p "require('$RUNNER_TEMP/validated-builds.json').production.appBuildVersion")"
          IOS_BUILD_NUMBER="$(node -p "require('$RUNNER_TEMP/validated-builds.json').ios.appBuildVersion")"
          PREVIEW_URL="$(node -p "require('$RUNNER_TEMP/validated-builds.json').preview.artifactUrl")"
          PRODUCTION_URL="$(node -p "require('$RUNNER_TEMP/validated-builds.json').production.artifactUrl")"
          IOS_URL="$(node -p "require('$RUNNER_TEMP/validated-builds.json').ios.artifactUrl")"
          PREVIEW_RUNTIME="$(node -p "require('$RUNNER_TEMP/validated-builds.json').preview.runtimeVersion")"
          PRODUCTION_RUNTIME="$(node -p "require('$RUNNER_TEMP/validated-builds.json').production.runtimeVersion")"
          IOS_RUNTIME="$(node -p "require('$RUNNER_TEMP/validated-builds.json').ios.runtimeVersion")"
          PREVIEW_CHANNEL="$(node -p "require('$RUNNER_TEMP/validated-builds.json').preview.channel")"
          PRODUCTION_CHANNEL="$(node -p "require('$RUNNER_TEMP/validated-builds.json').production.channel")"
          IOS_CHANNEL="$(node -p "require('$RUNNER_TEMP/validated-builds.json').ios.channel")"
          IOS_BUNDLE_ID="$(node -p "require('$RUNNER_TEMP/validated-builds.json').ios.appIdentifier")"
          SHORT_SHA="${EXPECTED_COMMIT:0:12}"
          PREVIEW_FILE="2nd-Brain-v$VERSION-preview-vc$PREVIEW_CODE-$SHORT_SHA.apk"
          PRODUCTION_FILE="2nd-Brain-v$VERSION-production-vc$PRODUCTION_CODE-$SHORT_SHA.aab"
          IOS_FILE="2nd-Brain-v$VERSION-production-build$IOS_BUILD_NUMBER-$SHORT_SHA.ipa"

          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 "$PREVIEW_URL" --output "$PREVIEW_FILE"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 "$PRODUCTION_URL" --output "$PRODUCTION_FILE"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 "$IOS_URL" --output "$IOS_FILE"
          for file in "$PREVIEW_FILE" "$PRODUCTION_FILE" "$IOS_FILE"; do
            SIZE="$(stat -c%s "$file")"
            if [ "$SIZE" -lt 1000000 ]; then
              echo "::error::$file is only $SIZE bytes."
              exit 1
            fi
            if ! unzip -tqq "$file"; then
              echo "::error::$file is not a zip container with valid entries."
              exit 1
            fi
          done

          # EAS authentication is finished. Do not expose its token to local
          # artifact parsers even though those parsers are pinned above.
          unset EXPO_TOKEN
          PREVIEW_META="$(node "$APK_VERIFIER" --json "$PREVIEW_FILE")"
          PRODUCTION_META="$(node "$APK_VERIFIER" --json "$PRODUCTION_FILE")"
          export PREVIEW_META PRODUCTION_META PREVIEW_CODE PRODUCTION_CODE VERSION
          node <<'NODE'
          for (const [role, raw, code] of [
            ["preview", process.env.PREVIEW_META, process.env.PREVIEW_CODE],
            ["production", process.env.PRODUCTION_META, process.env.PRODUCTION_CODE],
          ]) {
            const metadata = JSON.parse(raw);
            const expectedType = role === "preview" ? "apk" : "aab";
            if (metadata.type !== expectedType) throw new Error(`${role} artifact is not ${expectedType}`);
            if (String(metadata.versionCode) !== code) throw new Error(`${role} artifact versionCode differs from EAS metadata`);
            if (metadata.versionName !== process.env.VERSION) throw new Error(`${role} artifact versionName differs from EAS appVersion`);
            if (!metadata.billingLibrary) throw new Error(`${role} artifact has no verified Billing Library version`);
          }
          NODE

          export IOS_FILE VERSION IOS_BUILD_NUMBER IOS_BUNDLE_ID
          python3 <<'PY' > "$RUNNER_TEMP/ipa-info.json"
          import json
          import os
          import plistlib
          import re
          import stat
          import zipfile

          with zipfile.ZipFile(os.environ["IOS_FILE"]) as archive:
              names = archive.namelist()
              apps = {match.group(1) for name in names if (match := re.match(r"^(Payload/[^/]+\.app)/", name))}
              infos = [name for name in names if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)]
              profiles = [name for name in names if re.fullmatch(r"Payload/[^/]+\.app/embedded\.mobileprovision", name)]
              signatures = [name for name in names if re.fullmatch(r"Payload/[^/]+\.app/_CodeSignature/CodeResources", name)]
              if len(apps) != 1:
                  raise SystemExit(f"IPA contains {len(apps)} top-level app bundles")
              if len(infos) != 1:
                  raise SystemExit(f"IPA contains {len(infos)} top-level app Info.plist files")
              if len(profiles) != 1:
                  raise SystemExit(f"IPA contains {len(profiles)} embedded provisioning profiles")
              if len(signatures) != 1:
                  raise SystemExit(f"IPA contains {len(signatures)} top-level CodeResources signature manifests")
              app_root = next(iter(apps))
              if infos[0] != f"{app_root}/Info.plist" or profiles[0] != f"{app_root}/embedded.mobileprovision":
                  raise SystemExit("IPA identity files are not in the sole top-level app bundle")
              info = plistlib.loads(archive.read(infos[0]))
              expected = {
                  "CFBundleIdentifier": os.environ["IOS_BUNDLE_ID"],
                  "CFBundleShortVersionString": os.environ["VERSION"],
                  "CFBundleVersion": os.environ["IOS_BUILD_NUMBER"],
              }
              for key, value in expected.items():
                  if str(info.get(key, "")) != value:
                      raise SystemExit(f"IPA {key} mismatch")
              executable_name = str(info.get("CFBundleExecutable", ""))
              if not executable_name or "/" in executable_name:
                  raise SystemExit("IPA CFBundleExecutable is missing or unsafe")
              executable = f"{app_root}/{executable_name}"
              executable_info = archive.getinfo(executable)
              signature_info = archive.getinfo(signatures[0])
              if stat.S_ISLNK(executable_info.external_attr >> 16) or executable_info.file_size <= 0:
                  raise SystemExit("IPA app executable is empty")
              if stat.S_ISLNK(signature_info.external_attr >> 16) or archive.getinfo(signatures[0]).file_size <= 0:
                  raise SystemExit("IPA CodeResources signature manifest is empty")
              print(json.dumps({"profileEntry": profiles[0]}))
          PY
          PROFILE_ENTRY="$(node -p "require('$RUNNER_TEMP/ipa-info.json').profileEntry")"
          unzip -p "$IOS_FILE" "$PROFILE_ENTRY" > "$RUNNER_TEMP/embedded.mobileprovision"
          openssl smime -inform der -verify -noverify \
            -in "$RUNNER_TEMP/embedded.mobileprovision" \
            -out "$RUNNER_TEMP/embedded-profile.plist" 2> "$RUNNER_TEMP/embedded-profile.err"
          export EMBEDDED_PROFILE_PLIST="$RUNNER_TEMP/embedded-profile.plist"
          node <<'NODE'
          const fs = require("node:fs");
          const { X509Certificate } = require("node:crypto");
          const xml = fs.readFileSync(process.env.EMBEDDED_PROFILE_PLIST, "utf8");
          const value = (key, tag = "string") =>
            new RegExp(`<key>${key}<\\/key>\\s*<${tag}>([^<]+)<\\/${tag}>`).exec(xml)?.[1];
          const arrayValues = (key, tag = "string") => {
            const body = new RegExp(`<key>${key}<\\/key>\\s*<array>([\\s\\S]*?)<\\/array>`).exec(xml)?.[1] ?? "";
            return [...body.matchAll(new RegExp(`<${tag}>\\s*([\\s\\S]*?)\\s*<\\/${tag}>`, "g"))]
              .map((match) => match[1].replace(/\\s+/g, ""));
          };
          const applicationId = value("application-identifier");
          const teamId = value("com.apple.developer.team-identifier") ?? arrayValues("TeamIdentifier")[0];
          const expires = value("ExpirationDate", "date");
          const expectedAppId = `${process.env.APPLE_TEAM_ID}.${process.env.IOS_BUNDLE_ID}`;
          const getTaskAllowDenied = /<key>get-task-allow<\/key>\s*<false\s*\/>/.test(xml);
          const hasDevices = /<key>ProvisionedDevices<\/key>/.test(xml);
          const provisionsAllDevices = /<key>ProvisionsAllDevices<\/key>\s*<true\s*\/>/.test(xml);
          const aps = value("aps-environment");
          const certificates = arrayValues("DeveloperCertificates", "data");
          if (teamId !== process.env.APPLE_TEAM_ID || applicationId !== expectedAppId) {
            throw new Error("embedded IPA application-identifier or TeamIdentifier mismatch");
          }
          const now = Date.now();
          if (!expires || Date.parse(expires) - now < 14 * 24 * 60 * 60 * 1000) {
            throw new Error("embedded IPA provisioning profile expires in less than 14 days or is unreadable");
          }
          const normalizedExpires = new Date(expires).toISOString();
          if (!getTaskAllowDenied) throw new Error("embedded production IPA does not explicitly disable get-task-allow");
          if (hasDevices || provisionsAllDevices) throw new Error("embedded production IPA is not App Store distribution");
          if (aps && aps !== "production") throw new Error("embedded production IPA has a non-production push entitlement");
          if (certificates.length === 0) throw new Error("embedded production IPA has no DeveloperCertificates");
          const validCertificates = certificates.map((encoded) => {
            try {
              const certificate = Buffer.from(encoded, "base64");
              if (certificate.length < 256) return null;
              const parsedCertificate = new X509Certificate(certificate);
              const certificateSubjectHasTeam = parsedCertificate.subject
                .split(/\n/)
                .some((part) => part.trim() === `OU=${process.env.APPLE_TEAM_ID}`);
              if (
                !certificateSubjectHasTeam ||
                Date.parse(parsedCertificate.validFrom) > now ||
                Date.parse(parsedCertificate.validTo) <= now
              ) return null;
              return certificate;
            } catch {
              return null;
            }
          }).filter(Boolean);
          if (validCertificates.length === 0) {
            throw new Error("embedded production IPA has no currently valid canonical-team certificate");
          }
          const certificate = validCertificates[0];
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/embedded-distribution.der`, certificate);
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/ios-profile-summary.json`,
            JSON.stringify({ expires: normalizedExpires }),
          );
          NODE
          openssl x509 -inform der -in "$RUNNER_TEMP/embedded-distribution.der" -noout -checkend 0 \
            > "$RUNNER_TEMP/embedded-certificate.txt" 2>&1
          IOS_PROFILE_EXPIRES="$(node -p "require('$RUNNER_TEMP/ios-profile-summary.json').expires")"

          if ! java -jar "$BUNDLETOOL_JAR" validate --bundle="$PRODUCTION_FILE" \
            > "$RUNNER_TEMP/aab-bundletool-validation.txt" 2>&1; then
            echo "::error::Production AAB failed pinned bundletool validation."
            exit 1
          fi

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::The hosted runner exposes no Android SDK for APK signature verification."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::No executable apksigner was found in the hosted Android SDK."
            exit 1
          fi
          if ! "$APKSIGNER" verify --verbose --print-certs "$PREVIEW_FILE" \
            > "$RUNNER_TEMP/apk-signature.txt" 2>&1; then
            echo "::error::Preview APK signature verification failed."
            exit 1
          fi
          if ! jarsigner -J-Duser.language=en -J-Duser.country=US \
            -verify -verbose -certs "$PRODUCTION_FILE" \
            > "$RUNNER_TEMP/aab-signature.txt" 2>&1; then
            echo "::error::Production AAB JAR signature verification failed."
            exit 1
          fi
          if ! keytool -J-Duser.language=en -J-Duser.country=US \
            -printcert -jarfile "$PRODUCTION_FILE" \
            > "$RUNNER_TEMP/aab-certificate.txt" 2>&1; then
            echo "::error::Production AAB signer certificate could not be read."
            exit 1
          fi

          PREVIEW_HASH="$(sha256sum "$PREVIEW_FILE" | awk '{print $1}')"
          PRODUCTION_HASH="$(sha256sum "$PRODUCTION_FILE" | awk '{print $1}')"
          IOS_HASH="$(sha256sum "$IOS_FILE" | awk '{print $1}')"
          printf '%s  %s\n%s  %s\n%s  %s\n' \
            "$PREVIEW_HASH" "$PREVIEW_FILE" \
            "$PRODUCTION_HASH" "$PRODUCTION_FILE" \
            "$IOS_HASH" "$IOS_FILE" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

          {
            echo "tag=v$VERSION"
            echo "version=$VERSION"
            echo "preview_file=$PREVIEW_FILE"
            echo "production_file=$PRODUCTION_FILE"
            echo "ios_file=$IOS_FILE"
            echo "preview_code=$PREVIEW_CODE"
            echo "production_code=$PRODUCTION_CODE"
            echo "ios_build_number=$IOS_BUILD_NUMBER"
            echo "preview_hash=$PREVIEW_HASH"
            echo "production_hash=$PRODUCTION_HASH"
            echo "ios_hash=$IOS_HASH"
            echo "preview_runtime=$PREVIEW_RUNTIME"
            echo "production_runtime=$PRODUCTION_RUNTIME"
            echo "ios_runtime=$IOS_RUNTIME"
            echo "preview_channel=$PREVIEW_CHANNEL"
            echo "production_channel=$PRODUCTION_CHANNEL"
            echo "ios_channel=$IOS_CHANNEL"
            echo "ios_bundle_id=$IOS_BUNDLE_ID"
            echo "ios_profile_expires=$IOS_PROFILE_EXPIRES"
            echo "preview_meta=$PREVIEW_META"
            echo "production_meta=$PRODUCTION_META"
          } >> "$GITHUB_OUTPUT"

      - name: Verify protected Android signer identities
        env:
          ANDROID_APK_SIGNER_SHA256: ${{ secrets.ANDROID_APK_SIGNER_SHA256 }}
          ANDROID_AAB_SIGNER_SHA256: ${{ secrets.ANDROID_AAB_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          node "$SIGNATURE_VERIFIER" verify \
            "$RUNNER_TEMP/apk-signature.txt" \
            "$RUNNER_TEMP/aab-signature.txt" \
            "$RUNNER_TEMP/aab-certificate.txt" \
            "${{ steps.artifacts.outputs.production_file }}"

      - name: Extract release notes and append remote artifact metadata
        env:
          VERSION: ${{ steps.artifacts.outputs.version }}
          PREVIEW_CODE: ${{ steps.artifacts.outputs.preview_code }}
          PRODUCTION_CODE: ${{ steps.artifacts.outputs.production_code }}
          PREVIEW_HASH: ${{ steps.artifacts.outputs.preview_hash }}
          PRODUCTION_HASH: ${{ steps.artifacts.outputs.production_hash }}
          IOS_HASH: ${{ steps.artifacts.outputs.ios_hash }}
          PREVIEW_RUNTIME: ${{ steps.artifacts.outputs.preview_runtime }}
          PRODUCTION_RUNTIME: ${{ steps.artifacts.outputs.production_runtime }}
          IOS_RUNTIME: ${{ steps.artifacts.outputs.ios_runtime }}
          PREVIEW_CHANNEL: ${{ steps.artifacts.outputs.preview_channel }}
          PRODUCTION_CHANNEL: ${{ steps.artifacts.outputs.production_channel }}
          IOS_CHANNEL: ${{ steps.artifacts.outputs.ios_channel }}
          IOS_BUILD_NUMBER: ${{ steps.artifacts.outputs.ios_build_number }}
          IOS_BUNDLE_ID: ${{ steps.artifacts.outputs.ios_bundle_id }}
          IOS_PROFILE_EXPIRES: ${{ steps.artifacts.outputs.ios_profile_expires }}
          PREVIEW_META: ${{ steps.artifacts.outputs.preview_meta }}
          PRODUCTION_META: ${{ steps.artifacts.outputs.production_meta }}
          PREVIEW_BUILD_ID: ${{ inputs.preview_build_id }}
          PRODUCTION_BUILD_ID: ${{ inputs.production_build_id }}
          IOS_BUILD_ID: ${{ inputs.ios_build_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if awk -v v="## [$VERSION]" 'index($0, v) == 1 {found=1} END {exit !found}' CHANGELOG.md; then
            awk -v v="## [$VERSION]" '
              index($0, v) == 1 {inside=1; next}
              inside && /^## \[/ {exit}
              inside {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
          else
            printf 'Release %s\n' "$VERSION" > RELEASE_NOTES.md
          fi
          node <<'NODE' >> RELEASE_NOTES.md
          const p = JSON.parse(process.env.PREVIEW_META);
          const a = JSON.parse(process.env.PRODUCTION_META);
          console.log([
            "",
            "---",
            "",
            "## Verified artifacts",
            "",
            "The Preview APK installs directly on Android. The Production AAB cannot be installed directly and is intended for Google Play upload. The Production IPA is an App Store distribution archive for iOS.",
            "",
            "| Artifact | EAS build | Remote build | Channel / runtime | Identity / SDK | Verification | SHA-256 |",
            "|---|---|---:|---|---|---|---|",
            `| Preview APK | \`${process.env.PREVIEW_BUILD_ID}\` | versionCode \`${process.env.PREVIEW_CODE}\` | \`${process.env.PREVIEW_CHANNEL} / ${process.env.PREVIEW_RUNTIME}\` | SDK \`${p.minSdkVersion} / ${p.targetSdkVersion} / ${p.compileSdkVersion}\` | Billing \`${p.billingLibrary}\` | \`${process.env.PREVIEW_HASH}\` |`,
            `| Production AAB | \`${process.env.PRODUCTION_BUILD_ID}\` | versionCode \`${process.env.PRODUCTION_CODE}\` | \`${process.env.PRODUCTION_CHANNEL} / ${process.env.PRODUCTION_RUNTIME}\` | SDK \`${a.minSdkVersion} / ${a.targetSdkVersion} / ${a.compileSdkVersion}\` | Billing \`${a.billingLibrary}\` | \`${process.env.PRODUCTION_HASH}\` |`,
            `| Production IPA | \`${process.env.IOS_BUILD_ID}\` | buildNumber \`${process.env.IOS_BUILD_NUMBER}\` | \`${process.env.IOS_CHANNEL} / ${process.env.IOS_RUNTIME}\` | bundle \`${process.env.IOS_BUNDLE_ID}\` | App Store profile, expires \`${process.env.IOS_PROFILE_EXPIRES}\` | \`${process.env.IOS_HASH}\` |`,
            "",
            `Target commit: \`${process.env.RELEASE_COMMIT}\``,
            "",
            "This release remains a draft until its install/store checks are reviewed.",
          ].join("\n"));
          NODE

      # The Create Release API requires Workflows: write when target_commitish
      # differs from main under .github/workflows. GITHUB_TOKEN cannot receive
      # that permission, so mint one short-lived, single-repository app token
      # only after every artifact has already passed verification.
      - name: Mint a short-lived release app token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Resolve version and Create the GitHub Release once or verify exact idempotent rerun
        id: publish
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          TAG: ${{ steps.artifacts.outputs.tag }}
          VERSION: ${{ steps.artifacts.outputs.version }}
          PREVIEW_FILE: ${{ steps.artifacts.outputs.preview_file }}
          PRODUCTION_FILE: ${{ steps.artifacts.outputs.production_file }}
          IOS_FILE: ${{ steps.artifacts.outputs.ios_file }}
          PREVIEW_HASH: ${{ steps.artifacts.outputs.preview_hash }}
          PRODUCTION_HASH: ${{ steps.artifacts.outputs.production_hash }}
          IOS_HASH: ${{ steps.artifacts.outputs.ios_hash }}
          EXPECT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          RESOLVED_VERSION="$(node -p "require('./app.json').expo.version")"
          if [ "$RESOLVED_VERSION" != "$VERSION" ]; then
            echo "::error::Resolved app.json version differs from the verified artifacts."
            exit 1
          fi
          VERSION="$RESOLVED_VERSION"
          TAG="v$VERSION"
          grep -Fq "installs directly on Android" RELEASE_NOTES.md
          grep -Fq "cannot be installed directly" RELEASE_NOTES.md
          TAG_LINE="$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR==1 {print $1}')"
          PEELED_LINE="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR==1 {print $1}')"
          TAG_SHA="${PEELED_LINE:-$TAG_LINE}"
          discover_and_fetch_release() {
            local release_json="$1"
            local release_list_json="$release_json.list"
            local release_id
            FETCHED_RELEASE_ID=""
            : > "$release_json"
            # The list endpoint includes drafts while GET /releases/tags/{tag}
            # matches published releases only. Use the list solely to discover
            # one immutable ID, then read all trusted metadata by that ID.
            if ! gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > "$release_list_json" 2> "$RUNNER_TEMP/release-api.err"; then
              echo "::error::Could not determine whether the GitHub release exists."
              return 1
            fi
            if ! release_id="$(
              RELEASE_LIST_JSON="$release_list_json" TAG="$TAG" \
                node "$RELEASE_STATE_HELPER" select-id
            )"; then
              echo "::error::Could not select a unique GitHub release for $TAG."
              return 1
            fi
            if [ -z "$release_id" ]; then return 0; fi
            if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Discovered GitHub release ID is invalid."
              return 1
            fi
            if ! gh api --method GET \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              > "$release_json" 2> "$RUNNER_TEMP/release-id-api.err"; then
              echo "::error::Could not read GitHub release ID $release_id."
              return 1
            fi
            RELEASE_JSON="$release_json" RELEASE_ID="$release_id" TAG="$TAG" \
              node "$RELEASE_STATE_HELPER" assert-identity
            FETCHED_RELEASE_ID="$release_id"
          }

          verify_release_metadata() {
            local release_json="$1"
            local release_id="$2"
            RELEASE_JSON="$release_json" RELEASE_ID="$release_id" TAG="$TAG" \
              node "$RELEASE_STATE_HELPER" verify
          }

          download_release_asset() {
            local release_json="$1"
            local asset_name="$2"
            local output_path="$3"
            local asset_id
            asset_id="$(
              RELEASE_JSON="$release_json" ASSET_NAME="$asset_name" node <<'NODE'
          const release = require(process.env.RELEASE_JSON);
          const matches = (release.assets || []).filter((asset) => asset.name === process.env.ASSET_NAME);
          if (matches.length !== 1) throw new Error(`asset match count differs: ${matches.length}`);
          const assetId = matches[0].id;
          if (!Number.isSafeInteger(assetId) || assetId <= 0) throw new Error("asset id is invalid");
          process.stdout.write(String(assetId));
          NODE
            )"
            if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not resolve a trusted asset id for $asset_name."
              return 1
            fi
            gh api --method GET -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$output_path"
          }

          verify_release_assets() {
            local release_json="$1"
            local download_dir
            download_dir="$(mktemp -d)"
            download_release_asset "$release_json" "$PREVIEW_FILE" "$download_dir/$PREVIEW_FILE"
            download_release_asset "$release_json" "$PRODUCTION_FILE" "$download_dir/$PRODUCTION_FILE"
            download_release_asset "$release_json" "$IOS_FILE" "$download_dir/$IOS_FILE"
            download_release_asset "$release_json" "SHA256SUMS.txt" "$download_dir/SHA256SUMS.txt"
            test "$(sha256sum "$download_dir/$PREVIEW_FILE" | awk '{print $1}')" = "$PREVIEW_HASH"
            test "$(sha256sum "$download_dir/$PRODUCTION_FILE" | awk '{print $1}')" = "$PRODUCTION_HASH"
            test "$(sha256sum "$download_dir/$IOS_FILE" | awk '{print $1}')" = "$IOS_HASH"
            cmp --silent SHA256SUMS.txt "$download_dir/SHA256SUMS.txt"
            local body
            body="$(RELEASE_JSON="$release_json" node -p "require(process.env.RELEASE_JSON).body || ''")"
            printf '%s' "$body" | grep -Fq "$PREVIEW_HASH"
            printf '%s' "$body" | grep -Fq "$PRODUCTION_HASH"
            printf '%s' "$body" | grep -Fq "$IOS_HASH"
          }

          final_recheck() {
            local expected_release_id="$1"
            local original_release_json="$2"
            local fresh_release_json="$3"
            local final_tag_line final_peeled_line final_tag_sha
            discover_and_fetch_release "$fresh_release_json"
            if [ "$FETCHED_RELEASE_ID" != "$expected_release_id" ]; then
              echo "::error::The final release ID differs from the verified draft."
              return 1
            fi
            verify_release_metadata "$fresh_release_json" "$expected_release_id"
            EXPECTED_RELEASE_JSON="$original_release_json" RELEASE_JSON="$fresh_release_json" \
              node "$RELEASE_STATE_HELPER" assert-assets-unchanged
            final_tag_line="$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR==1 {print $1}')"
            final_peeled_line="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR==1 {print $1}')"
            final_tag_sha="${final_peeled_line:-$final_tag_line}"
            if [ -n "$final_tag_sha" ]; then
              echo "::error::Tag $TAG appeared before the immutable draft verification completed."
              return 1
            fi
            FINAL_RELEASE_JSON="$fresh_release_json"
          }

          RELEASE_JSON="$RUNNER_TEMP/existing-release.json"
          discover_and_fetch_release "$RELEASE_JSON"
          RELEASE_ID="$FETCHED_RELEASE_ID"
          if [ -n "$RELEASE_ID" ]; then RELEASE_EXISTS=true; else RELEASE_EXISTS=false; fi
          if [ -n "$TAG_SHA" ]; then TAG_EXISTS=true; else TAG_EXISTS=false; fi

          # A normal draft has no ref. Encode every tag/release combination so
          # no future edit can accidentally treat a partial state as creatable.
          RELEASE_STATE="$(
            TAG_EXISTS="$TAG_EXISTS" RELEASE_EXISTS="$RELEASE_EXISTS" \
              node "$RELEASE_STATE_HELPER" state
          )"

          if [ "$RELEASE_STATE" = verify-existing ]; then
            verify_release_metadata "$RELEASE_JSON" "$RELEASE_ID"
            verify_release_assets "$RELEASE_JSON"
            FINAL_EXISTING_RELEASE_JSON="$RUNNER_TEMP/final-existing-release.json"
            final_recheck "$RELEASE_ID" "$RELEASE_JSON" "$FINAL_EXISTING_RELEASE_JSON"
            RESULT=verified-existing
            echo "result=$RESULT" >> "$GITHUB_OUTPUT"
            echo "Exact immutable draft rerun verified; no GitHub state changed."
          else
            # RELEASE_NOTES.md is authoritative; --generate-notes is deliberately
            # not executed because generated text would make an exact rerun mutable.
            ARGS=(release create "$TAG" "$PREVIEW_FILE" "$PRODUCTION_FILE" "$IOS_FILE" SHA256SUMS.txt
                  --title "2nd-Brain $VERSION" --target "$RELEASE_COMMIT" --draft
                  --notes-file RELEASE_NOTES.md)
            if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
            # One create invocation receives every asset. A failed partial create
            # is never repaired by replacement: the next run detects mismatch.
            if ! git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
              echo "::error::Could not refresh origin/main immediately before GitHub Release creation."
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT,,}" ]; then
              echo "::error::The release checkout changed before GitHub Release creation."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
              echo "::error::release_commit is no longer on origin/main; no tag or draft was created."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$WORKFLOW_COMMIT" origin/main; then
              echo "::error::The dispatched workflow commit is no longer on origin/main."
              exit 1
            fi
            gh "${ARGS[@]}"
            RESULT=created-draft
            # A draft release has NO tag. GitHub creates the ref only when the
            # draft is published, so requiring one here could never pass: the
            # v0.7.0 release (2026-09-07) died on exactly this line after the
            # draft and all four assets had been created correctly.
            #
            # What binds the release to the commit while it is still a draft is
            # target_commitish, and the shared verifier below asserts it equals
            # RELEASE_COMMIT. Any tag appearing here is an external-state race,
            # so the workflow fails closed rather than interpreting it.
            CREATED_TAG_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR==1 {print $1}')"
            CREATED_PEELED_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR==1 {print $1}')"
            CREATED_TAG_SHA="${CREATED_PEELED_SHA:-$CREATED_TAG_SHA}"
            if [ -n "$CREATED_TAG_SHA" ]; then
              echo "::error::Draft creation unexpectedly produced or raced with tag $TAG."
              exit 1
            fi
            CREATED_RELEASE_JSON="$RUNNER_TEMP/created-release.json"
            discover_and_fetch_release "$CREATED_RELEASE_JSON"
            CREATED_RELEASE_ID="$FETCHED_RELEASE_ID"
            if [ -z "$CREATED_RELEASE_ID" ]; then
              echo "::error::The draft release for $TAG was created but could not be read back."
              exit 1
            fi
            verify_release_metadata "$CREATED_RELEASE_JSON" "$CREATED_RELEASE_ID"
            verify_release_assets "$CREATED_RELEASE_JSON"
            FINAL_CREATED_RELEASE_JSON="$RUNNER_TEMP/final-created-release.json"
            final_recheck "$CREATED_RELEASE_ID" "$CREATED_RELEASE_JSON" "$FINAL_CREATED_RELEASE_JSON"
            echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          fi

          URL="$(RELEASE_JSON="$FINAL_RELEASE_JSON" node -p "require(process.env.RELEASE_JSON).html_url")"
          {
            echo "### GitHub draft release"
            echo
            echo "- Result: \`$RESULT\`"
            echo "- Tag: \`$TAG\` at \`$RELEASE_COMMIT\`"
            echo "- Preview APK: \`$PREVIEW_FILE\`"
            echo "- Production AAB: \`$PRODUCTION_FILE\`"
            echo "- Production IPA: \`$IOS_FILE\`"
            echo "- $URL"
          } >> "$GITHUB_STEP_SUMMARY"
