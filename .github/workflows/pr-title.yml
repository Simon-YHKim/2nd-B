name: PR title (Conventional Commits)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Least privilege: this workflow only reads the repo (checkout + local tooling).
# It never uses GITHUB_TOKEN to write, so it does not inherit the repository's
# default token scope. Audited 2026-09-06 (C-22): ci.yml, pr-title.yml and
# supabase-dry-run.yml were the three workflows with no permissions block.
permissions:
  contents: read

# Same rationale as ci.yml: a pure check with no deploy side effects, so a newer
# push to the same PR cancels the run it supersedes.
concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -Eq -- '^(feat|fix|chore|refactor|docs|test|perf|build|ci|style|revert)(\([^)]+\))?: .+'; then
            printf '%s\n' "::error::PR title must follow Conventional Commits, e.g. 'feat: add audit log'"
            exit 1
          fi
