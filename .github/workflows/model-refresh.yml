name: Model refresh (nightly latest-model check)

# Why: model IDs were hardcoded in three places that go stale independently -
# the client tier map, the gemini-proxy allowlist, and the per-purpose seats.
# Each one only announces it is stale by failing (a 400, or worse, silently
# serving an older generation). This asks the vendors what exists, picks the
# newest model IN EACH SEAT CLASS, and smoke-tests it before anything moves.
#
# Promotion is ON (Simon, 2026-08-17). A model is promoted only after it passes a
# real structured-output call, and only within its own COST AXIS - a classifier
# seat can never be promoted onto a frontier model, and a deep-analysis seat can
# never drift down onto a cheap one. Cost policy lives in refresh-models.ts
# COST_AXIS; which purpose sits on which axis stays a product decision in
# PURPOSE_TIER / PHASE2_EFFORT and is never touched by this job.
#
# Rollback is one variable, no deploy: set MODEL_PIN_<SEAT> to the previous model
# and the next run skips discovery for that seat.
#
# Optional secrets (a missing key just skips that vendor, it is not an error):
#   ANTHROPIC_API_KEY        list + smoke-test Claude seats
#   OPENAI_API_KEY           list + smoke-test the reasoning seats
#   XAI_API_KEY              list + smoke-test the Grok seat (absent today:
#                            xAI billing is Simon's decision, so the seat is
#                            skipped every run until a key exists)
#   SUPABASE_ACCESS_TOKEN    apply the promotion (without it the job reports only)
#   SUPABASE_PROJECT_REF     which project to write the secrets to
#
# Freeze one seat without touching code by setting a repo variable, e.g.
#   MODEL_PIN_ANTHROPIC_OPUS=claude-opus-4-8

on:
  schedule:
    - cron: "0 19 * * *" # 04:00 KST daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Discover and smoke-test the newest model per seat
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MODEL_PIN_ANTHROPIC_SONNET: ${{ vars.MODEL_PIN_ANTHROPIC_SONNET }}
          MODEL_PIN_ANTHROPIC_OPUS: ${{ vars.MODEL_PIN_ANTHROPIC_OPUS }}
          MODEL_PIN_OPENAI_FRONTIER: ${{ vars.MODEL_PIN_OPENAI_FRONTIER }}
          MODEL_PIN_XAI_FRONTIER: ${{ vars.MODEL_PIN_XAI_FRONTIER }}
        run: |
          set -o pipefail
          # Set MODEL_REFRESH_APPLY=false to fall back to report-only without
          # touching this file.
          if [ "${{ vars.MODEL_REFRESH_APPLY }}" = "false" ]; then
            npx tsx scripts/refresh-models.ts | tee refresh.log
          else
            npx tsx scripts/refresh-models.ts --apply | tee refresh.log
          fi

      - name: Publish the report to the run summary
        if: always()
        run: |
          {
            echo "## 모델 최신화"
            echo ""
            echo '```'
            cat refresh.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
