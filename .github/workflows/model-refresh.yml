name: Model refresh (nightly latest-model check)

# Scheduled runs are always report-only. A production promotion exists only in
# the separate, explicitly selected workflow_dispatch job below.
#
# Environment contracts (console provisioning is required before use):
#   ModelRefreshReadOnly: exact-main, no reviewer, dedicated low-spend provider
#     keys only. It has no Supabase management credential, so it cannot promote.
#   Production: exact-main, required reviewer, provider keys plus the Supabase
#     management credentials needed for an explicitly approved promotion.
#
# GitHub can fall back to a same-named repository or organization secret when an
# environment secret is absent. The names below therefore must not exist at
# those broader scopes. See docs/GITHUB-ACTIONS-CREDENTIAL-BOUNDARIES.md.

on:
  schedule:
    - cron: "0 19 * * *" # 04:00 KST daily
  workflow_dispatch:
    inputs:
      apply:
        description: "Production 승격 실행 (Production 승인 필요)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: model-refresh
  cancel-in-progress: false

jobs:
  report:
    if: >-
      ${{ github.repository == 'Simon-YHKim/2nd-B' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.apply != true)) }}
    environment: ModelRefreshReadOnly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Gate trusted current origin/main
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REPOSITORY" != "Simon-YHKim/2nd-B" ] || [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::Model report requires the owner repository's refs/heads/main."
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error::Could not refresh origin/main before model report setup."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error::Model report run is not the current origin/main head."
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Recheck current main before model report credentials
        env:
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::Model report credentials are restricted to refs/heads/main."
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error::Could not refresh origin/main before model report credentials."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error::origin/main advanced before model report credentials."
            exit 1
          fi

      - name: Discover and smoke-test the newest model per seat (report only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MODEL_REFRESH_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.MODEL_REFRESH_OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.MODEL_REFRESH_XAI_API_KEY }}
          MODEL_PIN_ANTHROPIC_SONNET: ${{ vars.MODEL_PIN_ANTHROPIC_SONNET }}
          MODEL_PIN_ANTHROPIC_OPUS: ${{ vars.MODEL_PIN_ANTHROPIC_OPUS }}
          MODEL_PIN_OPENAI_FRONTIER: ${{ vars.MODEL_PIN_OPENAI_FRONTIER }}
          MODEL_PIN_XAI_FRONTIER: ${{ vars.MODEL_PIN_XAI_FRONTIER }}
          MODEL_REFRESH_ACK_FAILING: ${{ vars.MODEL_REFRESH_ACK_FAILING }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::MODEL_REFRESH_ANTHROPIC_API_KEY and MODEL_REFRESH_OPENAI_API_KEY are required in ModelRefreshReadOnly."
            exit 1
          fi
          npx tsx scripts/refresh-models.ts | tee refresh.log

      - name: Publish the report to the run summary
        if: always()
        run: |
          {
            echo "## 모델 최신화 (report only)"
            echo ""
            echo '```'
            cat refresh.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: >-
      ${{ github.repository == 'Simon-YHKim/2nd-B' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.apply == true }}
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Gate trusted current origin/main
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REPOSITORY" != "Simon-YHKim/2nd-B" ] || [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::Model promotion requires the owner repository's refs/heads/main."
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error::Could not refresh origin/main before model promotion setup."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error::Model promotion run is not the current origin/main head."
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Recheck current main before Production model credentials
        env:
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::Production model credentials are restricted to refs/heads/main."
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error::Could not refresh origin/main before Production model credentials."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error::origin/main advanced before Production model credentials."
            exit 1
          fi

      - name: Discover, smoke-test, and apply the newest model per seat
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PRODUCTION_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.PRODUCTION_OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.PRODUCTION_XAI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          MODEL_PIN_ANTHROPIC_SONNET: ${{ vars.MODEL_PIN_ANTHROPIC_SONNET }}
          MODEL_PIN_ANTHROPIC_OPUS: ${{ vars.MODEL_PIN_ANTHROPIC_OPUS }}
          MODEL_PIN_OPENAI_FRONTIER: ${{ vars.MODEL_PIN_OPENAI_FRONTIER }}
          MODEL_PIN_XAI_FRONTIER: ${{ vars.MODEL_PIN_XAI_FRONTIER }}
          MODEL_REFRESH_ACK_FAILING: ${{ vars.MODEL_REFRESH_ACK_FAILING }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::PRODUCTION_ANTHROPIC_API_KEY and PRODUCTION_OPENAI_API_KEY are required for model promotion."
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::PRODUCTION_SUPABASE_ACCESS_TOKEN and PRODUCTION_SUPABASE_PROJECT_REF are required for model promotion."
            exit 1
          fi
          npx tsx scripts/refresh-models.ts --apply | tee refresh.log

      - name: Publish the apply report to the run summary
        if: always()
        run: |
          {
            echo "## 모델 최신화 (Production apply)"
            echo ""
            echo '```'
            cat refresh.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
