name: EAS Android Build (APK / AAB)

# A successful run means the remote EAS build is FINISHED and its metadata is
# bound to this repository, commit, profile, and expected artifact type. Merely
# submitting a paid build is never reported as success.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (preview = APK, production = Play AAB)"
        required: true
        type: choice
        options:
          - preview
          - production
          - preview-emulator
        default: preview
      message:
        description: "Build message shown in EAS"
        required: false
        default: "Firebase-enabled Android release"
      reuse_build_id:
        description: "Existing EAS build id to recover/verify without starting another build"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eas-android-build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  EAS_CLI_VERSION: "22.5.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
      app_version: ${{ steps.build.outputs.app_version }}
      version_code: ${{ steps.build.outputs.version_code }}
      runtime_version: ${{ steps.build.outputs.runtime_version }}
    steps:
      - name: Checkout exact build commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require current main for production
        if: ${{ inputs.profile == 'production' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Production Android builds can only target refs/heads/main."
            exit 1
          fi
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Production Android build commit is not the current origin/main head."
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify OTA/native runtime policy
        run: npm run check:ota-runtime

      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is required for EAS Android builds."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          node -e '
            const expected = require("./app.json").expo.android.package;
            const config = require("./google-services.json");
            const valid = (config.client || []).some(
              (client) => client.client_info?.android_client_info?.package_name === expected,
            );
            if (!valid) throw new Error("Firebase config package mismatch");
          '

      - name: Build, wait, and verify completed EAS metadata
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_MESSAGE: ${{ inputs.message }}
          BUILD_PROFILE: ${{ inputs.profile }}
          REUSE_BUILD_ID: ${{ inputs.reuse_build_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN is required for EAS Android builds."
            exit 1
          fi
          case "$BUILD_PROFILE" in
            preview|production|preview-emulator) ;;
            *) echo "::error::Unsupported EAS build profile."; exit 1 ;;
          esac

          FINAL="$RUNNER_TEMP/eas-android-final.json"
          if [ -n "${REUSE_BUILD_ID:-}" ]; then
            if ! printf '%s' "$REUSE_BUILD_ID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
              echo "::error::reuse_build_id is not a UUID."
              exit 1
            fi
            BUILD_ID="$REUSE_BUILD_ID"
            echo "Recovering existing EAS Android build; no new paid build will be started."
          else
            EXISTING="$RUNNER_TEMP/eas-android-existing.json"
            BUILD_ID=""
            for lookup_attempt in 1 2 3 4 5; do
              npx --yes "eas-cli@$EAS_CLI_VERSION" build:list \
                --platform android \
                --build-profile "$BUILD_PROFILE" \
                --git-commit-hash "$EXPECTED_COMMIT" \
                --limit 50 \
                --json \
                --non-interactive > "$EXISTING"
              BUILD_ID="$(node - "$EXISTING" <<'NODE'
          const fs = require("node:fs");
          const config = require("./app.json").expo;
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const builds = Array.isArray(value) ? value : [];
          const allowed = new Set(["NEW", "IN_QUEUE", "IN_PROGRESS", "FINISHED"]);
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const sha = /^[0-9a-f]{40}$/i;
          const query = `
            query BuildProvenance($buildId: ID!) {
              builds {
                byId(buildId: $buildId) {
                  id
                  isGitWorkingTreeDirty
                  gitCommitHash
                }
              }
            }
          `;
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function buildProvenance(buildId) {
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 15_000);
              try {
                const response = await fetch("https://api.expo.dev/graphql", {
                  method: "POST",
                  headers: {
                    authorization: `Bearer ${process.env.EXPO_TOKEN}`,
                    "content-type": "application/json",
                  },
                  body: JSON.stringify({ query, variables: { buildId } }),
                  signal: controller.signal,
                });
                if (!response.ok) throw new Error("http");
                let payload;
                try {
                  payload = await response.json();
                } catch {
                  throw new Error("json");
                }
                if (
                  payload?.errors !== undefined &&
                  (!Array.isArray(payload.errors) || payload.errors.length > 0)
                ) {
                  throw new Error("graphql");
                }
                const provenance = payload?.data?.builds?.byId;
                if (!provenance) throw new Error("missing");
                return provenance;
              } catch {
                if (attempt === 3) throw new Error("candidate provenance unavailable");
                await wait(attempt * 1_000);
              } finally {
                clearTimeout(timer);
              }
            }
            throw new Error("candidate provenance unavailable");
          }

          async function selectAuthenticatedCleanCandidate() {
            const expectedCommit = String(process.env.EXPECTED_COMMIT || "").toLowerCase();
            if (!sha.test(expectedCommit)) throw new Error("workflow commit is malformed");
            const candidates = builds.filter((build) => {
              const project = build?.app ?? build?.project;
              const status = String(build?.status || "").toUpperCase().replaceAll("-", "_");
              return allowed.has(status) &&
                project?.id === config.extra?.eas?.projectId &&
                String(build?.platform).toUpperCase() === "ANDROID" &&
                build?.buildProfile === process.env.BUILD_PROFILE &&
                build?.appIdentifier === config.android?.package;
            }).sort((a, b) => Date.parse(b.createdAt || 0) - Date.parse(a.createdAt || 0));
            for (const candidate of candidates) {
              if (!uuid.test(candidate?.id || "")) throw new Error("candidate id is malformed");
              const provenance = await buildProvenance(candidate.id);
              if (String(provenance?.id).toLowerCase() !== candidate.id.toLowerCase()) {
                throw new Error("candidate id mismatch");
              }
              const commit = String(provenance?.gitCommitHash || "").toLowerCase();
              if (
                provenance?.isGitWorkingTreeDirty === false &&
                sha.test(commit) &&
                commit === expectedCommit
              ) {
                process.stdout.write(candidate.id);
                return;
              }
            }
          }

          selectAuthenticatedCleanCandidate().catch(() => {
            console.error("Android build candidate provenance lookup failed closed.");
            process.exitCode = 1;
          });
          NODE
              )"
              if [ -n "$BUILD_ID" ]; then break; fi
              if [ "$lookup_attempt" -lt 5 ]; then sleep 5; fi
            done
            if [ -n "$BUILD_ID" ]; then
               echo "Found an authenticated clean EAS Android candidate for this commit."
            else
              SUBMISSION="$RUNNER_TEMP/eas-android-submission.json"
              npx --yes "eas-cli@$EAS_CLI_VERSION" build \
                --platform android \
                --profile "$BUILD_PROFILE" \
                --message "$BUILD_MESSAGE" \
                --non-interactive \
                --no-wait \
                --json > "$SUBMISSION"
              BUILD_ID="$(node - "$SUBMISSION" <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const build = Array.isArray(value) ? value[0] : value;
          if (!build?.id) throw new Error("EAS submission returned no build id");
          process.stdout.write(build.id);
          NODE
              )"
            fi
          fi
          if ! printf '%s' "$BUILD_ID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::EAS Android build id is missing or malformed."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          BUILD_URL="https://expo.dev/accounts/simon_k/projects/2nd-brain/builds/$BUILD_ID"
          echo "::notice::EAS Android recovery id: $BUILD_ID"
          printf -- '- Recovery build id: `%s` · %s\n' "$BUILD_ID" "$BUILD_URL" >> "$GITHUB_STEP_SUMMARY"

          DEADLINE=$((SECONDS + 19800))
          while true; do
            npx --yes "eas-cli@$EAS_CLI_VERSION" build:view "$BUILD_ID" --json > "$FINAL"
            STATUS="$(node - "$FINAL" <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const build = Array.isArray(value) ? value[0] : value;
          process.stdout.write(String(build?.status || "MISSING").toUpperCase().replaceAll("-", "_"));
          NODE
            )"
            case "$STATUS" in
              FINISHED) break ;;
              NEW|IN_QUEUE|IN_PROGRESS) ;;
              ERRORED|CANCELED|PENDING_CANCEL)
                echo "::error::EAS Android build $BUILD_ID ended with status $STATUS."
                exit 1
                ;;
              *)
                echo "::error::EAS Android build $BUILD_ID returned unknown status $STATUS."
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Wait exceeded 330 minutes; rerun with reuse_build_id=$BUILD_ID."
              exit 1
            fi
            sleep 30
          done
          export BUILD_ID FINAL
          node <<'NODE' > "$RUNNER_TEMP/eas-android-verified.json"
          const fs = require("node:fs");
          const config = require("./app.json").expo;
          const fail = (message) => { throw new Error(`completed Android build rejected: ${message}`); };
          const query = `
            query BuildProvenance($buildId: ID!) {
              builds {
                byId(buildId: $buildId) {
                  id
                  isGitWorkingTreeDirty
                  gitCommitHash
                }
              }
            }
          `;
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchBuildProvenance(buildId) {
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 15_000);
              try {
                const response = await fetch("https://api.expo.dev/graphql", {
                  method: "POST",
                  headers: {
                    authorization: `Bearer ${process.env.EXPO_TOKEN}`,
                    "content-type": "application/json",
                  },
                  body: JSON.stringify({ query, variables: { buildId } }),
                  signal: controller.signal,
                });
                if (!response.ok) throw new Error("http");
                let payload;
                try {
                  payload = await response.json();
                } catch {
                  throw new Error("json");
                }
                if (
                  payload?.errors !== undefined &&
                  (!Array.isArray(payload.errors) || payload.errors.length > 0)
                ) {
                  throw new Error("graphql");
                }
                const build = payload?.data?.builds?.byId;
                if (!build) throw new Error("missing");
                return build;
              } catch {
                if (attempt === 3) fail("authenticated Expo GraphQL provenance is unavailable");
                await wait(attempt * 1_000);
              } finally {
                clearTimeout(timer);
              }
            }
            fail("authenticated Expo GraphQL provenance is unavailable");
          }

          async function main() {
            const value = JSON.parse(fs.readFileSync(process.env.FINAL, "utf8"));
            const b = Array.isArray(value) ? value[0] : value;
            const expectedProfile = process.env.BUILD_PROFILE;
            const expectedType = expectedProfile === "production" ? "aab" : "apk";
            const expectedChannel = expectedProfile === "production" ? "production" : "preview";
            const project = b?.app ?? b?.project;
            if (String(b?.id).toLowerCase() !== process.env.BUILD_ID.toLowerCase()) fail("id changed between submit and view");
            if (project?.id !== config.extra?.eas?.projectId) fail("project id mismatch");
            if (project?.slug !== config.slug || project?.ownerAccount?.name !== config.owner) fail("project identity mismatch");
            if (String(b?.platform).toUpperCase() !== "ANDROID") fail("platform mismatch");
            if (String(b?.status).toUpperCase() !== "FINISHED") fail(`status is ${b?.status || "missing"}`);
            if (b?.buildProfile !== expectedProfile) fail("profile mismatch");
            if (b?.appIdentifier !== config.android?.package) fail("Android application id mismatch");
            if (b?.appVersion !== config.version) fail("appVersion mismatch");
            if (!/^[1-9][0-9]*$/.test(String(b?.appBuildVersion || ""))) fail("remote versionCode missing");
            if ((b?.updateChannel?.name ?? b?.channel) !== expectedChannel) fail("update channel mismatch");
            const url = b?.artifacts?.applicationArchiveUrl ?? b?.artifacts?.buildUrl;
            let parsed;
            try { parsed = new URL(url); } catch { fail("artifact URL missing"); }
            if (parsed.protocol !== "https:" || !parsed.pathname.toLowerCase().endsWith(`.${expectedType}`)) {
              fail(`artifact metadata is not ${expectedType}`);
            }
            const runtimeVersion = String(b?.runtime?.version ?? b?.runtimeVersion ?? "").toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(runtimeVersion)) fail("runtimeVersion is not a fingerprint hash");

            const provenance = await fetchBuildProvenance(process.env.BUILD_ID);
            if (String(provenance.id).toLowerCase() !== process.env.BUILD_ID.toLowerCase()) {
              fail("authenticated build id mismatch");
            }
            if (provenance.isGitWorkingTreeDirty !== false) {
              fail("authenticated source working tree was dirty or provenance is missing");
            }
            const gitCommitHash = String(provenance.gitCommitHash || "").toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(gitCommitHash) || gitCommitHash !== process.env.EXPECTED_COMMIT.toLowerCase()) {
              fail("authenticated git commit mismatch");
            }

            process.stdout.write(JSON.stringify({
              id: b.id,
              appVersion: b.appVersion,
              appBuildVersion: String(b.appBuildVersion),
              runtimeVersion,
              artifactType: expectedType,
            }));
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

          APP_VERSION="$(node -p "require('$RUNNER_TEMP/eas-android-verified.json').appVersion")"
          VERSION_CODE="$(node -p "require('$RUNNER_TEMP/eas-android-verified.json').appBuildVersion")"
          RUNTIME_VERSION="$(node -p "require('$RUNNER_TEMP/eas-android-verified.json').runtimeVersion")"
          {
            echo "app_version=$APP_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "runtime_version=$RUNTIME_VERSION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### EAS Android build completed and verified"
            echo
            echo "- Profile: \`$BUILD_PROFILE\`"
            echo "- Artifact: \`$([ "$BUILD_PROFILE" = production ] && echo AAB || echo APK)\`"
            echo "- App version: \`$APP_VERSION\` · remote versionCode \`$VERSION_CODE\`"
            echo "- Runtime: \`$RUNTIME_VERSION\`"
            echo "- Build: $BUILD_URL"
          } >> "$GITHUB_STEP_SUMMARY"
