name: Deploy edge function

# Deploys one repository-owned Edge Function from the current main revision.
# Production environment approval and a shared mutation lane protect the live
# project. Function auth behavior comes only from reviewed supabase/config.toml.

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function slug under supabase/functions (e.g. openai-proxy)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-mutations
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'Simon-YHKim/2nd-B' && github.ref == 'refs/heads/main' }}
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Gate current origin/main
        id: main_gate
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_REPOSITORY" != "Simon-YHKim/2nd-B" ] || [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error title=Edge deploy gate::trusted-main-ref-required"
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error title=Edge deploy gate::remote-main-fetch-failed"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$RUN_SHA" ] || [ "$REMOTE_MAIN_SHA" != "$RUN_SHA" ]; then
            echo "::error title=Edge deploy gate::checkout-is-not-current-remote-main"
            exit 1
          fi
          echo "main_sha=$REMOTE_MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate repository-owned function and auth config
        id: function_gate
        env:
          FUNCTION_INPUT: ${{ inputs.function }}
        run: |
          set -euo pipefail
          if [ -z "$FUNCTION_INPUT" ] || [ ${#FUNCTION_INPUT} -gt 63 ] || \
             ! [[ "$FUNCTION_INPUT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error title=Edge deploy gate::invalid-function-slug"
            exit 1
          fi

          FUNCTION_ROOT="$(realpath -e -- supabase/functions)"
          REQUESTED_DIR="$FUNCTION_ROOT/$FUNCTION_INPUT"
          if [ ! -d "$REQUESTED_DIR" ] || [ -L "$REQUESTED_DIR" ]; then
            echo "::error title=Edge deploy gate::function-directory-not-regular"
            exit 1
          fi
          if ! FUNCTION_DIR="$(realpath -e -- "$REQUESTED_DIR")"; then
            echo "::error title=Edge deploy gate::function-path-unresolvable"
            exit 1
          fi
          case "$FUNCTION_DIR" in
            "$FUNCTION_ROOT"/*) ;;
            *)
              echo "::error title=Edge deploy gate::function-path-escaped-root"
              exit 1
              ;;
          esac
          if [ ! -f "$FUNCTION_DIR/index.ts" ] || [ -L "$FUNCTION_DIR/index.ts" ]; then
            echo "::error title=Edge deploy gate::function-index-not-regular"
            exit 1
          fi

          FUNCTION_SLUG="$FUNCTION_INPUT"
          CONFIG_SECTION="[functions.$FUNCTION_SLUG]"
          SECTION_COUNT="$(grep -Fxc -- "$CONFIG_SECTION" supabase/config.toml || true)"
          if [ "$SECTION_COUNT" != "1" ]; then
            echo "::error title=Edge deploy gate::function-config-section-required"
            exit 1
          fi
          VERIFY_JWT="$(
            awk -v section="$CONFIG_SECTION" '
              $0 == section { inside = 1; next }
              inside && /^\[/ { inside = 0 }
              inside && $1 == "verify_jwt" && $2 == "=" { print $3 }
            ' supabase/config.toml
          )"
          case "$VERIFY_JWT" in
            true|false) ;;
            *)
              echo "::error title=Edge deploy gate::function-verify-jwt-boolean-required"
              exit 1
              ;;
          esac
          echo "function_slug=$FUNCTION_SLUG" >> "$GITHUB_OUTPUT"
          echo "verify_jwt=$VERIFY_JWT" >> "$GITHUB_OUTPUT"

      - name: Validate production credentials
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=Edge deploy gate::access-token-required"
            exit 1
          fi
          if ! [[ "${PROJECT_REF:-}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error title=Edge deploy gate::invalid-project-ref"
            exit 1
          fi

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: "2.116.0"

      - name: Record version before deploying
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF" | tee before.txt

      - name: Recheck main and deploy config-owned auth policy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTION_SLUG: ${{ steps.function_gate.outputs.function_slug }}
          MAIN_SHA: ${{ steps.main_gate.outputs.main_sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1; then
            echo "::error title=Edge deploy gate::remote-main-recheck-failed"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$MAIN_SHA" ] || \
             [ "$(git rev-parse refs/remotes/origin/main)" != "$MAIN_SHA" ]; then
            echo "::error title=Edge deploy gate::main-advanced-before-deploy"
            exit 1
          fi
          supabase functions deploy "$FUNCTION_SLUG" --project-ref "$PROJECT_REF"

      - name: Report version after deploying
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTION_SLUG: ${{ steps.function_gate.outputs.function_slug }}
          VERIFY_JWT: ${{ steps.function_gate.outputs.verify_jwt }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF" | tee after.txt
          {
            echo "## Deployed \`$FUNCTION_SLUG\`"
            echo ""
            echo "JWT verification from config: \`$VERIFY_JWT\`"
            echo ""
            echo "### After"
            echo '```'
            cat after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
