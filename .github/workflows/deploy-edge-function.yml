name: Deploy edge function

# Why: openai-proxy / gemini-proxy / peer-respond deploys had no repeatable path.
# The console session has no Supabase CLI and no login token, so deploys were
# being hand-carried file by file, which risks a transcription error on a live
# function. This deploys straight from the repo source instead.
#
# Requires the SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF repo secrets.
# Without the token the job stops before touching anything.

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function slug under supabase/functions (e.g. openai-proxy)
        required: true
        type: string
      verify_jwt:
        description: Keep JWT verification on (false is limited to reviewed public callbacks)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment policy
        id: policy
        env:
          EDGE_FUNCTION_NAME: ${{ inputs.function }}
          EDGE_VERIFY_JWT: ${{ inputs.verify_jwt }}
        run: node scripts/check-edge-function-deploy-policy.mjs

      - name: Refuse to run without the token
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Add it in Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          if [ -z "${REF:-}" ]; then
            echo "SUPABASE_PROJECT_REF is not set." >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Record the version before deploying
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            | tee before.txt

      - name: Deploy
        env:
          FUNCTION_NAME: ${{ steps.policy.outputs.function_name }}
          JWT_FLAG: ${{ steps.policy.outputs.jwt_flag }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          args=(functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF")
          if [ -n "$JWT_FLAG" ]; then
            args+=("$JWT_FLAG")
          fi
          supabase "${args[@]}"

      - name: Report the version after deploying
        env:
          FUNCTION_NAME: ${{ steps.policy.outputs.function_name }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERIFY_JWT: ${{ steps.policy.outputs.verify_jwt }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            | tee after.txt
          {
            echo "## Deployed \`$FUNCTION_NAME\`"
            echo ""
            echo "verify_jwt: \`$VERIFY_JWT\`"
            echo ""
            echo "### After"
            echo '```'
            cat after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
