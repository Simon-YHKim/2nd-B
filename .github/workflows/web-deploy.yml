name: Web build / manual publish (GitHub Pages)

# Every main push verifies and exports an immutable artifact, but never writes
# gh-pages. Publishing is a separate workflow_dispatch decision bound to an
# exact source SHA and the protected Production environment. The Pages source
# is already gh-pages; this workflow does not mutate repository Pages settings.
#
# URL after first successful deploy:
#   https://simon-yhkim.github.io/2nd-B/
#
# Note on env vars: deployed site uses Supabase via repo Variables
# (Settings → Secrets and variables → Actions → Variables):
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "No-write build, current-main publish, or approved rollback"
        required: true
        type: choice
        options:
          - build-only
          - publish
          - rollback
        default: build-only
      source_sha:
        description: "Exact 40-character lowercase commit SHA to build"
        required: true
        type: string
      compliance_floor_sha:
        description: "Rollback only: approved post-boundary floor SHA"
        required: false
        type: string
        default: ""
      confirmation:
        description: "build-only:<sha>, publish:<sha>, or rollback:<sha>:<floor-sha>"
        required: true
        type: string
      allow_dev_tier:
        description: "Build-only QA artifact: honor ?tier= links; publish/rollback reject true"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.gate.outputs.artifact_name }}
      compliance_floor_sha: ${{ steps.gate.outputs.compliance_floor_sha }}
      mode: ${{ steps.gate.outputs.mode }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - name: Resolve and validate the requested immutable source
        id: gate
        env:
          DISPATCH_ALLOW_DEV_TIER: ${{ inputs.allow_dev_tier && 'true' || 'false' }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation || '' }}
          DISPATCH_FLOOR_SHA: ${{ inputs.compliance_floor_sha || '' }}
          DISPATCH_MODE: ${{ inputs.mode || '' }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY" != "Simon-YHKim/2nd-B" ]; then
            echo "::error::This workflow may run only in Simon-YHKim/2nd-B."
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            MODE="build-only"
            SOURCE_SHA="$EVENT_SHA"
            FLOOR_SHA=""
            CONFIRMATION="build-only:$SOURCE_SHA"
            ALLOW_DEV_TIER="false"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "refs/heads/main" ]; then
              echo "::error::Manual web builds and publishes must run from refs/heads/main."
              exit 1
            fi
            MODE="$DISPATCH_MODE"
            SOURCE_SHA="$DISPATCH_SOURCE_SHA"
            FLOOR_SHA="$DISPATCH_FLOOR_SHA"
            CONFIRMATION="$DISPATCH_CONFIRMATION"
            ALLOW_DEV_TIER="$DISPATCH_ALLOW_DEV_TIER"
          else
            echo "::error::Unsupported event."
            exit 1
          fi

          if ! printf '%s' "$SOURCE_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::source_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
          case "$MODE" in
            build-only)
              EXPECTED_CONFIRMATION="build-only:$SOURCE_SHA"
              ;;
            publish)
              EXPECTED_CONFIRMATION="publish:$SOURCE_SHA"
              if [ -n "$FLOOR_SHA" ] || [ "$ALLOW_DEV_TIER" != "false" ]; then
                echo "::error::Publish forbids a rollback floor and the QA tier override."
                exit 1
              fi
              ;;
            rollback)
              if ! printf '%s' "$FLOOR_SHA" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error::Rollback requires an exact 40-character compliance floor SHA."
                exit 1
              fi
              if [ "$ALLOW_DEV_TIER" != "false" ]; then
                echo "::error::Rollback forbids the QA tier override."
                exit 1
              fi
              EXPECTED_CONFIRMATION="rollback:$SOURCE_SHA:$FLOOR_SHA"
              ;;
            *)
              echo "::error::Unsupported mode."
              exit 1
              ;;
          esac
          if [ "$CONFIRMATION" != "$EXPECTED_CONFIRMATION" ]; then
            echo "::error::Confirmation does not exactly match the requested mode and SHA."
            exit 1
          fi

          ARTIFACT_NAME="web-dist-$SOURCE_SHA-${{ github.run_id }}"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "compliance_floor_sha=$FLOOR_SHA"
            echo "mode=$MODE"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.gate.outputs.source_sha }}

      - name: Prove source membership and publication eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          FLOOR_SHA: ${{ steps.gate.outputs.compliance_floor_sha }}
          MODE: ${{ steps.gate.outputs.mode }}
          SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "::error::Checkout does not match source_sha."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::source_sha is not an ancestor of origin/main."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$(git rev-parse origin/main)" != "$EVENT_SHA" ]; then
            echo "::error::The main workflow ref became stale before verification."
            exit 1
          fi
          if [ "$MODE" = "publish" ] && [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "::error::Publish requires source_sha to equal fresh origin/main."
            exit 1
          fi
          if [ "$MODE" = "rollback" ]; then
            git cat-file -e "$FLOOR_SHA^{commit}"
            if ! git merge-base --is-ancestor "$FLOOR_SHA" "$SOURCE_SHA"; then
              echo "::error::Rollback source is below the approved compliance floor."
              exit 1
            fi
          fi

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify repository contracts
        run: npm run verify

      - name: Build Expo Web (static export)
        env:
          # UI track: the LIVE web build now ships the deep-space character shell
          # (cutover 2026-06-17, design handoff). The integrated shell — status
          # header + 5-tab dock + constellation home + 담기/세컨비/나/IDEN views —
          # is in place; remaining deep-space sub-screens (graph/clipper/account/
          # settings re-theme) are follow-ups, reachable via the existing routes.
          # EAS native production stays pinned to legacy (eas.json) until parity.
          # To roll the web build back to legacy: set this to "legacy".
          EXPO_PUBLIC_UI: "deep-space"
          # QA ONLY, and only via a manual workflow_dispatch that opts in: lets
          # ?tier=all|free|plus|pro URL links force a tier. This workflow's push
          # trigger IS the public site (the "preview" in the name is historical),
          # so a push to main must never enable it — `inputs` is empty for a push
          # event, which resolves this to "false". Previously hardcoded "true",
          # which shipped a URL-param paywall bypass to the live site.
          EXPO_PUBLIC_ALLOW_DEV_TIER: ${{ inputs.allow_dev_tier && 'true' || 'false' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Korea public-data keys (G1 IN-bound enrichment): Eximbank FX rates for
          # the ledger (src/lib/finance/fx.ts) + MFDS food-nutrition for the meal
          # planner (src/lib/nutrition/foods.ts). EXPO_PUBLIC_ = bundled client-side
          # by design; both are free, low-sensitivity public-data keys. An unset
          # Variable degrades gracefully (KRW-only / idea-only), so a missing key
          # never breaks the build.
          EXPO_PUBLIC_EXIM_FX_KEY: ${{ vars.EXPO_PUBLIC_EXIM_FX_KEY }}
          EXPO_PUBLIC_MFDS_FOOD_KEY: ${{ vars.EXPO_PUBLIC_MFDS_FOOD_KEY }}
          # Google OAuth Web client id (public, not a secret) for the Calendar/
          # Tasks import connector (GIS token model — src/lib/google/). Unset →
          # the "Connect Google" action is hidden; nothing else is affected.
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          # LLM mode + key: when the repo Variable EXPO_PUBLIC_GOOGLE_API_KEY is
          # set, builds default to "live"; otherwise mock. Override by setting
          # the Variable EXPO_PUBLIC_LLM_MODE explicitly.
          EXPO_PUBLIC_LLM_MODE: ${{ vars.EXPO_PUBLIC_LLM_MODE || 'mock' }}
          EXPO_PUBLIC_GOOGLE_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_API_KEY }}
          # Route Gemini through the gemini-proxy Edge Function so the API key
          # stays server-side (Supabase secret GEMINI_API_KEY) and is NEVER
          # inlined into the public web bundle. REQUIRED for live web: set repo
          # Variable EXPO_PUBLIC_LLM_VIA_EDGE_FUNCTION=true alongside LLM_MODE=live.
          EXPO_PUBLIC_LLM_VIA_EDGE_FUNCTION: ${{ vars.EXPO_PUBLIC_LLM_VIA_EDGE_FUNCTION || 'false' }}
          # D-27 axis-key pin: route every Gemini seat to gemini-3.5-flash so live
          # calls resolve the dedicated GEMINI_API_KEY__G35FLASH__{effort} combo
          # keys (a G25* slug would fall back to the base key). Overridable via a
          # repo Variable of the same name.
          EXPO_PUBLIC_MODEL_LITE: ${{ vars.EXPO_PUBLIC_MODEL_LITE || 'gemini-3.5-flash' }}
          EXPO_PUBLIC_MODEL_FLASH: ${{ vars.EXPO_PUBLIC_MODEL_FLASH || 'gemini-3.5-flash' }}
          EXPO_PUBLIC_MODEL_PRO: ${{ vars.EXPO_PUBLIC_MODEL_PRO || 'gemini-3.5-flash' }}
          # Reasoning-seat provider parity with the native builds (eas.json +
          # android-release.yml pin "gemini" since 2026-07-21: Anthropic credits
          # exhausted 2026-07-06, so "claude" made every pro-tier call pay a dead
          # claude-proxy hop before the gemini fallback). NOTE the repo Variable
          # EXPO_PUBLIC_REASONING_PROVIDER (currently "claude") outranks this
          # fallback — flip it with:
          #   gh variable set EXPO_PUBLIC_REASONING_PROVIDER --body gemini
          EXPO_PUBLIC_REASONING_PROVIDER: ${{ vars.EXPO_PUBLIC_REASONING_PROVIDER || 'gemini' }}
          # D-26 purpose-keyed routing phase. "1" = current posture (no behavior
          # change); flip the repo Variable to "2" to activate Phase 2 routing.
          EXPO_PUBLIC_LLM_PHASE: ${{ vars.EXPO_PUBLIC_LLM_PHASE || '1' }}
          # Vendor for 세컨비 대화 only. Unset/"gemini" keeps today's behaviour.
          # Deploy openai-proxy BEFORE setting this to "openai": the proxy 400s
          # any purpose outside its allowlist, and the secondb_chat seat only
          # exists once that function is redeployed.
          EXPO_PUBLIC_CHAT_VENDOR: ${{ vars.EXPO_PUBLIC_CHAT_VENDOR || 'gemini' }}
          # Backbone switch for the nine reasoning seats. Unset is NOT the same as
          # 'gemini' here: unset falls through to the phase rule (Phase 1 = Gemini),
          # which is today's posture, so '' keeps behaviour identical. Setting this
          # to openai/claude requires that vendor's key AND credit -- and note the
          # seats have never served a production call, so treat a flip as a rollout,
          # not a config tweak.
          EXPO_PUBLIC_LLM_VENDOR: ${{ vars.EXPO_PUBLIC_LLM_VENDOR || '' }}
          EXPO_PUBLIC_CROSSCHECK: ${{ vars.EXPO_PUBLIC_CROSSCHECK || '0' }}
          # Vendor for the OCR + voice-memo seats (the two that carry binaries).
          # Unset keeps Gemini, which is today's posture.
          #
          # ⚠ THIS LINE IS THE FLIP. Until 2026-08-21 the variable existed in the
          # code and in nobody's build environment: Expo inlines EXPO_PUBLIC_*
          # from the BUILD env, and this workflow enumerates what it passes, so
          # setting the repo Variable alone changed nothing and reported nothing.
          # Deploy openai-proxy BEFORE flipping this, same as chat.
          EXPO_PUBLIC_MULTIMODAL_VENDOR: ${{ vars.EXPO_PUBLIC_MULTIMODAL_VENDOR || '' }}
          # Vendor for the nine purposes that are neither a reasoning seat, nor
          # chat, nor multimodal (classification, interview probes, imports, the
          # deep-run rationale). Unset keeps Gemini. Same missing-from-the-env
          # story as the line above; also deploy-before-flip.
          EXPO_PUBLIC_BACKBONE_VENDOR: ${{ vars.EXPO_PUBLIC_BACKBONE_VENDOR || '' }}
          # Embeddings. Unset keeps Gemini. ⚠ flipping this requires a re-index -
          # see the note above embedVendor() in src/lib/llm/routing.ts.
          EXPO_PUBLIC_EMBED_VENDOR: ${{ vars.EXPO_PUBLIC_EMBED_VENDOR || '' }}
          # Where a failed vendor call retries. Unset keeps Gemini; 'none'
          # disables the retry, which is the right answer once Gemini is gone
          # and the only targets left are the one that just failed.
          EXPO_PUBLIC_FAILOVER_VENDOR: ${{ vars.EXPO_PUBLIC_FAILOVER_VENDOR || '' }}
          # Server-side crisis classifier vendor. Dormant unless
          # EXPO_PUBLIC_SERVER_SAFETY is also on.
          EXPO_PUBLIC_SAFETY_VENDOR: ${{ vars.EXPO_PUBLIC_SAFETY_VENDOR || '' }}
          # Naver social sign-up (custom OAuth via the oauth-naver edge function,
          # already in-repo). Server side confirmed live 2026-07-15 (Simon):
          # oauth-naver deployed with its secrets and the app registered at
          # developers.naver.com (callback <origin>/2nd-B/oauth-callback), so the
          # default is now "true". The button still needs EXPO_PUBLIC_NAVER_CLIENT_ID
          # set below, since isNaverEnabled() gates on the id too. The '|| true'
          # also keeps an unset Variable from feeding zod an empty string. Set the
          # Variable to "false" to hide it on a deploy where the server is not ready.
          EXPO_PUBLIC_ENABLE_NAVER: ${{ vars.EXPO_PUBLIC_ENABLE_NAVER || 'true' }}
          # Supabase-native social providers. Buttons show only when the provider
          # is actually enabled in the Supabase console AND the matching Variable
          # is "true". Simon confirmed Google/Kakao/GitHub are enabled server-side
          # (2026-07-15), so those default "true". Apple stays "false" pending
          # Apple is enabled after its provider configuration was completed;
          # Facebook is unset here (env.ts
          # default "false"). A provider left "false" hides its button so users
          # never hit a raw provider error page (the 2026-06-11 live-QA failure).
          EXPO_PUBLIC_ENABLE_GOOGLE: ${{ vars.EXPO_PUBLIC_ENABLE_GOOGLE || 'true' }}
          EXPO_PUBLIC_ENABLE_APPLE: ${{ vars.EXPO_PUBLIC_ENABLE_APPLE || 'true' }}
          EXPO_PUBLIC_ENABLE_KAKAO: ${{ vars.EXPO_PUBLIC_ENABLE_KAKAO || 'true' }}
          EXPO_PUBLIC_ENABLE_GITHUB: ${{ vars.EXPO_PUBLIC_ENABLE_GITHUB || 'true' }}
          EXPO_PUBLIC_NAVER_CLIENT_ID: ${{ vars.EXPO_PUBLIC_NAVER_CLIENT_ID || 'A1Su7C7EgyR49be6V4rT' }}
          # Analytics (Simon directive 2026-06-11): the client code has been
          # consent-gated and wired since #258, but the build never injected
          # the ids, so live collection was a no-op. All optional: an unset
          # Variable keeps that tool off. Set the four Variables to activate
          # (GA4 G-xxxx, Clarity project id, Sentry DSN).
          EXPO_PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_GA4_MEASUREMENT_ID }}
          EXPO_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.EXPO_PUBLIC_CLARITY_PROJECT_ID }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          # Paddle web checkout (#1171). The web export is the only surface that can
          # take money: RevenueCat is native-only, so a browser visitor had no payment
          # path at all. paddleCheckoutAvailable() fails closed on any unset value, so
          # until these five Variables exist the plans screen keeps its existing
          # "checkout is not open yet" copy. Merging #1171 alone therefore does NOT
          # open a payment path; this wiring plus the Variables is what does.
          #   gh variable set EXPO_PUBLIC_PADDLE_CLIENT_TOKEN --body live_...
          #   gh variable set EXPO_PUBLIC_PADDLE_PRICE_CORTEX_MONTHLY --body pri_...
          # The client-side token is PUBLIC by design (Paddle > Developer Tools >
          # Authentication) and belongs in the bundle. The webhook signing secret is
          # NOT and never appears here: it lives in Supabase edge secrets only
          # (repo constraint 4).
          EXPO_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.EXPO_PUBLIC_PADDLE_CLIENT_TOKEN }}
          EXPO_PUBLIC_PADDLE_PRICE_CORTEX_MONTHLY: ${{ vars.EXPO_PUBLIC_PADDLE_PRICE_CORTEX_MONTHLY }}
          EXPO_PUBLIC_PADDLE_PRICE_CORTEX_YEARLY: ${{ vars.EXPO_PUBLIC_PADDLE_PRICE_CORTEX_YEARLY }}
          EXPO_PUBLIC_PADDLE_PRICE_BRAIN_MONTHLY: ${{ vars.EXPO_PUBLIC_PADDLE_PRICE_BRAIN_MONTHLY }}
          EXPO_PUBLIC_PADDLE_PRICE_BRAIN_YEARLY: ${{ vars.EXPO_PUBLIC_PADDLE_PRICE_BRAIN_YEARLY }}
          # Ads (web AdSense), OFF until the Variables are set AND the
          # in-app policy passes (free adult + explicit ads consent + neutral
          # route — src/lib/ads/policy.ts). See docs/ADS.md for go-live steps.
          EXPO_PUBLIC_ENABLE_ADS: ${{ vars.EXPO_PUBLIC_ENABLE_ADS || 'false' }}
          EXPO_PUBLIC_ADSENSE_CLIENT: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT }}
          EXPO_PUBLIC_ADSENSE_SLOT_RECORDS: ${{ vars.EXPO_PUBLIC_ADSENSE_SLOT_RECORDS }}
          EXPO_USE_STATIC: "true"
        run: |
          # base-path (/2nd-B) comes from expo.experiments.baseUrl in app.json,
          # so `expo export` emits correctly-prefixed asset AND client-router
          # paths. No manual sed patching needed (that only fixed asset URLs
          # and left the router unaware of the subpath — the root-URL 404 bug).
          npx expo export --platform web --output-dir dist
          # SPA fallback + Jekyll opt-out.
          cp dist/index.html dist/404.html 2>/dev/null || true
          touch dist/.nojekyll

      - name: Bind the artifact to its reviewed source
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const sha = process.env.SOURCE_SHA;
          if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error("invalid source SHA");
          fs.writeFileSync(
            "dist/.release-source.json",
            `${JSON.stringify({ sourceSha: sha, mode: process.env.MODE })}\n`,
          );
          NODE

      - name: Upload immutable web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.gate.outputs.artifact_name }}
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (needs.build.outputs.mode == 'publish' || needs.build.outputs.mode == 'rollback')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: Production
      url: https://simon-yhkim.github.io/2nd-B/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout the workflow commit for the final ref check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Revalidate the exact SHA immediately before gh-pages write
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          FLOOR_SHA: ${{ needs.build.outputs.compliance_floor_sha }}
          MODE: ${{ needs.build.outputs.mode }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" != "Simon-YHKim/2nd-B" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploy job is restricted to the owner repository's main ref."
            exit 1
          fi
          if [ "${{ inputs.allow_dev_tier && 'true' || 'false' }}" != "false" ]; then
            echo "::error::Public deployment cannot contain the QA tier override."
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ] || [ "$MAIN_SHA" != "${{ github.sha }}" ]; then
            echo "::error::main advanced while this run waited for Production approval."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::source_sha is no longer an origin/main ancestor."
            exit 1
          fi

          case "$MODE" in
            publish)
              [ "$SOURCE_SHA" = "$MAIN_SHA" ] || {
                echo "::error::Publish source is no longer the fresh origin/main head."
                exit 1
              }
              EXPECTED_CONFIRMATION="publish:$SOURCE_SHA"
              ;;
            rollback)
              git cat-file -e "$FLOOR_SHA^{commit}"
              git merge-base --is-ancestor "$FLOOR_SHA" "$SOURCE_SHA" || {
                echo "::error::Rollback source fell below the approved compliance floor."
                exit 1
              }
              EXPECTED_CONFIRMATION="rollback:$SOURCE_SHA:$FLOOR_SHA"
              ;;
            *)
              echo "::error::Deploy job received a non-deploy mode."
              exit 1
              ;;
          esac
          if [ "$CONFIRMATION" != "$EXPECTED_CONFIRMATION" ]; then
            echo "::error::Confirmation changed or no longer matches."
            exit 1
          fi

          export SOURCE_SHA MODE
          node - <<'NODE'
          const fs = require("node:fs");
          const provenance = JSON.parse(fs.readFileSync("dist/.release-source.json", "utf8"));
          if (provenance.sourceSha !== process.env.SOURCE_SHA || provenance.mode !== process.env.MODE) {
            throw new Error("artifact provenance does not match the approved request");
          }
          NODE

      - name: Deploy the approved artifact to gh-pages
        # H1: third-party action pinned by immutable commit SHA.
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy(${{ needs.build.outputs.mode }}): ${{ needs.build.outputs.source_sha }}"
